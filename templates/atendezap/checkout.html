<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento — AtendeZap</title>
<style>
  :root{--zap:#25D366;--zap2:#128C7E;--ink:#0f172a;--mut:#475569;--line:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f1f5f9}
  .wrap{max-width:440px;margin:0 auto;padding:28px 20px}
  .back{color:var(--mut);text-decoration:none;font-size:14px}
  h1{font-size:22px;margin:10px 0 4px}
  .resumo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;display:flex;justify-content:space-between;align-items:center}
  .resumo b{font-size:20px}
  form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
  label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
  .btn{width:100%;margin-top:18px;background:var(--zap);color:#fff;border:0;font-weight:700;padding:14px;border-radius:12px;font-size:17px;cursor:pointer}
  .erro{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .hint{color:#94a3b8;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/atendezap/assinar">← Trocar de plano</a>
  <h1>Quase lá 👏</h1>
  <div class="resumo"><span>{{ p.label }}</span><b>{{ p.rotulo }}</b></div>
  <form method="post" action="/atendezap/checkout/{{ plano }}">
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <label>CPF ou CNPJ do responsável</label>
    <input name="cpf" placeholder="Só números" inputmode="numeric" required>
    <div class="hint">Necessário pra gerar a cobrança no PIX (Asaas).</div>
    <button class="btn" type="submit">Gerar PIX</button>
  </form>
</div>
</body>
</html>
