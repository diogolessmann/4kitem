<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — AtendeZap</title>
<style>
  :root{--zap:#25D366;--zap2:#128C7E;--ink:#0f172a;--mut:#475569}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f8fafc}
  .wrap{max-width:420px;margin:0 auto;padding:48px 20px}
  h1{font-size:24px;margin:.2em 0 18px;text-align:center}
  form{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:22px}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
  input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit}
  .btn{width:100%;margin-top:20px;background:var(--zap);color:#fff;border:0;font-weight:700;
       padding:14px;border-radius:12px;font-size:17px;cursor:pointer}
  .erro{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .alt{text-align:center;color:var(--mut);margin-top:16px;font-size:14px}
  a{color:var(--zap2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 Entrar no AtendeZap</h1>
  <form method="post" action="/atendezap/entrar">
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <label>E-mail</label>
    <input type="email" name="email" required>
    <label>Senha</label>
    <input type="password" name="senha" required>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <p class="alt">Não tem conta? <a href="/atendezap/cadastro">Criar grátis</a></p>
</div>
</body>
</html>
