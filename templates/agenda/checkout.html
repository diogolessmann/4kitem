<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assinar — AgendaJá</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f0f13;color:#e8e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  body::before{content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(39,174,96,.08) 0%,transparent 70%);pointer-events:none}
  .box{background:#1a1a24;border:1px solid rgba(39,174,96,.15);border-radius:24px;padding:40px 36px;width:100%;max-width:420px}
  .logo{text-align:center;font-size:36px;margin-bottom:6px}
  .logo-text{text-align:center;font-size:22px;font-weight:900;color:#27ae60;margin-bottom:4px}
  .sub{text-align:center;font-size:13px;color:#9090a8;margin-bottom:28px}
  .error{background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:13px;margin-bottom:20px}
  .plan-box{background:#22222f;border:2px solid rgba(39,174,96,.3);border-radius:14px;padding:20px;text-align:center;margin-bottom:24px}
  .plan-name{font-size:18px;font-weight:800;color:#27ae60;margin-bottom:4px}
  .plan-price{font-size:32px;font-weight:900;margin-bottom:4px}
  .plan-price span{font-size:14px;font-weight:400;color:#9090a8}
  .plan-desc{font-size:12px;color:#9090a8}
  .section-title{font-size:12px;font-weight:700;color:#9090a8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
  .billing-options{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
  .billing-opt{display:flex;align-items:center;gap:12px;background:#22222f;border:2px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s}
  .billing-opt:has(input:checked){border-color:#27ae60;background:rgba(39,174,96,.08)}
  .billing-opt input{accent-color:#27ae60;width:18px;height:18px;flex-shrink:0}
  .billing-opt .opt-icon{font-size:22px}
  .billing-opt .opt-name{font-weight:700;font-size:14px}
  .billing-opt .opt-sub{font-size:11px;color:#9090a8}
  .btn{width:100%;padding:14px;background:linear-gradient(135deg,#27ae60,#2ecc71);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:.2s;font-family:inherit}
  .btn:hover{opacity:.9}
  .secure{text-align:center;margin-top:14px;font-size:11px;color:#9090a8}
  .back{display:block;text-align:center;margin-top:12px;font-size:12px;color:#9090a8}
  .back a{color:#27ae60}
</style>
</head>
<body>
<div class="box">
  <div class="logo">📅</div>
  <div class="logo-text">AgendaJá</div>
  <div class="sub">Assine e tenha sua agenda online funcionando</div>

  {% if erro %}<div class="error">⚠️ {{ erro }}</div>{% endif %}

  <div class="plan-box">
    <div class="plan-name">{{ plano.label }}</div>
    <div class="plan-price">R$ 63,90<span>/mês</span></div>
    <div class="plan-desc">Agendamentos ilimitados · Link próprio · WhatsApp automático</div>
  </div>

  <form method="POST">
    <div class="section-title">Período</div>
    <div class="billing-options">
      <label class="billing-opt">
        <input type="radio" name="ciclo" value="mensal" checked>
        <span class="opt-icon">📅</span>
        <div><div class="opt-name">Mensal — R$ 63,90/mês</div><div class="opt-sub">Renova todo mês, cancela quando quiser</div></div>
      </label>
      <label class="billing-opt">
        <input type="radio" name="ciclo" value="anual">
        <span class="opt-icon">🏆</span>
        <div><div class="opt-name">Anual — R$ 639,00</div><div class="opt-sub">2 meses grátis · preço travado 12 meses</div></div>
      </label>
    </div>
    <div class="section-title">Forma de pagamento</div>
    <div class="billing-options">
      <label class="billing-opt">
        <input type="radio" name="billing_type" value="PIX" checked>
        <span class="opt-icon">⚡</span>
        <div><div class="opt-name">PIX</div><div class="opt-sub">Aprovação imediata</div></div>
      </label>
      <label class="billing-opt">
        <input type="radio" name="billing_type" value="BOLETO">
        <span class="opt-icon">🏦</span>
        <div><div class="opt-name">Boleto bancário</div><div class="opt-sub">Vencimento em 3 dias úteis</div></div>
      </label>
      <label class="billing-opt">
        <input type="radio" name="billing_type" value="CREDIT_CARD">
        <span class="opt-icon">💳</span>
        <div><div class="opt-name">Cartão de crédito</div><div class="opt-sub">Parcelado em até 12x</div></div>
      </label>
    </div>
    <button type="submit" class="btn">🔒 Confirmar assinatura</button>
  </form>
  <div class="secure">🔒 Pagamento processado com segurança via Asaas</div>
  <div class="back"><a href="/agenda/painel">← Voltar ao painel</a></div>
</div>
</body>
</html>
