{% extends 'petmed/base.html' %}
{% block title %}Entrar — PETmed{% endblock %}
{% block content %}
<div style="max-width:420px;margin:40px auto">
  <div style="text-align:center;margin-bottom:28px">
    <div style="font-size:40px">🐾</div>
    <h1 style="font-size:22px;font-weight:800;margin-top:8px">Entrar no PETmed</h1>
    <p style="font-size:13px;color:var(--text3);margin-top:4px">Proteja seu pet 24 horas por dia</p>
  </div>

  {% if erro %}
  <div class="alert alert-error">{{ erro }}</div>
  {% endif %}

  <div class="card">
    <form method="POST" action="/petmed/entrar">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">
        Entrar →
      </button>
    </form>
  </div>

  <p style="text-align:center;font-size:13px;margin-top:16px;color:var(--text3)">
    Não tem conta? <a href="/petmed/cadastrar" style="color:var(--teal2);font-weight:700">Criar conta grátis</a>
  </p>
  <p style="text-align:center;font-size:12px;margin-top:8px">
    <a href="/petmed/vet/cadastro" style="color:var(--text3)">Sou veterinário — cadastrar-me</a>
  </p>
</div>
{% endblock %}
