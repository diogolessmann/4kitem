<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir senha — SomaJá 🐗</title>
<link rel="icon" type="image/svg+xml" href="/static/somaja/logo.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f0fdf4;color:#0f172a}
  .box{max-width:400px;margin:60px auto;background:#fff;border:1px solid #dcfce7;border-radius:18px;padding:28px;text-align:center}
  .logo{font-size:24px;font-weight:800;margin-bottom:6px}
  .sub{color:#475569;margin-bottom:22px;font-size:14px}
  label{display:block;text-align:left;font-size:14px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
  .btn{width:100%;background:#16a34a;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin-top:20px;text-decoration:none;display:block}
  .erro{background:#fef2f2;color:#b91c1c;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:8px}
  .ok{background:#dcfce7;color:#15803d;padding:14px;border-radius:10px;font-size:15px;margin-bottom:8px}
  a{color:#16a34a;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🐗 SomaJá</div>
  {% if ok %}
    <div class="ok">✅ Senha redefinida com sucesso!</div>
    <a class="btn" href="/somaja/entrar">Entrar agora</a>
  {% elif not valido %}
    <div class="sub">Redefinir senha</div>
    <div class="erro">Este link é inválido ou expirou. Peça um novo.</div>
    <a class="btn" href="/somaja/esqueci">Pedir novo link</a>
  {% else %}
    <div class="sub">Crie sua nova senha</div>
    <form method="POST" action="/somaja/redefinir">
      <input type="hidden" name="token" value="{{ token }}">
      {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
      <label>Nova senha</label>
      <input name="senha" type="password" required placeholder="mínimo 6 caracteres">
      <button class="btn" type="submit">Salvar nova senha</button>
    </form>
  {% endif %}
</div>
</body>
</html>
