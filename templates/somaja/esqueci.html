<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esqueci minha senha — SomaJá 🐗</title>
<link rel="icon" type="image/svg+xml" href="/static/somaja/logo.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f0fdf4;color:#0f172a}
  .box{max-width:400px;margin:60px auto;background:#fff;border:1px solid #dcfce7;border-radius:18px;padding:28px}
  .logo{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:#475569;margin-bottom:22px;font-size:14px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
  .btn{width:100%;background:#16a34a;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin-top:20px}
  .msg{background:#dcfce7;color:#15803d;padding:12px;border-radius:10px;font-size:14px;margin-bottom:8px}
  .link{text-align:center;margin-top:16px;font-size:14px;color:#475569}
  a{color:#16a34a;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<form class="box" method="POST" action="/somaja/esqueci">
  <div class="logo">🐗 SomaJá</div>
  <div class="sub">Esqueceu a senha? A gente te manda um link.</div>
  {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
  <label>Seu e-mail</label><input name="email" type="email" required placeholder="voce@email.com">
  <button class="btn" type="submit">Enviar link de redefinição</button>
  <div class="link"><a href="/somaja/entrar">← Voltar pro login</a></div>
</form>
</body>
</html>
