<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — SomaJá 🐗</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f0fdf4;color:#0f172a}
  .box{max-width:420px;margin:40px auto;background:#fff;border:1px solid #dcfce7;border-radius:18px;padding:28px}
  .logo{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:#475569;margin-bottom:22px;font-size:14px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
  .btn{width:100%;background:#16a34a;color:#fff;border:none;padding:14px;border-radius:12px;
       font-weight:700;font-size:16px;cursor:pointer;margin-top:20px}
  .erro{background:#fef2f2;color:#b91c1c;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:8px}
  .link{text-align:center;margin-top:16px;font-size:14px;color:#475569}
  a{color:#16a34a;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<form class="box" method="POST" action="/somaja/cadastrar">
  <div class="logo">🐗 SomaJá</div>
  <div class="sub">Crie sua conta e teste 7 dias grátis</div>
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  <label>Seu nome</label><input name="nome" required placeholder="Como te chamam?">
  <label>E-mail</label><input name="email" type="email" required placeholder="voce@email.com">
  <label>WhatsApp (opcional)</label><input name="telefone" placeholder="(47) 99999-9999">
  <label>Sua renda mensal (opcional)</label><input name="renda" placeholder="Ex: 3000 — ajuda o coach">
  <label>Senha</label><input name="senha" type="password" required placeholder="mínimo 6 caracteres">
  <button class="btn" type="submit">Criar conta grátis</button>
  <div style="text-align:center;font-size:12px;color:#64748b;margin-top:10px;line-height:1.5">
    Ao criar a conta, você concorda com os <a href="/termos" target="_blank">Termos de Uso</a> e a
    <a href="/privacidade" target="_blank">Política de Privacidade</a>.
  </div>
  <div class="link">Já tem conta? <a href="/somaja/entrar">Entrar</a></div>
</form>
</body>
</html>
