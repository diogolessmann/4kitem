<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧪 Ordena as Cores</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #07060f;
    color: #f0f0ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  #app {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: linear-gradient(180deg, rgba(168,85,247,0.10), rgba(7,6,15,0));
    border-bottom: 1px solid rgba(168,85,247,0.18);
  }
  .back {
    color: #22d3ee;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 10px;
    border: 1px solid rgba(34,211,238,0.35);
    border-radius: 12px;
    white-space: nowrap;
    transition: background .15s;
  }
  .back:active { background: rgba(34,211,238,0.12); }
  .title {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
    color: #f0f0ff;
  }
  .title .emoji { filter: drop-shadow(0 0 6px rgba(52,211,153,.5)); }
  /* Scoreboard */
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px 14px 4px;
    flex-wrap: wrap;
  }
  .chip {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    min-width: 78px;
  }
  .chip .label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b8ba7;
    margin-bottom: 2px;
  }
  .chip .val { font-size: 18px; font-weight: 800; }
  .chip.level .val { color: #a855f7; }
  .chip.solved .val { color: #34d399; }
  .chip.record .val { color: #22d3ee; }
  /* Board */
  .board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 6px;
    min-height: 0;
  }
  canvas {
    display: block;
    touch-action: none;
    max-width: 100%;
    border-radius: 16px;
  }
  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    padding: 8px 14px 18px;
    justify-content: center;
  }
  .btn {
    flex: 1;
    max-width: 150px;
    padding: 13px 10px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.04);
    color: #f0f0ff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .08s, background .15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.96); }
  .btn.undo { border-color: rgba(34,211,238,0.30); }
  .btn.undo:active { background: rgba(34,211,238,0.12); }
  .btn.new { border-color: rgba(168,85,247,0.30); }
  .btn.new:active { background: rgba(168,85,247,0.12); }
  .btn:disabled { opacity: .35; cursor: default; }
  /* Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%) scale(.9);
    background: rgba(52,211,153,0.14);
    border: 1px solid rgba(52,211,153,0.5);
    color: #34d399;
    padding: 10px 20px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 20;
    backdrop-filter: blur(4px);
  }
  .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  /* Win overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(7,6,15,0.82);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .card {
    max-width: 380px;
    width: 100%;
    background: linear-gradient(180deg, rgba(168,85,247,0.10), rgba(34,211,238,0.05));
    border: 1px solid rgba(168,85,247,0.30);
    border-radius: 22px;
    padding: 26px 22px;
    text-align: center;
    box-shadow: 0 0 60px rgba(168,85,247,0.20);
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    background: linear-gradient(90deg,#22d3ee,#a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card .sub { color: #b8b8d0; font-size: 14px; margin-bottom: 18px; }
  .card .stats {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .card .stat { text-align: center; }
  .card .stat .n { font-size: 30px; font-weight: 900; }
  .card .stat.a .n { color: #34d399; }
  .card .stat.b .n { color: #22d3ee; }
  .card .stat .t { font-size: 11px; color: #8b8ba7; text-transform: uppercase; letter-spacing: 1px; }
  .card .actions { display: flex; flex-direction: column; gap: 10px; }
  .bigbtn {
    padding: 15px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: transform .08s, filter .15s;
  }
  .bigbtn:active { transform: scale(0.97); }
  .bigbtn.share {
    background: linear-gradient(90deg,#22d3ee,#34d399);
    color: #07060f;
  }
  .bigbtn.share:active { filter: brightness(1.1); }
  .bigbtn.again {
    background: rgba(168,85,247,0.15);
    border: 1px solid rgba(168,85,247,0.5);
    color: #f0f0ff;
  }
  .newrec {
    color: #22d3ee;
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 14px;
    display: none;
  }
  .newrec.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="back" href="/arena">← Arena</a>
    <div class="title"><span class="emoji">🧪</span> Ordena as Cores</div>
  </div>
  <div class="scoreboard">
    <div class="chip level"><span class="label">Nível</span><span class="val" id="lvl">1</span></div>
    <div class="chip solved"><span class="label">Resolvidos</span><span class="val" id="solved">0</span></div>
    <div class="chip record"><span class="label">Recorde</span><span class="val" id="record">0</span></div>
  </div>
  <div class="board-wrap">
    <canvas id="game"></canvas>
  </div>
  <div class="controls">
    <button class="btn undo" id="undoBtn">↩ Desfazer</button>
    <button class="btn new" id="newBtn">🔄 Novo</button>
  </div>
  <div class="toast" id="toast">Resolvido! ✓</div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="winTitle">Você ordenou! 🧪</h2>
    <div class="sub" id="winSub">Todos os tubos organizados.</div>
    <div class="newrec" id="newrec">🏆 NOVO RECORDE!</div>
    <div class="stats">
      <div class="stat a"><div class="n" id="statSolved">0</div><div class="t">Resolvidos</div></div>
      <div class="stat b"><div class="n" id="statRecord">0</div><div class="t">Recorde</div></div>
    </div>
    <div class="actions">
      <button class="bigbtn share" id="shareBtn">📲 Bata meu recorde!</button>
      <button class="bigbtn again" id="againBtn">Jogar de novo</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var REC_KEY = "ordena_cores_recorde_v1";

  // Elegant, distinct color palette
  var PALETTE = [
    "#22d3ee", // ciano
    "#a855f7", // roxo
    "#34d399", // verde
    "#f472b6", // rosa
    "#fbbf24", // ambar
    "#60a5fa", // azul
    "#fb7185", // coral
    "#a3e635", // lima
    "#e879f9", // magenta
    "#2dd4bf"  // teal
  ];

  var CAP = 4; // camadas por tubo

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  // Game state
  var tubes = [];        // array of arrays; index 0 = bottom
  var numColors = 0;
  var history = [];      // for undo (deep snapshots)
  var selected = -1;     // selected source tube index
  var level = 1;
  var solved = 0;
  var record = 0;
  var animating = false;

  // Layout (computed)
  var layout = { cols:0, rows:0, tubeW:0, tubeH:0, gapX:0, gapY:0, padX:0, padY:0, w:0, h:0, dpr:1 };

  // ---------- Persistence ----------
  function loadRecord(){
    try {
      var v = parseInt(localStorage.getItem(REC_KEY), 10);
      record = (isNaN(v) || v < 0) ? 0 : v;
    } catch(e){ record = 0; }
  }
  function saveRecord(){
    try { localStorage.setItem(REC_KEY, String(record)); } catch(e){}
  }

  // ---------- Level generation (always solvable) ----------
  function levelConfig(lv){
    // number of colors grows with level, capped
    var colors = Math.min(3 + Math.floor((lv-1)/2), PALETTE.length);
    if (colors < 3) colors = 3;
    var empties = 2;
    return { colors: colors, empties: empties };
  }

  function shuffle(arr){
    for (var i = arr.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function isSolvedState(state){
    for (var i=0;i<state.length;i++){
      var t = state[i];
      if (t.length === 0) continue;
      if (t.length !== CAP) return false;
      var c = t[0];
      for (var k=1;k<t.length;k++) if (t[k] !== c) return false;
    }
    return true;
  }

  // Deep clone a tube array
  function clone(state){
    var out = new Array(state.length);
    for (var i=0;i<state.length;i++) out[i] = state[i].slice();
    return out;
  }

  // Legal pour check on a given state
  function canPourState(state, from, to){
    if (from === to) return false;
    var f = state[from], t = state[to];
    if (f.length === 0) return false;
    if (t.length >= CAP) return false;
    var top = f[f.length-1];
    if (t.length === 0) return true;
    return t[t.length-1] === top;
  }

  // How many units pour from -> to
  function pourCount(state, from, to){
    var f = state[from];
    var top = f[f.length-1];
    var n = 0;
    for (var i=f.length-1; i>=0 && f[i]===top; i--) n++;
    var space = CAP - state[to].length;
    return Math.min(n, space);
  }

  function applyPour(state, from, to){
    var n = pourCount(state, from, to);
    for (var i=0;i<n;i++){
      state[to].push(state[from].pop());
    }
    return n;
  }

  // Canonical key of a state (order of tubes irrelevant) for the solver's visited set.
  function stateKey(state){
    var parts = [];
    for (var i=0;i<state.length;i++) parts.push(state[i].join(","));
    parts.sort();
    return parts.join("|");
  }

  function nowMs(){
    return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
  }

  // Bounded DFS solver: proves a board is solvable. Returns true / false / "timeout".
  // Both an iteration cap AND a wall-clock budget guard the loop so the browser never
  // freezes even on a pathological / unsolvable candidate board.
  function isSolvable(state, capIters, deadline){
    capIters = capIters || 120000;
    if (!deadline) deadline = nowMs() + 40; // ms budget for this single proof
    var visited = {};
    var stack = [clone(state)];
    var iters = 0;
    while (stack.length){
      iters++;
      if (iters > capIters) return "timeout";
      if ((iters & 2047) === 0 && nowMs() > deadline) return "timeout";
      var cur = stack.pop();
      if (isSolvedState(cur)) return true;
      var k = stateKey(cur);
      if (visited[k]) continue;
      visited[k] = true;
      for (var i=0;i<cur.length;i++){
        if (cur[i].length === 0) continue;
        for (var j=0;j<cur.length;j++){
          if (canPourState(cur, i, j)){
            var nx = clone(cur);
            applyPour(nx, i, j);
            if (!visited[stateKey(nx)]) stack.push(nx);
          }
        }
      }
    }
    return false;
  }

  // Generate a solvable, non-trivial level.
  // CORRECT method: fill color tubes with a randomly shuffled multiset of color units,
  // add empty tubes, then ACCEPT the board only if it is (a) not already solved,
  // (b) reasonably mixed, and (c) proven solvable by the bounded solver.
  // (Scrambling a solved board by random legal pours does NOT work: it just permutes
  //  whole monochrome tubes and stays trivially solved.)
  function generateLevel(lv){
    var cfg = levelConfig(lv);
    numColors = cfg.colors;

    function buildSolved(){
      var s = [];
      for (var c=0;c<cfg.colors;c++){
        var col = [];
        for (var k=0;k<CAP;k++) col.push(c);
        s.push(col);
      }
      for (var e=0;e<cfg.empties;e++) s.push([]);
      return s;
    }

    var best = null;
    var genDeadline = nowMs() + 600; // hard cap on total generation time -> fallback if exceeded
    for (var attempt = 0; attempt < 400 && best === null && nowMs() < genDeadline; attempt++){
      // build shuffled multiset of all color units
      var units = [];
      for (var c=0;c<cfg.colors;c++){
        for (var k=0;k<CAP;k++) units.push(c);
      }
      shuffle(units);
      // deal into color tubes
      var s = [];
      var idx = 0;
      for (var t=0;t<cfg.colors;t++){
        s.push(units.slice(idx, idx+CAP));
        idx += CAP;
      }
      for (var e=0;e<cfg.empties;e++) s.push([]);

      if (isSolvedState(s)) continue;
      // require at least 2 mixed (non-uniform full) tubes so it isn't near-trivial
      var mixed = 0;
      for (var q=0;q<s.length;q++){
        var tb = s[q];
        if (tb.length === CAP){
          var allSame = true;
          for (var z=1;z<tb.length;z++) if (tb[z] !== tb[0]){ allSame = false; break; }
          if (!allSame) mixed++;
        }
      }
      if (mixed < 2) continue;

      var res = isSolvable(s);
      if (res === true){
        best = s;
      }
      // if false or "timeout", discard and try another fill (timeouts are extremely rare here)
    }

    if (best === null){
      // Guaranteed-solvable fallback: solved board with the top two units of two tubes swapped,
      // buffered through an empty. This is always reversible => always solvable.
      best = buildSolved();
      if (cfg.empties >= 1 && cfg.colors >= 2){
        var emptyIdx = cfg.colors; // first empty tube
        // swap the top layer of tube 0 and tube 1 using the empty as a one-slot buffer
        var a = best[0].pop();       // color 0
        var b = best[1].pop();       // color 1
        best[emptyIdx].push(a);      // buffer color 0
        best[1].push(a);             // tube1 top becomes color 0
        best[0].push(b);             // tube0 top becomes color 1
        best[emptyIdx].pop();        // empty buffer again -> empty
      }
    }

    tubes = best;
    selected = -1;
    history = [];
    animating = false;
    computeLayout();
    render();
    updateUndoBtn();
  }

  // ---------- Layout ----------
  function computeLayout(){
    var wrap = canvas.parentElement;
    var availW = Math.min(wrap.clientWidth - 12, 448);
    if (availW < 240) availW = 240;
    // available height: viewport minus other UI, roughly
    var availH = wrap.clientHeight - 8;
    if (!availH || availH < 200) availH = Math.max(280, window.innerHeight * 0.5);

    var n = tubes.length;
    // choose columns to fit nicely
    var cols;
    if (n <= 4) cols = n;
    else if (n <= 6) cols = 3;
    else if (n <= 8) cols = 4;
    else if (n <= 10) cols = 5;
    else if (n <= 12) cols = 4;
    else cols = 5;
    if (cols > n) cols = n;
    var rows = Math.ceil(n / cols);

    var gapX = 14, gapY = 20;
    var padX = 12, padY = 16;

    // tube width based on width
    var tubeW = (availW - padX*2 - gapX*(cols-1)) / cols;
    // tube height ~ 3.6x width but must fit available height
    var tubeH = tubeW * 3.4;
    var neededH = padY*2 + rows*tubeH + gapY*(rows-1);
    if (neededH > availH){
      // shrink tubeH (and consequently width proportionally to keep aspect) to fit
      var maxTubeH = (availH - padY*2 - gapY*(rows-1)) / rows;
      tubeH = maxTubeH;
      var tw2 = tubeH / 3.4;
      if (tw2 < tubeW) tubeW = tw2;
    }
    // recompute canvas width from tube width so it's centered/tight
    var totalW = padX*2 + cols*tubeW + gapX*(cols-1);
    var totalH = padY*2 + rows*tubeH + gapY*(rows-1);

    layout.cols = cols; layout.rows = rows;
    layout.tubeW = tubeW; layout.tubeH = tubeH;
    layout.gapX = gapX; layout.gapY = gapY;
    layout.padX = padX; layout.padY = padY;
    layout.w = totalW; layout.h = totalH;

    var dpr = window.devicePixelRatio || 1;
    if (dpr > 3) dpr = 3;
    layout.dpr = dpr;
    canvas.width = Math.round(totalW * dpr);
    canvas.height = Math.round(totalH * dpr);
    canvas.style.width = totalW + "px";
    canvas.style.height = totalH + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function tubeRect(idx){
    var col = idx % layout.cols;
    var row = Math.floor(idx / layout.cols);
    // center last row if not full
    var itemsInRow = Math.min(layout.cols, tubes.length - row*layout.cols);
    var rowW = itemsInRow*layout.tubeW + (itemsInRow-1)*layout.gapX;
    var startX = (layout.w - rowW)/2;
    var x = startX + col*(layout.tubeW + layout.gapX);
    var y = layout.padY + row*(layout.tubeH + layout.gapY);
    return { x:x, y:y, w:layout.tubeW, h:layout.tubeH };
  }

  // ---------- Rendering ----------
  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function drawTube(idx){
    var r = tubeRect(idx);
    var wobble = 0;
    var lift = 0;
    if (idx === selected){ lift = -Math.min(14, r.h*0.06); }
    var x = r.x, y = r.y + lift, w = r.w, h = r.h;
    var radius = w*0.42;
    var wallR = w*0.42;

    ctx.save();

    // Glass outer glow if selected
    if (idx === selected){
      ctx.shadowColor = "rgba(34,211,238,0.55)";
      ctx.shadowBlur = 18;
    }

    // Glass body path (rounded bottom, open top)
    var topR = w*0.14;
    ctx.beginPath();
    ctx.moveTo(x, y+topR);
    ctx.quadraticCurveTo(x, y, x+topR, y);
    ctx.lineTo(x+w-topR, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+topR);
    ctx.lineTo(x+w, y+h-wallR);
    ctx.quadraticCurveTo(x+w, y+h, x+w-wallR, y+h);
    ctx.lineTo(x+wallR, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-wallR);
    ctx.closePath();

    // clip to draw liquid inside
    ctx.save();
    ctx.clip();

    // inner background
    ctx.fillStyle = "rgba(255,255,255,0.02)";
    ctx.fillRect(x, y, w, h);

    // draw liquid layers
    var tube = tubes[idx];
    // usable interior height (leave small top margin)
    var interiorTop = y + topR + 2;
    var interiorBottom = y + h - 2;
    var interiorH = interiorBottom - interiorTop;
    var layerH = interiorH / CAP;

    for (var i=0;i<tube.length;i++){
      var colorIdx = tube[i];
      var col = PALETTE[colorIdx % PALETTE.length];
      var ly = interiorBottom - (i+1)*layerH;
      var lh = layerH;
      // subtle gradient per layer for depth
      var grad = ctx.createLinearGradient(x, ly, x, ly+lh);
      grad.addColorStop(0, shade(col, 1.12));
      grad.addColorStop(1, shade(col, 0.86));
      ctx.fillStyle = grad;
      ctx.fillRect(x-2, ly, w+4, lh+1);
      // top highlight line of each layer
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.fillRect(x-2, ly, w+4, Math.max(1, lh*0.10));
    }
    ctx.restore(); // unclip

    // glass rim + walls stroke
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(x, y+topR);
    ctx.quadraticCurveTo(x, y, x+topR, y);
    ctx.lineTo(x+w-topR, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+topR);
    ctx.lineTo(x+w, y+h-wallR);
    ctx.quadraticCurveTo(x+w, y+h, x+w-wallR, y+h);
    ctx.lineTo(x+wallR, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-wallR);
    ctx.closePath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = idx===selected ? "rgba(34,211,238,0.85)" : "rgba(240,240,255,0.18)";
    ctx.stroke();

    // glass vertical highlight
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(x + w*0.14, y+topR, Math.max(2, w*0.08), h - topR - wallR*0.4);

    ctx.restore();
  }

  // shade a hex color by factor (>1 lighter, <1 darker)
  function shade(hex, f){
    var c = hex.replace("#","");
    var r = parseInt(c.substring(0,2),16);
    var g = parseInt(c.substring(2,4),16);
    var b = parseInt(c.substring(4,6),16);
    r = Math.min(255, Math.round(r*f));
    g = Math.min(255, Math.round(g*f));
    b = Math.min(255, Math.round(b*f));
    return "rgb("+r+","+g+","+b+")";
  }

  function render(){
    ctx.clearRect(0,0,layout.w,layout.h);
    for (var i=0;i<tubes.length;i++){
      drawTube(i);
    }
  }

  // ---------- Interaction ----------
  function hitTest(px, py){
    for (var i=0;i<tubes.length;i++){
      var r = tubeRect(i);
      // include selection lift region a bit
      var pad = 6;
      if (px >= r.x-pad && px <= r.x+r.w+pad && py >= r.y-18 && py <= r.y+r.h+pad){
        return i;
      }
    }
    return -1;
  }

  function getCanvasPos(evt){
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (evt.touches && evt.touches.length){
      cx = evt.touches[0].clientX; cy = evt.touches[0].clientY;
    } else if (evt.changedTouches && evt.changedTouches.length){
      cx = evt.changedTouches[0].clientX; cy = evt.changedTouches[0].clientY;
    } else {
      cx = evt.clientX; cy = evt.clientY;
    }
    var scaleX = layout.w / rect.width;
    var scaleY = layout.h / rect.height;
    return { x:(cx-rect.left)*scaleX, y:(cy-rect.top)*scaleY };
  }

  function onTap(idx){
    if (animating || idx < 0) return;
    if (selected === -1){
      // select only non-empty tubes
      if (tubes[idx].length === 0) return;
      selected = idx;
      render();
      return;
    }
    if (idx === selected){
      // deselect
      selected = -1;
      render();
      return;
    }
    // attempt pour selected -> idx
    if (canPourState(tubes, selected, idx)){
      doPour(selected, idx);
      selected = -1;
    } else {
      // switch selection to new tube if non-empty, else just clear
      if (tubes[idx].length > 0){
        selected = idx;
        render();
      } else {
        selected = -1;
        render();
      }
    }
  }

  function doPour(from, to){
    // snapshot for undo
    history.push(clone(tubes));
    if (history.length > 200) history.shift();
    var n = pourCount(tubes, from, to);
    animatePour(from, to, n, function(){
      applyPour(tubes, from, to);
      render();
      updateUndoBtn();
      if (isSolvedState(tubes)){
        onLevelSolved();
      } else if (!hasAnyMove()){
        // empacou: sem jogadas legais e não resolvido -> tela de fim
        // trava a interação com o tabuleiro durante a transição
        animating = true;
        updateUndoBtn();
        showToast("Empacou! 🚫");
        setTimeout(function(){ showOverlay("stuck"); }, 650);
      }
    });
  }

  // Simple pour animation: briefly lift source and flash destination
  function animatePour(from, to, n, done){
    animating = true;
    var start = performance.now();
    var dur = 260;
    var fromRect = tubeRect(from);
    var toRect = tubeRect(to);

    function frame(t){
      var p = (t - start)/dur;
      if (p >= 1){ p = 1; }
      render();
      // draw a pouring arc of liquid from source top to dest top
      var col = PALETTE[tubes[from][tubes[from].length-1] % PALETTE.length];
      var sx = fromRect.x + fromRect.w/2;
      var sy = fromRect.y + fromRect.h*0.06;
      var dx = toRect.x + toRect.w/2;
      var dy = toRect.y + toRect.h*0.06;
      ctx.save();
      ctx.globalAlpha = 0.75 * Math.sin(p*Math.PI);
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(3, fromRect.w*0.14);
      ctx.lineCap = "round";
      ctx.beginPath();
      var midx = (sx+dx)/2;
      var midy = Math.min(sy,dy) - fromRect.h*0.12;
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(midx, midy, dx, dy);
      ctx.stroke();
      ctx.restore();

      if (p < 1){
        requestAnimationFrame(frame);
      } else {
        animating = false;
        done();
      }
    }
    requestAnimationFrame(frame);
  }

  // ---------- Level solved / progression ----------
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(function(){ el.classList.remove("show"); }, 900);
  }

  function onLevelSolved(){
    solved++;
    if (solved > record){
      record = solved;
      saveRecord();
    }
    // trava a interação até o próximo nível ser gerado (generateLevel reseta animating)
    animating = true;
    updateScoreboard();
    updateUndoBtn();
    showToast("Resolvido! ✓");
    selected = -1;
    // fun flow: auto-advance to the next (harder) level after a short beat
    setTimeout(function(){
      level++;
      updateScoreboard();
      generateLevel(level);
    }, 950);
  }

  // Any legal pour available in the current board?
  function hasAnyMove(){
    for (var i=0;i<tubes.length;i++){
      if (tubes[i].length === 0) continue;
      for (var j=0;j<tubes.length;j++){
        if (canPourState(tubes, i, j)) return true;
      }
    }
    return false;
  }

  // Water Sort é infinito por níveis. A tela de FIM (fechamento + compartilhar) aparece
  // organicamente quando o jogador EMPACA (sem jogadas e sem resolver) ou toca em "Novo".
  function showOverlay(reason){
    document.getElementById("statSolved").textContent = solved;
    document.getElementById("statRecord").textContent = record;
    var nr = document.getElementById("newrec");
    nr.classList.toggle("show", solved > 0 && solved >= record);
    if (reason === "stuck"){
      document.getElementById("winTitle").textContent = "Empacou! 🧪";
      document.getElementById("winSub").textContent = "Sem mais jogadas neste tubo. Bora de novo?";
    } else {
      document.getElementById("winTitle").textContent = "Fim da rodada 🧪";
      document.getElementById("winSub").textContent = "Bora bater esse placar de novo?";
    }
    document.getElementById("overlay").classList.add("show");
  }
  function hideOverlay(){
    document.getElementById("overlay").classList.remove("show");
  }

  // ---------- Scoreboard ----------
  function updateScoreboard(){
    document.getElementById("lvl").textContent = level;
    document.getElementById("solved").textContent = solved;
    document.getElementById("record").textContent = record;
  }
  function updateUndoBtn(){
    document.getElementById("undoBtn").disabled = history.length === 0 || animating;
  }

  // ---------- Buttons ----------
  function undo(){
    if (animating) return;
    if (history.length === 0) return;
    tubes = history.pop();
    selected = -1;
    render();
    updateUndoBtn();
  }

  function newRun(){
    // ends current run -> show shareable end card with the run result
    if (solved > 0){
      showOverlay("end");
    } else {
      // nothing achieved yet, just reshuffle current level
      generateLevel(level);
    }
  }

  function restartAll(){
    hideOverlay();
    level = 1;
    solved = 0;
    updateScoreboard();
    generateLevel(1);
  }

  function share(){
    var txt = "🧪 Ordena as Cores na Arena! Resolvi " + record + " nível" + (record===1?"":"s") + " seguidos. Bate meu recorde?";
    location.href = "https://wa.me/?text=" + encodeURIComponent(txt + " " + location.href);
  }

  // ---------- Events ----------
  var pointerDownIdx = -1;

  function handleDown(evt){
    if (evt.cancelable) evt.preventDefault();
    if (animating) return;
    var pos = getCanvasPos(evt);
    pointerDownIdx = hitTest(pos.x, pos.y);
  }
  function handleUp(evt){
    if (evt.cancelable) evt.preventDefault();
    if (animating) return;
    var pos = getCanvasPos(evt);
    var idx = hitTest(pos.x, pos.y);
    // tap = down and up on same tube (or just use up target for forgiving taps)
    if (idx >= 0){
      onTap(idx);
    } else if (selected !== -1){
      // tapped empty space -> deselect
      selected = -1;
      render();
    }
    pointerDownIdx = -1;
    updateUndoBtn();
  }

  // Use pointer events with fallback to touch/mouse
  if (window.PointerEvent){
    canvas.addEventListener("pointerdown", handleDown, {passive:false});
    canvas.addEventListener("pointerup", handleUp, {passive:false});
  } else {
    canvas.addEventListener("touchstart", handleDown, {passive:false});
    canvas.addEventListener("touchend", handleUp, {passive:false});
    canvas.addEventListener("mousedown", handleDown, {passive:false});
    canvas.addEventListener("mouseup", handleUp, {passive:false});
  }

  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("newBtn").addEventListener("click", newRun);
  document.getElementById("shareBtn").addEventListener("click", share);
  document.getElementById("againBtn").addEventListener("click", restartAll);

  // Resize handling (debounced)
  var resizeT = null;
  window.addEventListener("resize", function(){
    if (resizeT) clearTimeout(resizeT);
    resizeT = setTimeout(function(){
      computeLayout();
      render();
    }, 120);
  });
  window.addEventListener("orientationchange", function(){
    setTimeout(function(){ computeLayout(); render(); }, 200);
  });

  // Prevent double-tap zoom / scroll on the board
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

  // ---------- Init ----------
  function init(){
    loadRecord();
    level = 1;
    solved = 0;
    updateScoreboard();
    updateUndoBtn();
    // wait a frame so layout has real dimensions
    requestAnimationFrame(function(){
      generateLevel(1);
      updateUndoBtn();
    });
  }

  init();
})();
</script>
</body>
</html>
