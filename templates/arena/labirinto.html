<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Labirinto Neon — AmbitiON</title>
<style>
  :root{
    --bg:#07060f; --fg:#f0f0ff; --cyan:#22d3ee; --purple:#a855f7; --green:#34d399;
    --wall:#1b1636; --wall2:#2a2350; --path:#0d0b1e;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; justify-content:center;
    overscroll-behavior:none;
  }
  #app{
    width:100%; max-width:460px; min-height:100%;
    display:flex; flex-direction:column; padding:10px; gap:10px;
  }
  .topbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(168,85,247,.08));
    border:1px solid rgba(168,85,247,.35);
    border-radius:16px; padding:10px 12px;
  }
  .topbar a.back{
    color:var(--cyan); text-decoration:none; font-weight:600; font-size:14px;
    padding:6px 10px; border-radius:10px; border:1px solid rgba(34,211,238,.4);
    background:rgba(34,211,238,.06); white-space:nowrap;
  }
  .topbar a.back:active{background:rgba(34,211,238,.18);}
  .title{font-weight:700; font-size:15px; flex:1; text-align:center;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap;}
  .stats{display:flex; gap:8px; width:100%; justify-content:space-between;}
  .stat{
    flex:1; text-align:center; background:var(--path);
    border:1px solid rgba(240,240,255,.08); border-radius:12px; padding:6px 4px;
  }
  .stat .lbl{font-size:10px; letter-spacing:1px; opacity:.6; text-transform:uppercase;}
  .stat .val{font-size:18px; font-weight:800; margin-top:2px;}
  .stat.pts .val{color:var(--green);}
  .stat.rec .val{color:var(--purple);}
  .stat.lvl .val{color:var(--cyan);}
  .stat.time .val{color:var(--fg);}
  #stageWrap{
    position:relative; width:100%; aspect-ratio:1/1;
    border-radius:18px; overflow:hidden;
    border:1px solid rgba(34,211,238,.3);
    box-shadow:0 0 24px rgba(34,211,238,.12), inset 0 0 32px rgba(7,6,15,.8);
    background:var(--path); touch-action:none;
  }
  canvas{display:block; width:100%; height:100%; touch-action:none;}
  .hint{font-size:12px; text-align:center; opacity:.65; margin-top:-2px;}
  .pad{
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,44px);
    gap:6px; width:180px; margin:0 auto;
    grid-template-areas:". up ." "left down right" ". . .";
  }
  .pad button{
    font-size:20px; border:none; border-radius:12px; color:var(--fg);
    background:rgba(168,85,247,.14); border:1px solid rgba(168,85,247,.35);
    touch-action:none;
  }
  .pad button:active{background:rgba(34,211,238,.28);}
  .pad .up{grid-area:up;} .pad .down{grid-area:down;}
  .pad .left{grid-area:left;} .pad .right{grid-area:right;}
  .controls{display:flex; gap:8px;}
  .controls button{
    flex:1; padding:12px; border-radius:14px; font-weight:700; font-size:14px;
    border:1px solid rgba(240,240,255,.15); background:rgba(240,240,255,.05); color:var(--fg);
  }
  .controls button.end{border-color:rgba(255,90,120,.4); color:#ff9db0; background:rgba(255,90,120,.08);}
  .controls button:active{filter:brightness(1.3);}
  /* overlay fim */
  #over{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(7,6,15,.92); backdrop-filter:blur(3px); padding:20px;
  }
  #over.show{display:flex;}
  #over h2{font-size:26px; background:linear-gradient(90deg,var(--cyan),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  #over .finalScore{font-size:44px; font-weight:900; color:var(--green);}
  #over .sub{font-size:14px; opacity:.8;}
  #over .rec{font-size:15px; color:var(--purple); font-weight:700;}
  #over .btns{display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px;}
  #over button{
    padding:14px; border-radius:16px; font-weight:800; font-size:15px; border:none; color:#07060f;
  }
  #over .share{background:linear-gradient(90deg,var(--green),#10b981);}
  #over .again{background:linear-gradient(90deg,var(--cyan),var(--purple)); color:#07060f;}
  #over button:active{filter:brightness(1.15);}
  .newbadge{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(52,211,153,.15); border:1px solid var(--green); color:var(--green);
    padding:6px 14px; border-radius:20px; font-weight:800; font-size:14px;
    opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .newbadge.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="back" href="/arena">← Arena</a>
    <div class="title">🧩 Labirinto Neon</div>
    <div class="stats">
      <div class="stat pts"><div class="lbl">Pontos</div><div class="val" id="uiPts">0</div></div>
      <div class="stat rec"><div class="lbl">Recorde</div><div class="val" id="uiRec">0</div></div>
      <div class="stat lvl"><div class="lbl">Nível</div><div class="val" id="uiLvl">1</div></div>
      <div class="stat time"><div class="lbl">Tempo</div><div class="val" id="uiTime">0s</div></div>
    </div>
  </div>

  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div class="newbadge" id="newbadge">✨ Nível +1</div>
    <div id="over">
      <h2>Fim de jogo</h2>
      <div class="finalScore" id="finalScore">0</div>
      <div class="sub" id="finalSub"></div>
      <div class="rec" id="finalRec"></div>
      <div class="btns">
        <button class="share" id="btnShare">📲 Bata meu recorde!</button>
        <button class="again" id="btnAgain">Jogar de novo</button>
      </div>
    </div>
  </div>

  <div class="hint">Arraste o dedo na direção • ou use as setas</div>

  <div class="pad">
    <button class="up" data-dir="up" aria-label="cima">▲</button>
    <button class="left" data-dir="left" aria-label="esquerda">◀</button>
    <button class="down" data-dir="down" aria-label="baixo">▼</button>
    <button class="right" data-dir="right" aria-label="direita">▶</button>
  </div>

  <div class="controls">
    <button class="end" id="btnEnd">Encerrar</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var REC_KEY = "labirinto_neon_recorde_v1";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var uiPts = document.getElementById("uiPts");
  var uiRec = document.getElementById("uiRec");
  var uiLvl = document.getElementById("uiLvl");
  var uiTime = document.getElementById("uiTime");
  var over = document.getElementById("over");
  var finalScore = document.getElementById("finalScore");
  var finalSub = document.getElementById("finalSub");
  var finalRec = document.getElementById("finalRec");
  var newbadge = document.getElementById("newbadge");

  // ---- estado ----
  var GRID = 11;               // ímpar p/ algoritmo de maze
  var cell = 40;               // recalculado no resize
  var maze = [];               // 1=parede, 0=caminho
  var coins = [];              // {c,r}
  var player = {c:1, r:1};
  var exitCell = {c:GRID-2, r:GRID-2};
  var startCell = {c:1, r:1};

  var score = 0;
  var coinsTotal = 0;
  var level = 1;
  var record = 0;
  var startTime = 0;
  var elapsed = 0;
  var running = false;

  try { record = parseInt(localStorage.getItem(REC_KEY)) || 0; } catch(e){ record = 0; }

  function fitCanvas(){
    var rect = cv.getBoundingClientRect();
    var size = Math.max(160, Math.floor(Math.min(rect.width, rect.height)));
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.floor(size * dpr);
    cv.height = Math.floor(size * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cell = size / GRID;
  }

  // ---- geração do labirinto (recursive backtracker, garante caminho) ----
  function generateMaze(){
    var g = [];
    var r,c;
    for(r=0;r<GRID;r++){ g[r]=[]; for(c=0;c<GRID;c++){ g[r][c]=1; } }

    var stack = [];
    var sr=1, sc=1;
    g[sr][sc]=0;
    stack.push([sr,sc]);
    var dirs = [[-2,0],[2,0],[0,-2],[0,2]];

    while(stack.length){
      var top = stack[stack.length-1];
      var cr = top[0], cc = top[1];
      // vizinhos não visitados a 2 de distância
      var nb = [];
      for(var i=0;i<4;i++){
        var nr = cr + dirs[i][0], nc = cc + dirs[i][1];
        if(nr>0 && nr<GRID-1 && nc>0 && nc<GRID-1 && g[nr][nc]===1){
          nb.push([nr,nc,cr+dirs[i][0]/2,cc+dirs[i][1]/2]);
        }
      }
      if(nb.length){
        var pick = nb[(Math.random()*nb.length)|0];
        g[pick[2]][pick[3]] = 0; // abre parede entre
        g[pick[0]][pick[1]] = 0; // abre célula
        stack.push([pick[0],pick[1]]);
      } else {
        stack.pop();
      }
    }

    // garante que entrada e saída sejam caminho
    g[1][1]=0;
    g[GRID-2][GRID-2]=0;
    // pequenas aberturas extras p/ deixar menos "linear" (só abrem, nunca bloqueiam)
    var extra = 4;
    var tries = 0;
    while(extra>0 && tries<60){
      tries++;
      var rr = 1 + ((Math.random()*(GRID-2))|0);
      var rc = 1 + ((Math.random()*(GRID-2))|0);
      if(g[rr][rc]===1){
        var open=0;
        if(g[rr-1] && g[rr-1][rc]===0) open++;
        if(g[rr+1] && g[rr+1][rc]===0) open++;
        if(g[rr][rc-1]===0) open++;
        if(g[rr][rc+1]===0) open++;
        if(open>=2){ g[rr][rc]=0; extra--; }
      }
    }
    return g;
  }

  function scatterCoins(){
    coins = [];
    var open = [];
    for(var r=0;r<GRID;r++) for(var c=0;c<GRID;c++){
      if(maze[r][c]===0){
        if(c===startCell.c && r===startCell.r) continue;
        if(c===exitCell.c && r===exitCell.r) continue;
        open.push({c:c,r:r});
      }
    }
    // embaralha
    for(var i=open.length-1;i>0;i--){
      var j=(Math.random()*(i+1))|0; var t=open[i]; open[i]=open[j]; open[j]=t;
    }
    var n = Math.min(open.length, 5 + Math.min(level,6)); // 5..11 moedas
    for(var k=0;k<n;k++) coins.push(open[k]);
  }

  function newLevel(first){
    maze = generateMaze();
    startCell = {c:1, r:1};
    exitCell = {c:GRID-2, r:GRID-2};
    player = {c:startCell.c, r:startCell.r};
    scatterCoins();
    if(!first){
      score += 250; // bônus por nível
      showBadge();
    }
    updateUI();
  }

  function showBadge(){
    newbadge.classList.add("show");
    setTimeout(function(){ newbadge.classList.remove("show"); }, 900);
  }

  function canMove(c,r){
    if(c<0||r<0||c>=GRID||r>=GRID) return false;
    return maze[r][c]===0;
  }

  function tryMove(dir){
    if(!running) return;
    var nc=player.c, nr=player.r;
    if(dir==="up") nr--;
    else if(dir==="down") nr++;
    else if(dir==="left") nc--;
    else if(dir==="right") nc++;
    if(!canMove(nc,nr)) return;
    player.c=nc; player.r=nr;

    // coleta moeda
    for(var i=coins.length-1;i>=0;i--){
      if(coins[i].c===nc && coins[i].r===nr){
        coins.splice(i,1);
        coinsTotal++;
        score += 100;
        updateUI();
        break;
      }
    }
    // chegou na saída
    if(nc===exitCell.c && nr===exitCell.r){
      level++;
      newLevel(false);
    }
  }

  function updateUI(){
    uiPts.textContent = score;
    uiRec.textContent = record;
    uiLvl.textContent = level;
  }

  // ---- desenho ----
  function draw(){
    var w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#0d0b1e";
    ctx.fillRect(0,0,w,h);

    var r,c,x,y;
    // paredes
    for(r=0;r<GRID;r++){
      for(c=0;c<GRID;c++){
        x=c*cell; y=r*cell;
        if(maze[r][c]===1){
          ctx.fillStyle = "#1b1636";
          ctx.fillRect(x,y,cell+0.5,cell+0.5);
          ctx.fillStyle = "rgba(168,85,247,0.10)";
          ctx.fillRect(x,y,cell+0.5,3);
        }
      }
    }

    // saída (destaque verde)
    x=exitCell.c*cell; y=exitCell.r*cell;
    ctx.save();
    ctx.shadowColor="#34d399"; ctx.shadowBlur=14;
    ctx.fillStyle="rgba(52,211,153,0.22)";
    roundRect(x+cell*0.12, y+cell*0.12, cell*0.76, cell*0.76, cell*0.18);
    ctx.fill();
    ctx.restore();
    ctx.font = Math.floor(cell*0.62)+"px system-ui";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("🏁", x+cell/2, y+cell/2+cell*0.04);

    // entrada (marca sutil)
    x=startCell.c*cell; y=startCell.r*cell;
    ctx.strokeStyle="rgba(34,211,238,0.35)"; ctx.lineWidth=2;
    roundRect(x+cell*0.18, y+cell*0.18, cell*0.64, cell*0.64, cell*0.16);
    ctx.stroke();

    // moedas
    ctx.font = Math.floor(cell*0.6)+"px system-ui";
    for(var i=0;i<coins.length;i++){
      var cx = coins[i].c*cell + cell/2;
      var cy = coins[i].r*cell + cell/2;
      ctx.fillText("🪙", cx, cy);
    }

    // jogador (neon)
    var px = player.c*cell + cell/2;
    var py = player.r*cell + cell/2;
    ctx.save();
    ctx.shadowColor="#22d3ee"; ctx.shadowBlur=18;
    var grad = ctx.createRadialGradient(px,py,2,px,py,cell*0.42);
    grad.addColorStop(0,"#a7f3ff");
    grad.addColorStop(0.5,"#22d3ee");
    grad.addColorStop(1,"#a855f7");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(px,py,cell*0.32,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(x,y,w,h,rr){
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  // ---- loop ----
  var lastT = 0;
  function loop(t){
    if(!lastT) lastT=t;
    lastT=t;
    if(running){
      elapsed = (performance.now()-startTime)/1000;
      uiTime.textContent = Math.floor(elapsed)+"s";
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- input: setas ----
  var padBtns = document.querySelectorAll(".pad button");
  padBtns.forEach(function(b){
    var d = b.getAttribute("data-dir");
    function go(e){ e.preventDefault(); tryMove(d); }
    b.addEventListener("touchstart", go, {passive:false});
    b.addEventListener("mousedown", go);
  });
  // teclado (bônus desktop)
  window.addEventListener("keydown", function(e){
    var k=e.key;
    if(k==="ArrowUp"||k==="w"){ e.preventDefault(); tryMove("up"); }
    else if(k==="ArrowDown"||k==="s"){ e.preventDefault(); tryMove("down"); }
    else if(k==="ArrowLeft"||k==="a"){ e.preventDefault(); tryMove("left"); }
    else if(k==="ArrowRight"||k==="d"){ e.preventDefault(); tryMove("right"); }
  });

  // ---- input: arrastar o dedo (swipe contínuo célula-a-célula) ----
  var dragActive=false, lastX=0, lastY=0;
  function screenStep(){
    var rect = cv.getBoundingClientRect();
    return rect.width / GRID;
  }
  function onStart(e){
    dragActive=true;
    var p=getPoint(e);
    lastX=p.x; lastY=p.y;
  }
  function onMove(e){
    if(!dragActive) return;
    e.preventDefault();
    var p=getPoint(e);
    var dx=p.x-lastX, dy=p.y-lastY;
    var step = screenStep()*0.7;
    var guard=0;
    while(guard<20){
      guard++;
      if(Math.abs(dx)<step && Math.abs(dy)<step) break;
      if(Math.abs(dx)>Math.abs(dy)){
        if(dx>0){ tryMove("right"); dx-=step; lastX+=step; }
        else { tryMove("left"); dx+=step; lastX-=step; }
      } else {
        if(dy>0){ tryMove("down"); dy-=step; lastY+=step; }
        else { tryMove("up"); dy+=step; lastY-=step; }
      }
    }
  }
  function onEnd(){ dragActive=false; }
  function getPoint(e){
    var rect=cv.getBoundingClientRect();
    var cx,cy;
    if(e.touches && e.touches.length){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
    else { cx=e.clientX; cy=e.clientY; }
    return {x:cx-rect.left, y:cy-rect.top};
  }
  cv.addEventListener("touchstart", onStart, {passive:false});
  cv.addEventListener("touchmove", onMove, {passive:false});
  cv.addEventListener("touchend", onEnd);
  cv.addEventListener("mousedown", onStart);
  cv.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onEnd);

  // ---- fim de jogo ----
  function endGame(){
    if(!running) return;
    running = false;
    var isNew = false;
    if(score > record){ record = score; isNew=true; try{ localStorage.setItem(REC_KEY, String(record)); }catch(e){} }
    updateUI();
    finalScore.textContent = score;
    finalSub.textContent = "🪙 "+coinsTotal+" moedas • Nível "+level+" • "+Math.floor(elapsed)+"s";
    finalRec.textContent = isNew ? "🏆 NOVO RECORDE!" : ("Recorde: "+record);
    over.classList.add("show");
  }

  function restart(){
    over.classList.remove("show");
    score=0; coinsTotal=0; level=1;
    newLevel(true);
    startTime = performance.now();
    elapsed=0;
    running=true;
    updateUI();
  }

  document.getElementById("btnEnd").addEventListener("click", endGame);
  document.getElementById("btnAgain").addEventListener("click", restart);
  document.getElementById("btnShare").addEventListener("click", function(){
    var texto = "🧩 Fiz "+score+" pontos no Labirinto Neon (nível "+level+", "+coinsTotal+" moedas)! Bora bater meu recorde?";
    location.href = "https://wa.me/?text="+encodeURIComponent(texto + " " + location.href);
  });

  window.addEventListener("resize", function(){ fitCanvas(); });

  // ---- boot ----
  fitCanvas();
  uiRec.textContent = record;
  restart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
