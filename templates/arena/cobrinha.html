<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07060f">
<title>Cobrinha — Arena · AmbitiON</title>
<style>
  html,body{margin:0;background:#07060f;color:#f0f0ff;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;}
  *{box-sizing:border-box;}
  .wrap{max-width:462px;margin:0 auto;padding:8px 12px 24px;}
  .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .nav a{color:#8b8aa8;text-decoration:none;font-size:13px;font-weight:700;}
  .nav .b{font-size:14px;font-weight:800;letter-spacing:.5px;}
  .nav .b span{color:#22d3ee;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .brand{font-size:19px;font-weight:800;letter-spacing:.5px;}
  .brand span{color:#34d399;}
  .brand small{display:block;font-size:9.5px;font-weight:700;letter-spacing:2.5px;color:#6b6a8f;margin-top:1px;}
  .stats{display:flex;align-items:center;gap:8px;}
  .stat{background:#100f22;border:1px solid rgba(52,211,153,.18);border-radius:12px;padding:6px 12px;text-align:center;min-width:74px;}
  .lab{display:block;font-size:9px;font-weight:800;letter-spacing:1.5px;color:#7d7ca6;}
  .val{display:block;font-size:20px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:#f4f3ff;}
  #best .val{color:#34d399;}
  .mute{background:#100f22;border:1px solid rgba(52,211,153,.18);border-radius:12px;width:40px;height:40px;font-size:17px;cursor:pointer;color:#c9c8e6;padding:0;}
  .stage{position:relative;line-height:0;}
  canvas{width:100%;display:block;border-radius:16px;touch-action:none;}
  .hint{text-align:center;font-size:12px;color:#8786ab;margin-top:12px;line-height:1.5;}
  .hint b{color:#34d399;}
  .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:rgba(7,6,15,.86);border-radius:16px;backdrop-filter:blur(3px);text-align:center;padding:20px;}
  .over.hidden{display:none;}
  .over .go-t{font-size:13px;font-weight:800;letter-spacing:2px;color:#f43f5e;}
  .over .go-s{font-size:52px;font-weight:800;line-height:1;
    background:linear-gradient(135deg,#34d399,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:2px 0;}
  .over .go-l{font-size:12px;color:#9c9bc4;}
  .over .go-l b{color:#34d399;}
  .over .btn{margin-top:14px;background:linear-gradient(135deg,#34d399,#22d3ee);color:#04241a;border:none;border-radius:14px;padding:14px 30px;font-size:16px;font-weight:800;cursor:pointer;}
  @media (prefers-reduced-motion:reduce){.over{backdrop-filter:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/arena">← Arena</a>
    <div class="b">🎮 <span>AmbitiON</span></div>
    <a href="/arena/cobrinha">↻ nova</a>
  </div>
  <div class="bar">
    <div class="brand">🐍 Cobri<span>nha</span><small>TREINO GRÁTIS</small></div>
    <div class="stats">
      <div class="stat"><span class="lab">PONTOS</span><span class="val" id="score">0</span></div>
      <div class="stat" id="best"><span class="lab">RECORDE</span><span class="val" id="bestv">0</span></div>
      <button class="mute" id="mute" aria-label="Som">🔊</button>
    </div>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="over hidden" id="over">
      <div class="go-t">FIM DE JOGO</div>
      <div class="go-s" id="finalScore">0</div>
      <div class="go-l">recorde <b id="finalBest">0</b></div>
      <button class="btn" id="again">Jogar de novo</button>
    </div>
  </div>
  <div class="hint">Arraste o dedo na tela pra virar 👆 Coma os pontos <b>verdes</b>, não bata na parede nem em você.</div>
</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var N=17, cell, px, dpr;
  var snake, dir, nextDir, food, score, best, over, speed, acc, last, grow;
  var pop=null;
  best=+(localStorage.getItem('cobrinha_best')||0);
  var muted=localStorage.getItem('cobrinha_mute')==='1';
  document.getElementById('bestv').textContent=best;
  document.getElementById('mute').textContent=muted?'🔇':'🔊';

  function layout(){
    var w=Math.min((window.innerWidth||400)-24,462);
    cell=Math.floor(w/N); px=cell*N;
    dpr=Math.min(window.devicePixelRatio||1,2.5);
    cv.style.width=px+'px'; cv.style.height=px+'px';
    cv.width=Math.round(px*dpr); cv.height=Math.round(px*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function rnd(n){ return Math.floor(Math.random()*n); }
  function novaComida(){ var c; do{ c={r:rnd(N),co:rnd(N)}; }while(snake.some(function(s){return s.r===c.r&&s.co===c.co;})); food=c; }
  function iniciar(){
    var m=Math.floor(N/2);
    snake=[{r:m,co:m},{r:m,co:m-1},{r:m,co:m-2}];
    dir={dr:0,dc:1}; nextDir=dir; score=0; over=false; speed=140; acc=0; last=now(); grow=0;
    document.getElementById('score').textContent=0;
    document.getElementById('over').classList.add('hidden');
    novaComida();
  }
  function now(){ return performance.now(); }

  function passo(){
    dir=nextDir;
    var h={r:snake[0].r+dir.dr, co:snake[0].co+dir.dc};
    if(h.r<0||h.r>=N||h.co<0||h.co>=N){ return fim(); }
    for(var i=0;i<snake.length-1;i++){ if(snake[i].r===h.r&&snake[i].co===h.co) return fim(); }
    snake.unshift(h);
    if(h.r===food.r&&h.co===food.co){
      score++; document.getElementById('score').textContent=score;
      if(score>best){ best=score; localStorage.setItem('cobrinha_best',best); document.getElementById('bestv').textContent=best; }
      pop={r:food.r,co:food.co,t0:now()}; sfx('eat');
      novaComida(); speed=Math.max(70,140-score*3);
    } else { snake.pop(); }
  }
  function fim(){ over=true; sfx('over');
    document.getElementById('finalScore').textContent=score;
    document.getElementById('finalBest').textContent=best;
    setTimeout(function(){ document.getElementById('over').classList.remove('hidden'); },350);
  }

  function vira(dr,dc){ if(over) return;
    if(dr===-dir.dr&&dc===-dir.dc) return;   // não pode dar ré
    nextDir={dr:dr,dc:dc};
  }
  // arrastar o dedo (pointer) — reancora conforme move, responsivo
  var anchor=null;
  cv.addEventListener('pointerdown',function(e){ unlock(); anchor={x:e.clientX,y:e.clientY}; e.preventDefault(); });
  cv.addEventListener('pointermove',function(e){ if(!anchor) return;
    var dx=e.clientX-anchor.x, dy=e.clientY-anchor.y, th=Math.max(18,cell*0.7);
    if(Math.abs(dx)<th&&Math.abs(dy)<th) return;
    if(Math.abs(dx)>Math.abs(dy)) vira(0,dx>0?1:-1); else vira(dy>0?1:-1,0);
    anchor={x:e.clientX,y:e.clientY}; e.preventDefault(); });
  cv.addEventListener('pointerup',function(){ anchor=null; });
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp')vira(-1,0); else if(e.key==='ArrowDown')vira(1,0);
    else if(e.key==='ArrowLeft')vira(0,-1); else if(e.key==='ArrowRight')vira(0,1); });

  document.getElementById('again').addEventListener('click',iniciar);
  document.getElementById('mute').addEventListener('click',function(){ muted=!muted;
    localStorage.setItem('cobrinha_mute',muted?'1':'0'); this.textContent=muted?'🔇':'🔊'; if(!muted)unlock(); });

  var actx=null;
  function unlock(){ if(muted)return; if(!actx){ try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}} if(actx&&actx.state==='suspended')actx.resume(); }
  function sfx(k){ if(muted||!actx)return; var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=k==='eat'?'square':'sawtooth'; o.frequency.setValueAtTime(k==='eat'?520:200,t);
    if(k==='over')o.frequency.exponentialRampToValueAtTime(80,t+0.3);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.14,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+(k==='eat'?0.1:0.32));
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.35); }

  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function draw(){
    ctx.clearRect(0,0,px,px);
    rr(0,0,px,px,16); ctx.fillStyle='#0c0b1c'; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(52,211,153,.18)'; rr(0.75,0.75,px-1.5,px-1.5,15); ctx.stroke();
    // grade sutil
    ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
    for(var i=1;i<N;i++){ ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,px); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(px,i*cell); ctx.stroke(); }
    // comida (glow)
    var fx=food.co*cell+cell/2, fy=food.r*cell+cell/2, pr=cell*0.34;
    if(pop){ var a=(now()-pop.t0)/220; if(a>=1)pop=null; }
    ctx.save(); ctx.shadowColor='#34d399'; ctx.shadowBlur=12; ctx.fillStyle='#34d399';
    ctx.beginPath(); ctx.arc(fx,fy,pr,0,7); ctx.fill(); ctx.restore();
    // cobra
    for(var s=snake.length-1;s>=0;s--){ var seg=snake[s], x=seg.co*cell, y=seg.r*cell, ins=Math.max(1,cell*0.09);
      var head=(s===0);
      rr(x+ins,y+ins,cell-2*ins,cell-2*ins,cell*0.28);
      if(head){ ctx.fillStyle='#67e8f9'; } else { var t=s/snake.length; ctx.fillStyle='rgb('+Math.round(34+t*10)+','+Math.round(211-t*60)+','+Math.round(238-t*40)+')'; }
      ctx.fill();
      if(head){ // olhinhos
        ctx.fillStyle='#07060f'; var e=cell*0.13, ox=dir.dc*cell*0.12, oy=dir.dr*cell*0.12;
        ctx.beginPath(); ctx.arc(x+cell*0.36+ox,y+cell*0.38+oy,e,0,7); ctx.arc(x+cell*0.64+ox,y+cell*0.38+oy,e,0,7); ctx.fill();
      }
    }
  }
  function loop(){
    if(!over){ var t=now(); acc+=t-last; last=t; while(acc>=speed){ acc-=speed; passo(); if(over)break; } }
    draw(); requestAnimationFrame(loop);
  }
  window.addEventListener('resize',layout);
  layout(); iniciar(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
