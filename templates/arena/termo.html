<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Termo — Arena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #07060f;
    color: #f0f0ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 10px 16px;
    touch-action: manipulation;
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    background: linear-gradient(180deg, #12101f, #0d0b18);
    border: 1px solid #211d38;
    border-radius: 16px;
  }
  .topbar a.back {
    color: #22d3ee;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #1c3540;
    background: rgba(34,211,238,0.06);
    white-space: nowrap;
  }
  .topbar a.back:active { background: rgba(34,211,238,0.16); }
  .title {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }
  .title .emo { font-size: 18px; }
  .scoreblock {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.35;
    min-width: 68px;
  }
  .scoreblock .streak, .scoreblock .best {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .scoreblock .lbl { font-size: 9px; color: #8a86a8; text-transform: uppercase; letter-spacing: 1px; }
  .scoreblock .val { font-size: 15px; font-weight: 700; min-width: 14px; text-align: right; }
  .scoreblock .streak .val { color: #34d399; }
  .scoreblock .best .val { color: #a855f7; }

  /* Board */
  .board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    aspect-ratio: 5 / 6;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .cell {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 7vw, 30px);
    font-weight: 700;
    text-transform: uppercase;
    border-radius: 10px;
    border: 2px solid #262042;
    background: #0d0b18;
    color: #f0f0ff;
    user-select: none;
    transition: transform 0.08s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .cell.filled { border-color: #4b4472; }
  .cell.pop { transform: scale(1.08); }
  .cell.correct { background: #34d399; border-color: #34d399; color: #07060f; }
  .cell.present { background: #eab308; border-color: #eab308; color: #07060f; }
  .cell.absent  { background: #201d33; border-color: #201d33; color: #8a86a8; }
  .cell.flip { animation: flip 0.5s ease forwards; }
  @keyframes flip {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
  .row.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* Message */
  .msg {
    min-height: 20px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #22d3ee;
    height: 20px;
    transition: opacity 0.2s;
  }

  /* Keyboard */
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    margin-top: 2px;
    touch-action: manipulation;
  }
  .krow {
    display: flex;
    justify-content: center;
    gap: 5px;
  }
  .key {
    flex: 1;
    min-width: 0;
    height: 52px;
    border-radius: 8px;
    border: none;
    background: #2a2545;
    color: #f0f0ff;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, transform 0.05s ease, color 0.2s ease;
  }
  .key:active { transform: translateY(1px); background: #3a3460; }
  .key.wide { flex: 1.6; font-size: 13px; }
  .key.correct { background: #34d399; color: #07060f; }
  .key.present { background: #eab308; color: #07060f; }
  .key.absent  { background: #181528; color: #55506e; }

  /* Overlay / end state */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(7,6,15,0.86);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, #141127, #0c0a17);
    border: 1px solid #2a2450;
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(168,85,247,0.15);
  }
  .card h2 {
    font-size: 24px;
    margin-bottom: 6px;
  }
  .card h2.win { color: #34d399; }
  .card h2.lose { color: #f87171; }
  .card .word {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #22d3ee;
    margin: 10px 0;
  }
  .card .sub {
    font-size: 14px;
    color: #b8b4d6;
    margin-bottom: 6px;
  }
  .card .stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 16px 0 20px;
  }
  .card .stat { display: flex; flex-direction: column; }
  .card .stat .n { font-size: 26px; font-weight: 800; }
  .card .stat .n.s { color: #34d399; }
  .card .stat .n.b { color: #a855f7; }
  .card .stat .k { font-size: 11px; color: #8a86a8; text-transform: uppercase; letter-spacing: 1px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn.share {
    background: linear-gradient(90deg, #22d3ee, #34d399);
    color: #07060f;
  }
  .btn.again {
    background: #2a2545;
    color: #f0f0ff;
    border: 1px solid #3a3460;
  }
  .btn:active { transform: translateY(1px); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/arena">← Arena</a>
    <div class="title"><span class="emo">🔤</span>Termo</div>
    <div class="scoreblock">
      <div class="streak"><span class="lbl">Sequência</span> <span class="val" id="streakVal">0</span></div>
      <div class="best"><span class="lbl">Recorde</span> <span class="val" id="bestVal">0</span></div>
    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>
  <div class="keyboard" id="keyboard"></div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="endTitle"></h2>
    <div class="sub" id="endSub"></div>
    <div class="word" id="endWord"></div>
    <div class="stats">
      <div class="stat"><span class="n s" id="endStreak">0</span><span class="k">Sequência</span></div>
      <div class="stat"><span class="n b" id="endBest">0</span><span class="k">Recorde</span></div>
    </div>
    <button class="btn share" id="shareBtn">📲 Bata meu recorde!</button>
    <button class="btn again" id="againBtn">Jogar de novo</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---- Word list: common REAL 5-letter PT words, no accents/cedilla ----
  var WORDS = [
    "CARRO","BOLSA","PRATO","LIVRO","MUNDO","TERRA","PLANO","VERDE","NOITE","FESTA",
    "PRAIA","CHUVA","GATOS","CASAS","PORTA","MESAS","LAPIS","PAPEL","SUCOS","AGUAS",
    "FOGOS","VENTO","NUVEM","FLORA","FRUTA","LIMAO","MANGA","PERAS","MELAO","BATOM",
    "PERNA","DEDOS","OLHOS","BOCAS","NARIZ","COSTA","PEITO","JOGOS","BOLAS","REDES",
    "CAMPO","TIMES","GOLES","LANCE","JOGAR","PULAR","NADAR","VOLTA","SUBIR","ANDAR",
    "FALAR","OUVIR","COMER","BEBER","SONHO","AMIGO","BEIJO","CARTA","EMAIL","TEXTO",
    "FRASE","LETRA","PONTO","VIGOR","FORCA","PODER","GANHO","LUCRO","VENDA","CAIXA",
    "BANCO","MOEDA","NOTAS","PRECO","VALOR","GASTO","RENDA","PRAZO","METAS","LUTAR",
    "VENCE","PERDE","PODIO","PISTA","MOTOR","RODAS","PNEUS","FREIO","LUZES","RUIVO",
    "PONTE","VIELA","BECOS","PRACA","GRAMA","GALHO","FOLHA","BROTO","CACTO","ROSAS",
    "CRAVO","VIOLA","PIANO","BAIXO","CANTA","RITMO","VALSA","SAMBA","TANGO","METAL",
    "SOLAR","LUNAR","VENUS","MARTE","LEITE","CARNE","ARROZ","MASSA","PIZZA","BOLOS",
    "DOCES","AZEDO","VAPOR","PEDRA","AREIA","BARRO","FERRO","OUROS","PRATA","COBRE",
    "VIDRO","PANOS","LINHA","MALHA","BOTAO","GOLAS","SAIAS","CALCA","BOTAS","TENIS",
    "MEIAS","LUVAS","GORRO","TOUCA","ANEIS","CINTO","CHAVE","TELHA","VIGAS","MUROS",
    "SALTO","PULSO","PALMA","UNHAS","BARBA","LABIO","QUEDA","SALVE","VOTOS","REINO",
    "REGRA","JOGOU","VOTAR","CALOR","GELOS","NEVES","RAIOS","TROVA","MARES","LAGOS",
    "MATOS","TRIGO","MILHO","ALHOS","TOMAR","LAVAR","SECAR","PINTA",
    "CAVAR","LIMPO","SUJOS","NOVOS","VELHO","JOVEM","ALTOS","BAIXA","LARGO","CURTO",
    "GORDO","MAGRO","FORTE","FRACO","RICOS","POBRE","FELIZ","BRAVO","CALMO",
    "LINDO","FEIOS","CLARO","LEVES","DUROS","MOLES","LISOS",
    "RUDES","VAZIO","CHEIO","FUNDO","RASOS","LONGE","PERTO","TARDE"
  ];
  // Dedupe & ensure exactly-5-letter uppercase words
  var seen = {};
  WORDS = WORDS.filter(function(w){
    if(w.length !== 5) return false;
    if(!/^[A-Z]{5}$/.test(w)) return false;
    if(seen[w]) return false;
    seen[w] = true;
    return true;
  });
  if(WORDS.length === 0){ WORDS = ["TERMO"]; } // safety net

  var ROWS = 6, COLS = 5;
  var LS_BEST = "termo_arena_best_v1";
  var LS_STREAK = "termo_arena_streak_v1";

  var boardEl = document.getElementById("board");
  var kbEl = document.getElementById("keyboard");
  var msgEl = document.getElementById("msg");
  var overlay = document.getElementById("overlay");

  var streakVal = document.getElementById("streakVal");
  var bestVal = document.getElementById("bestVal");

  var secret = "";
  var curRow = 0, curCol = 0;
  var grid = [];        // grid[r][c] = letter
  var cells = [];       // DOM cells
  var keyState = {};    // letter -> state
  var keyEls = {};      // letter -> button
  var gameOver = false;
  var busy = false;
  var results = [];     // per-row array of 'correct'|'present'|'absent' (for share grid)

  function safeGet(k){
    try { return localStorage.getItem(k); } catch(e){ return null; }
  }
  var streak = parseInt(safeGet(LS_STREAK) || "0", 10) || 0;
  var best = parseInt(safeGet(LS_BEST) || "0", 10) || 0;

  function saveScores(){
    try {
      localStorage.setItem(LS_STREAK, String(streak));
      localStorage.setItem(LS_BEST, String(best));
    } catch(e){}
  }
  function renderScores(){
    streakVal.textContent = streak;
    bestVal.textContent = best;
  }

  var KB = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["ENTER","Z","X","C","V","B","N","M","APAGAR"]
  ];

  function buildBoard(){
    boardEl.innerHTML = "";
    cells = [];
    for(var r=0;r<ROWS;r++){
      var rowEl = document.createElement("div");
      rowEl.className = "row";
      rowEl.id = "row"+r;
      var rowCells = [];
      for(var c=0;c<COLS;c++){
        var cell = document.createElement("div");
        cell.className = "cell";
        rowEl.appendChild(cell);
        rowCells.push(cell);
      }
      boardEl.appendChild(rowEl);
      cells.push(rowCells);
    }
  }

  function buildKeyboard(){
    kbEl.innerHTML = "";
    keyEls = {};
    KB.forEach(function(row){
      var rowEl = document.createElement("div");
      rowEl.className = "krow";
      row.forEach(function(k){
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "key" + (k.length>1 ? " wide" : "");
        btn.textContent = k === "APAGAR" ? "⌫" : k;
        btn.setAttribute("data-key", k);
        rowEl.appendChild(btn);
        if(k.length === 1) keyEls[k] = btn;
      });
      kbEl.appendChild(rowEl);
    });
  }

  function newGame(){
    secret = WORDS[Math.floor(Math.random()*WORDS.length)];
    curRow = 0; curCol = 0; gameOver = false; busy = false;
    grid = [];
    for(var r=0;r<ROWS;r++){
      grid.push(["","","","",""]);
    }
    keyState = {};
    results = [];
    buildBoard();
    buildKeyboard();
    setMsg("");
    overlay.classList.remove("show");
    renderScores();
  }

  var msgTimer = null;
  function setMsg(t){
    msgEl.textContent = t;
  }
  function flashMsg(t, ms){
    setMsg(t);
    if(msgTimer) clearTimeout(msgTimer);
    if(ms){
      msgTimer = setTimeout(function(){ setMsg(""); }, ms);
    }
  }

  function updateCell(r,c){
    var cell = cells[r][c];
    cell.textContent = grid[r][c];
    if(grid[r][c]){
      cell.classList.add("filled","pop");
      setTimeout(function(){ cell.classList.remove("pop"); }, 90);
    } else {
      cell.classList.remove("filled");
    }
  }

  function pressLetter(l){
    if(gameOver || busy) return;
    if(curCol >= COLS) return;
    grid[curRow][curCol] = l;
    updateCell(curRow, curCol);
    curCol++;
  }

  function pressBackspace(){
    if(gameOver || busy) return;
    if(curCol <= 0) return;
    curCol--;
    grid[curRow][curCol] = "";
    updateCell(curRow, curCol);
  }

  function shakeRow(){
    var rowEl = document.getElementById("row"+curRow);
    if(!rowEl) return;
    rowEl.classList.remove("shake");
    void rowEl.offsetWidth;
    rowEl.classList.add("shake");
  }

  function pressEnter(){
    if(gameOver || busy) return;
    if(curCol < COLS){
      flashMsg("Complete as 5 letras", 1200);
      shakeRow();
      return;
    }
    var guess = grid[curRow].join("");
    evaluate(guess);
  }

  function evaluate(guess){
    busy = true;
    var res = scoreGuess(guess, secret); // array of 'correct'|'present'|'absent'
    results.push(res);
    var r = curRow;
    // Reveal with flip animation, staggered
    for(var c=0;c<COLS;c++){
      (function(c){
        setTimeout(function(){
          var cell = cells[r][c];
          cell.classList.add("flip");
          setTimeout(function(){
            cell.classList.add(res[c]);
          }, 250); // apply color mid-flip
        }, c*140);
      })(c);
    }

    // Update keyboard colors after flips
    setTimeout(function(){
      for(var c=0;c<COLS;c++){
        applyKeyState(guess[c], res[c]);
      }
      finishRow(guess, res);
    }, COLS*140 + 260);
  }

  function scoreGuess(guess, target){
    var res = new Array(COLS);
    var counts = {};
    var i, ch;
    for(i=0;i<COLS;i++){
      ch = target[i];
      counts[ch] = (counts[ch]||0)+1;
    }
    // First pass: correct (greens), consume the letter count
    for(i=0;i<COLS;i++){
      if(guess[i] === target[i]){
        res[i] = "correct";
        counts[guess[i]]--;
      }
    }
    // Second pass: present only while an occurrence remains, else absent
    for(i=0;i<COLS;i++){
      if(res[i]) continue;
      ch = guess[i];
      if(counts[ch] > 0){
        res[i] = "present";
        counts[ch]--;
      } else {
        res[i] = "absent";
      }
    }
    return res;
  }

  var STATE_RANK = { absent:1, present:2, correct:3 };
  function applyKeyState(letter, state){
    var prev = keyState[letter];
    // Only upgrade: a key that is already correct never drops to present/absent
    if(!prev || STATE_RANK[state] > STATE_RANK[prev]){
      keyState[letter] = state;
      var el = keyEls[letter];
      if(el){
        el.classList.remove("correct","present","absent");
        el.classList.add(state);
      }
    }
  }

  function finishRow(guess, res){
    var won = (guess === secret);
    if(won){
      gameOver = true;
      busy = false;
      streak++;
      if(streak > best){ best = streak; }
      saveScores();
      renderScores();
      setTimeout(function(){ showEnd(true); }, 500);
      return;
    }
    curRow++;
    curCol = 0;
    if(curRow >= ROWS){
      gameOver = true;
      busy = false;
      streak = 0; // streak breaks on loss
      saveScores();
      renderScores();
      setTimeout(function(){ showEnd(false); }, 500);
      return;
    }
    busy = false;
  }

  function emojiGrid(){
    var map = { correct:"🟩", present:"🟨", absent:"⬛" };
    var lines = [];
    for(var i=0;i<results.length;i++){
      var line = "";
      for(var c=0;c<COLS;c++){
        line += map[results[i][c]] || "⬛";
      }
      lines.push(line);
    }
    return lines.join("\n");
  }

  function showEnd(won){
    var title = document.getElementById("endTitle");
    var sub = document.getElementById("endSub");
    var wordEl = document.getElementById("endWord");
    document.getElementById("endStreak").textContent = streak;
    document.getElementById("endBest").textContent = best;
    if(won){
      title.textContent = "🎉 Acertou!";
      title.className = "win";
      sub.textContent = "Você descobriu a palavra:";
    } else {
      title.textContent = "😵 Fim de jogo";
      title.className = "lose";
      sub.textContent = "A palavra era:";
    }
    wordEl.textContent = secret;
    overlay.classList.add("show");
  }

  // ---- Input handlers ----
  function handleKeyName(k){
    if(k === "ENTER") pressEnter();
    else if(k === "APAGAR") pressBackspace();
    else if(k.length === 1 && /[A-Z]/.test(k)) pressLetter(k);
  }

  // Keyboard clicks (delegate). Use pointerdown for snappy touch.
  kbEl.addEventListener("pointerdown", function(ev){
    var t = ev.target.closest("[data-key]");
    if(!t) return;
    ev.preventDefault();
    handleKeyName(t.getAttribute("data-key"));
  }, { passive:false });

  // Physical keyboard (desktop testing / hardware)
  document.addEventListener("keydown", function(ev){
    if(overlay.classList.contains("show")) return;
    var key = ev.key;
    if(key === "Enter"){ ev.preventDefault(); pressEnter(); }
    else if(key === "Backspace"){ ev.preventDefault(); pressBackspace(); }
    else if(/^[a-zA-Z]$/.test(key)){ pressLetter(key.toUpperCase()); }
  });

  // Share
  document.getElementById("shareBtn").addEventListener("click", function(){
    var didWin = document.getElementById("endTitle").className === "win";
    var texto;
    if(didWin){
      texto = "🔤 Acertei o Termo em sequência de " + streak + " (recorde " + best + ") na Arena!";
    } else {
      texto = "🔤 Joguei Termo na Arena e meu recorde é " + best + " seguidas.";
    }
    var grid = emojiGrid();
    var full = texto + (grid ? "\n\n" + grid : "") + "\n\nBata meu recorde: " + location.href;
    location.href = "https://wa.me/?text=" + encodeURIComponent(full);
  });

  // Play again
  document.getElementById("againBtn").addEventListener("click", function(){
    newGame();
  });

  // Prevent accidental double-tap zoom / multi-touch scroll on board area
  boardEl.addEventListener("touchstart", function(e){ if(e.touches.length>1) e.preventDefault(); }, { passive:false });

  // Init
  renderScores();
  newGame();
})();
</script>
</body>
</html>
