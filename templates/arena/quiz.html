<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Quiz — Arena · AmbitiON</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#07060f;color:#f0f0ff;
    min-height:100vh;padding:16px 14px 40px;-webkit-user-select:none;user-select:none}
  .wrap{max-width:460px;margin:0 auto}
  .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .nav a{color:#8b8aa8;text-decoration:none;font-size:13px;font-weight:700}
  .brand{font-size:17px;font-weight:800}.brand span{color:#a855f7}
  h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
  .sub{text-align:center;font-size:13px;color:#9aa3bd;margin-bottom:20px}
  .temas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tema{background:#100f22;border:1px solid rgba(168,85,247,.25);border-radius:16px;padding:20px 12px;
    text-align:center;cursor:pointer;transition:.12s;color:#f0f0ff;font-family:inherit}
  .tema:active{transform:scale(.97)}
  .tema .em{font-size:34px;display:block;margin-bottom:6px}
  .tema .nm{font-size:14px;font-weight:800}
  .tema .rec{font-size:11px;color:#fbbf24;font-weight:700;margin-top:3px;min-height:14px}
  /* jogo */
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;font-weight:800}
  .hd .q{color:#a855f7}.hd .s{color:#34d399}
  .bar{height:7px;background:#1a1930;border-radius:6px;overflow:hidden;margin-bottom:20px}
  .bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#34d399,#22d3ee);transition:width .1s linear}
  .bar.low>i{background:linear-gradient(90deg,#f43f5e,#fb923c)}
  .perg{background:#100f22;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 18px;
    font-size:19px;font-weight:800;line-height:1.35;text-align:center;min-height:96px;display:flex;
    align-items:center;justify-content:center;margin-bottom:16px}
  .op{display:block;width:100%;background:#141327;border:1.5px solid rgba(255,255,255,.08);border-radius:13px;
    padding:15px;font-size:16px;font-weight:700;color:#e9e8ff;text-align:left;cursor:pointer;margin-bottom:10px;
    font-family:inherit;transition:.1s}
  .op:active{transform:scale(.99)}
  .op.certo{border-color:#34d399;background:rgba(52,211,153,.18);color:#6ee7b7}
  .op.errado{border-color:#f43f5e;background:rgba(244,63,94,.16);color:#fda4af}
  .op.dim{opacity:.45}
  /* resultado */
  .res{text-align:center}
  .res .big{font-size:62px;line-height:1}
  .res .sc{font-size:46px;font-weight:800;background:linear-gradient(135deg,#a855f7,#22d3ee);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .res .sc small{font-size:22px;color:#8b8aa8;-webkit-text-fill-color:#8b8aa8}
  .res .msg{font-size:15px;color:#c9d6e2;margin:6px 0 4px;font-weight:600}
  .res .rec{font-size:13px;color:#fbbf24;font-weight:700;margin-bottom:16px}
  .cta{display:block;width:100%;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;
    border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;
    text-decoration:none;font-family:inherit;box-shadow:0 6px 22px rgba(124,58,237,.35)}
  .cta.zap{background:linear-gradient(135deg,#22c55e,#16a34a)}
  .ghost{display:block;width:100%;background:#171533;color:#d7d6f0;border:1px solid rgba(168,85,247,.3);
    border-radius:14px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px;
    text-decoration:none;font-family:inherit}
  .hide{display:none}
  .loading{text-align:center;color:#8b8aa8;font-size:14px;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/arena">← Arena</a>
    <div class="brand">🧠 <span>Quiz</span></div>
    <span style="width:44px"></span>
  </div>

  <div id="pick">
    <h1>Escolha um tema 🎯</h1>
    <div class="sub">10 perguntas · quem manja mais, vence. De graça!</div>
    <div class="temas" id="temas">
      {% for t in temas %}
      <button class="tema" data-id="{{ t.id }}" data-nome="{{ t.nome }}" onclick="começar('{{ t.id }}','{{ t.nome }}')">
        <span class="em">{{ t.emoji }}</span>
        <span class="nm">{{ t.nome }}</span>
        <span class="rec" data-rec="{{ t.id }}"></span>
      </button>
      {% endfor %}
    </div>
  </div>

  <div id="game" class="hide">
    <div class="hd"><span class="q" id="prog">1/10</span><span id="temaNome"></span><span class="s" id="score">0 ✔</span></div>
    <div class="bar" id="bar"><i id="barfill"></i></div>
    <div class="perg" id="perg">…</div>
    <div id="ops"></div>
  </div>

  <div id="done" class="hide">
    <div class="res">
      <div class="big" id="emoji">🎉</div>
      <div class="sc"><span id="fscore">0</span><small>/10</small></div>
      <div class="msg" id="fmsg"></div>
      <div class="rec" id="frec"></div>
      <button class="cta zap" onclick="compartilhar()">📲 Bate meu recorde! (WhatsApp)</button>
      <button class="cta" onclick="denovo()">🔁 Jogar de novo</button>
      <button class="ghost" onclick="voltar()">Trocar tema</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var TEMPO=12000, TEMA='', NOME='', qs=[], idx=0, acertos=0, streak=0, tEnd=0, raf=0, travado=false;
  // recordes nos cards
  document.querySelectorAll('[data-rec]').forEach(function(el){
    var r=+(localStorage.getItem('quiz_rec_'+el.getAttribute('data-rec'))||0);
    if(r>0) el.textContent='recorde '+r+'/10';
  });
  var actx=null;
  function beep(ok){ try{ if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=ok?'triangle':'sawtooth'; o.frequency.setValueAtTime(ok?660:180,t);
    if(ok)o.frequency.exponentialRampToValueAtTime(990,t+0.1);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.14,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.22);}catch(e){} }

  window.começar=function(id,nome){
    TEMA=id; NOME=nome;
    document.getElementById('pick').classList.add('hide');
    document.getElementById('game').classList.remove('hide');
    document.getElementById('ops').innerHTML='<div class="loading">Carregando perguntas…</div>';
    document.getElementById('temaNome').textContent=nome;
    fetch('/arena/quiz/banco/'+id).then(function(r){return r.json();}).then(function(data){
      qs=data||[]; idx=0; acertos=0; streak=0;
      if(!qs.length){ document.getElementById('ops').innerHTML='<div class="loading">Tema sem perguntas ainda 😅</div>'; return; }
      mostrar();
    }).catch(function(){ document.getElementById('ops').innerHTML='<div class="loading">Sem conexão 😕</div>'; });
  };

  function mostrar(){
    travado=false;
    var q=qs[idx];
    document.getElementById('prog').textContent=(idx+1)+'/'+qs.length;
    document.getElementById('score').textContent=acertos+' ✔';
    document.getElementById('perg').textContent=q.q;
    var box=document.getElementById('ops'); box.innerHTML='';
    q.ops.forEach(function(txt,i){
      var b=document.createElement('button'); b.className='op'; b.textContent=txt;
      b.onclick=function(){ responder(i,b); };
      box.appendChild(b);
    });
    tEnd=performance.now()+TEMPO; tick();
  }
  function tick(){
    var rem=Math.max(0,tEnd-performance.now()), pct=rem/TEMPO*100;
    var bf=document.getElementById('barfill'); if(bf) bf.style.width=pct+'%';
    var bar=document.getElementById('bar'); if(bar){ if(pct<=30) bar.classList.add('low'); else bar.classList.remove('low'); }
    if(rem<=0){ if(!travado) responder(-1,null); return; }
    raf=requestAnimationFrame(tick);
  }
  function responder(escolha,btn){
    if(travado) return; travado=true; cancelAnimationFrame(raf);
    var q=qs[idx], ops=document.getElementById('ops').children;
    var acertou=(escolha===q.c);
    for(var i=0;i<ops.length;i++){
      if(i===q.c) ops[i].classList.add('certo');
      else if(i===escolha) ops[i].classList.add('errado');
      else ops[i].classList.add('dim');
      ops[i].onclick=null;
    }
    if(acertou){ acertos++; streak++; } else { streak=0; }
    beep(acertou);
    document.getElementById('score').textContent=acertos+' ✔';
    setTimeout(function(){ idx++; if(idx>=qs.length) fim(); else mostrar(); }, 950);
  }
  function fim(){
    document.getElementById('game').classList.add('hide');
    document.getElementById('done').classList.remove('hide');
    document.getElementById('fscore').textContent=acertos;
    var e='😬', m='Bora treinar mais!';
    if(acertos>=9){ e='🏆'; m='Fera! Você MANJA de '+NOME+'!'; }
    else if(acertos>=7){ e='🔥'; m='Mandou bem demais!'; }
    else if(acertos>=5){ e='😎'; m='Nada mal!'; }
    document.getElementById('emoji').textContent=e;
    document.getElementById('fmsg').textContent=m;
    var key='quiz_rec_'+TEMA, rec=+(localStorage.getItem(key)||0);
    if(acertos>rec){ localStorage.setItem(key,acertos); document.getElementById('frec').textContent='🎉 Novo recorde!'; }
    else { document.getElementById('frec').textContent='Seu recorde: '+rec+'/10'; }
  }
  window.compartilhar=function(){
    var t=encodeURIComponent('🧠 Fiz '+acertos+'/10 no Quiz de '+NOME+' da Arena! Bate meu recorde 👉 '+location.href);
    location.href='https://wa.me/?text='+t;
  };
  window.denovo=function(){ document.getElementById('done').classList.add('hide'); começar(TEMA,NOME); };
  window.voltar=function(){ location.reload(); };
})();
</script>
</body>
</html>
