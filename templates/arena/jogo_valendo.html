<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07060f">
<title>Duelo valendo — Arena · AmbitiON</title>
<style>
  html,body{margin:0;background:#07060f;color:#f0f0ff;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;}
  *{box-sizing:border-box;}
  .wrap{max-width:462px;margin:0 auto;padding:8px 12px 24px;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .brand{font-size:15px;font-weight:800;letter-spacing:.4px;}
  .brand span{color:#22d3ee;}
  .brand small{display:block;font-size:9px;font-weight:800;letter-spacing:2px;color:#c084fc;margin-top:1px;}
  .stats{display:flex;align-items:center;gap:8px;}
  .stat{background:#100f22;border:1px solid rgba(168,85,247,.16);border-radius:12px;padding:6px 12px;text-align:center;min-width:66px;}
  .lab{display:block;font-size:9px;font-weight:800;letter-spacing:1.2px;color:#7d7ca6;}
  .val{display:block;font-size:20px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:#f4f3ff;}
  #tempo .val{color:#22d3ee;}
  #tempo.baixo .val{color:#f43f5e;}
  .alvo{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(168,85,247,.14);
    border:1px solid rgba(168,85,247,.42);border-radius:12px;padding:8px 12px;margin-bottom:10px;
    font-size:13px;font-weight:700;color:#ecdcff;text-align:center;}
  .alvo.hidden{display:none;}
  .stage{position:relative;line-height:0;}
  canvas{width:100%;display:block;border-radius:16px;touch-action:none;}
  .hint{text-align:center;font-size:12px;color:#8786ab;margin-top:12px;line-height:1.5;}
  .hint b{color:#c084fc;}
  .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:rgba(7,6,15,.9);border-radius:16px;backdrop-filter:blur(3px);text-align:center;padding:24px;}
  .over.hidden{display:none;}
  .over .sp{width:38px;height:38px;border:4px solid rgba(168,85,247,.25);border-top-color:#a855f7;
    border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .over .t{font-size:16px;font-weight:800;color:#e9e8ff;}
  .over .s{font-size:12.5px;color:#9c9bc4;}
  .over .btn{margin-top:8px;background:linear-gradient(135deg,#22d3ee,#7c3aed);color:#fff;border:none;
    border-radius:12px;padding:12px 22px;font-size:14px;font-weight:800;cursor:pointer;}
  @media (prefers-reduced-motion:reduce){.over{backdrop-filter:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">🧱 Quebra<span>Blocos</span><small>💸 VALENDO · R$ {{ aposta }}</small></div>
    <div class="stats">
      <div class="stat"><span class="lab">PONTOS</span><span class="val" id="score">0</span></div>
      <div class="stat" id="tempo"><span class="lab">TEMPO</span><span class="val" id="tval">150</span></div>
    </div>
  </div>
  {% if alvo is not none %}
  <div class="alvo" id="alvo">🎯 Bata o adversário: <b style="margin-left:4px">{{ alvo }} pontos</b></div>
  {% endif %}
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="over hidden" id="over">
      <div class="sp" id="sp"></div>
      <div class="t" id="ot">Enviando sua partida…</div>
      <div class="s" id="os">Calculando o resultado com segurança.</div>
      <button class="btn hidden" id="retry" onclick="enviar()">Tentar de novo</button>
    </div>
  </div>
  <div class="hint">⏱️ Você tem <b>150 segundos</b>. Faça o máximo de pontos — o servidor confere e o maior leva. 💸</div>
</div>

<script>
var CFG = {
  token: {{ token|tojson }},
  seed: ({{ seed }} >>> 0),
  endpoint: {{ endpoint|tojson }},
  alvo: {{ (alvo if alvo is not none else 'null') }}
};
(function(){
  "use strict";
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var N=8;
  var COLORS=['#22d3ee','#a855f7','#ec4899','#34d399','#fbbf24','#60a5fa','#fb923c','#f43f5e'];
  var SHAPES=[
    {w:5,o:[[0,0]]},
    {w:7,o:[[0,0],[0,1]]}, {w:7,o:[[0,0],[1,0]]},
    {w:7,o:[[0,0],[0,1],[0,2]]}, {w:7,o:[[0,0],[1,0],[2,0]]},
    {w:5,o:[[0,0],[0,1],[0,2],[0,3]]}, {w:5,o:[[0,0],[1,0],[2,0],[3,0]]},
    {w:2,o:[[0,0],[0,1],[0,2],[0,3],[0,4]]}, {w:2,o:[[0,0],[1,0],[2,0],[3,0],[4,0]]},
    {w:6,o:[[0,0],[0,1],[1,0],[1,1]]},
    {w:2,o:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]]},
    {w:6,o:[[0,0],[1,0],[1,1]]}, {w:6,o:[[0,0],[0,1],[1,0]]},
    {w:6,o:[[0,0],[0,1],[1,1]]}, {w:6,o:[[0,1],[1,0],[1,1]]},
    {w:4,o:[[0,0],[1,0],[2,0],[2,1]]}, {w:4,o:[[0,1],[1,1],[2,1],[2,0]]},
    {w:4,o:[[0,0],[0,1],[0,2],[1,0]]}, {w:4,o:[[0,0],[0,1],[0,2],[1,2]]},
    {w:4,o:[[0,0],[0,1],[0,2],[1,1]]},
    {w:3,o:[[0,1],[0,2],[1,0],[1,1]]}, {w:3,o:[[0,0],[0,1],[1,1],[1,2]]},
    {w:3,o:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]]},
    {w:3,o:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]]}
  ];
  var POOL=[]; SHAPES.forEach(function(s){ var d=norm(s.o); for(var k=0;k<s.w;k++) POOL.push(d); });
  function norm(o){ var mr=0,mc=0; o.forEach(function(p){mr=Math.max(mr,p[0]);mc=Math.max(mc,p[1]);}); return {offs:o,rows:mr+1,cols:mc+1}; }

  var seed=CFG.seed>>>0;
  function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
  function pick(a){ return a[Math.floor(rnd()*a.length)]; }

  var board, tray, score, streak, over=false;
  var MOVES=[], ENVIADO=false, tEnd=0;
  var pops=[], floats=[], combo=null, shakeT=0, shakeAmt=0, drag=null;
  var cell, board_px, trayGap, trayY, slotW, cssW, cssH;

  function layout(){
    cssW=Math.min((window.innerWidth||400)-24,462);
    cell=Math.floor(cssW/N); board_px=cell*N;
    trayGap=Math.max(8,Math.round(cell*0.42)); slotW=(board_px-2*trayGap)/3;
    trayY=board_px+Math.round(cell*0.55)+6; cssH=Math.round(trayY+slotW+6);
    var dpr=Math.min(window.devicePixelRatio||1,2.5);
    cv.style.width=board_px+'px'; cv.style.height=cssH+'px';
    cv.width=Math.round(board_px*dpr); cv.height=Math.round(cssH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function novaPeca(){ var d=pick(POOL); return {offs:d.offs,rows:d.rows,cols:d.cols,color:COLORS[Math.floor(rnd()*COLORS.length)],used:false}; }
  function iniciar(){
    board=[]; for(var r=0;r<N;r++){ board.push([]); for(var c=0;c<N;c++) board[r].push(null); }
    score=0; streak=0; over=false; pops=[]; floats=[]; combo=null; drag=null; MOVES=[];
    tray=[novaPeca(),novaPeca(),novaPeca()];
    document.getElementById('score').textContent=0;
    tEnd=now()+150000;
  }

  function canPlace(p,r,c){ for(var i=0;i<p.offs.length;i++){ var rr=r+p.offs[i][0],cc=c+p.offs[i][1];
    if(rr<0||rr>=N||cc<0||cc>=N||board[rr][cc]!==null) return false; } return true; }
  function anyFit(p){ for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(canPlace(p,r,c)) return true; return false; }

  function place(idx,r,c){
    if(over) return;
    MOVES.push([idx,r,c]);                 // GRAVA a jogada (servidor re-simula)
    var p=tray[idx];
    for(var i=0;i<p.offs.length;i++) board[r+p.offs[i][0]][c+p.offs[i][1]]=p.color;
    p.used=true;
    var cl=clearLines(); var add=p.offs.length+cl.score; score+=add;
    var fx=(c+p.cols/2)*cell, fy=(r+p.rows/2)*cell;
    floats.push({t:'+'+add,x:fx,y:fy,t0:now(),big:cl.lines>=2});
    if(cl.lines>=2){ combo={t:cl.lines+' LINHAS!',t0:now()}; if(!reduce){shakeT=now();shakeAmt=Math.min(3+cl.lines*2,10);} sfx('clear',cl.lines); }
    else if(cl.lines===1) sfx('clear',1); else sfx('place');
    document.getElementById('score').textContent=score;
    if(tray.every(function(t){return t.used;})) tray=[novaPeca(),novaPeca(),novaPeca()];
    checkOver();
  }
  function clearLines(){
    var rows=[],cols=[],r,c;
    for(r=0;r<N;r++){ var f=true; for(c=0;c<N;c++) if(board[r][c]===null){f=false;break;} if(f) rows.push(r); }
    for(c=0;c<N;c++){ var f2=true; for(r=0;r<N;r++) if(board[r][c]===null){f2=false;break;} if(f2) cols.push(c); }
    var lines=rows.length+cols.length;
    if(lines===0){ streak=0; return {lines:0,score:0}; }
    var seen={};
    function kill(r,c){ var k=r+'_'+c; if(seen[k])return; seen[k]=1; pops.push({r:r,c:c,color:board[r][c]||'#22d3ee',t0:now()}); board[r][c]=null; }
    rows.forEach(function(rr){ for(var c=0;c<N;c++) kill(rr,c); });
    cols.forEach(function(cc){ for(var r=0;r<N;r++) kill(r,cc); });
    streak++;
    return {lines:lines, score:10*lines*lines + (streak>1?(streak-1)*10:0)};
  }
  function checkOver(){ for(var i=0;i<tray.length;i++) if(!tray[i].used && anyFit(tray[i])) return; finalizar(); }

  // ── fim: envia jogadas + placar (cross-check no servidor) e vai pra sala ──
  function finalizar(){
    if(ENVIADO) return; ENVIADO=true; over=true; drag=null;
    document.getElementById('over').classList.remove('hidden');
    enviar();
  }
  window.enviar=function(){
    document.getElementById('sp').style.display='block';
    document.getElementById('ot').textContent='Enviando sua partida…';
    document.getElementById('os').textContent='Calculando o resultado com segurança.';
    document.getElementById('retry').classList.add('hidden');
    fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({moves:MOVES, score:score})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j && j.erro){ falhou(j.erro); return; }
        location.href='/arena/sala/'+CFG.token; })
      .catch(function(){ falhou('Sem conexão.'); });
  };
  function falhou(msg){
    document.getElementById('sp').style.display='none';
    document.getElementById('ot').textContent='Não deu pra enviar 😕';
    document.getElementById('os').textContent=msg+' Suas jogadas estão salvas — tente de novo.';
    document.getElementById('retry').classList.remove('hidden');
  }

  function pos(e){ var rc=cv.getBoundingClientRect(); var s=rc.width?board_px/rc.width:1; return {x:(e.clientX-rc.left)*s, y:(e.clientY-rc.top)*s}; }
  function slotX(i){ return i*(slotW+trayGap); }
  function pieceAt(x,y){ if(y<trayY) return -1; for(var i=0;i<3;i++){ if(tray[i].used) continue; var sx=slotX(i); if(x>=sx&&x<=sx+slotW&&y>=trayY&&y<=trayY+slotW) return i; } return -1; }
  function landing(){ if(!drag) return null; var p=tray[drag.idx]; var pw=p.cols*cell, ph=p.rows*cell;
    var tlx=drag.px-pw/2, tly=drag.py-ph/2-cell*0.95; var c=Math.round(tlx/cell), r=Math.round(tly/cell); return {r:r,c:c,ok:canPlace(p,r,c)}; }
  cv.addEventListener('pointerdown',function(e){ if(over) return; unlock(); var p=pos(e), i=pieceAt(p.x,p.y); if(i<0) return;
    drag={idx:i,px:p.x,py:p.y,land:null}; drag.land=landing(); try{cv.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
  cv.addEventListener('pointermove',function(e){ if(!drag) return; var p=pos(e); drag.px=p.x; drag.py=p.y; drag.land=landing(); e.preventDefault(); });
  cv.addEventListener('pointerup',function(){ if(!drag) return; var d=drag; drag=null; if(d.land&&d.land.ok) place(d.idx,d.land.r,d.land.c); });
  cv.addEventListener('pointercancel',function(){drag=null;});

  var actx=null;
  function unlock(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ } } if(actx&&actx.state==='suspended') actx.resume(); }
  function tone(f,d,type,g,delay){ if(!actx) return; var o=actx.createOscillator(), gn=actx.createGain(), t=actx.currentTime+(delay||0);
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(g||0.15,t+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t+d+0.02); }
  function sfx(kind,n){ unlock(); if(kind==='place'){ tone(230,0.07,'triangle',0.12); }
    else if(kind==='clear'){ var base=420; for(var i=0;i<Math.min(n||1,4);i++) tone(base+i*140,0.16,'square',0.13,i*0.06); } }

  function now(){ return performance.now(); }
  function rr(x,y,w,h,rad){ rad=Math.min(rad,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad);
    ctx.arcTo(x+w,y+h,x,y+h,rad); ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath(); }
  function blk(x,y,s,color,a){ var ins=Math.max(1,s*0.055), rad=s*0.2; ctx.globalAlpha=a==null?1:a;
    rr(x+ins,y+ins,s-2*ins,s-2*ins,rad); ctx.fillStyle=color; ctx.fill();
    var g=ctx.createLinearGradient(x,y,x,y+s); g.addColorStop(0,'rgba(255,255,255,.28)'); g.addColorStop(.5,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,.22)');
    rr(x+ins,y+ins,s-2*ins,s-2*ins,rad); ctx.fillStyle=g; ctx.fill(); ctx.globalAlpha=1; }
  function emptyc(x,y,s){ var ins=Math.max(1,s*0.055); rr(x+ins,y+ins,s-2*ins,s-2*ins,s*0.18); ctx.fillStyle='#16152b'; ctx.fill(); }

  function frame(){
    // timer
    if(!over){ var rem=Math.max(0,tEnd-now()); var seg=Math.ceil(rem/1000);
      var tv=document.getElementById('tval'); if(tv) tv.textContent=seg;
      var tb=document.getElementById('tempo'); if(tb){ if(seg<=15) tb.classList.add('baixo'); else tb.classList.remove('baixo'); }
      if(rem<=0){ finalizar(); } }
    ctx.clearRect(0,0,cssW,cssH);
    var sx=0,sy=0;
    if(shakeT){ var a=(now()-shakeT)/280; if(a>=1){shakeT=0;} else { var m=shakeAmt*(1-a); sx=(Math.random()*2-1)*m; sy=(Math.random()*2-1)*m; } }
    ctx.save(); ctx.translate(sx,sy);
    rr(0,0,board_px,board_px,16); ctx.fillStyle='#0c0b1c'; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(168,85,247,.22)'; rr(0.75,0.75,board_px-1.5,board_px-1.5,15); ctx.stroke();
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){ var x=c*cell,y=r*cell; if(board[r][c]===null) emptyc(x,y,cell); else blk(x,y,cell,board[r][c]); }
    for(var i=pops.length-1;i>=0;i--){ var p=pops[i], ag=(now()-p.t0)/260; if(ag>=1){ pops.splice(i,1); continue; }
      var gr=1+ag*0.6, off=cell*(gr-1)/2; blk(p.c*cell-off,p.r*cell-off,cell*gr,p.color,1-ag);
      rr(p.c*cell-off+cell*0.2,p.r*cell-off+cell*0.2,cell*gr-cell*0.4,cell*gr-cell*0.4,cell*0.2); ctx.fillStyle='rgba(255,255,255,'+(0.5*(1-ag))+')'; ctx.fill(); }
    if(drag&&drag.land){ var p2=tray[drag.idx], L=drag.land;
      for(var k=0;k<p2.offs.length;k++){ var gr2=L.r+p2.offs[k][0], gc=L.c+p2.offs[k][1]; if(gr2<0||gr2>=N||gc<0||gc>=N) continue;
        rr(gc*cell+cell*0.09,gr2*cell+cell*0.09,cell*0.82,cell*0.82,cell*0.2); ctx.fillStyle=L.ok?'rgba(52,211,153,.32)':'rgba(244,63,94,.28)'; ctx.fill();
        ctx.lineWidth=2; ctx.strokeStyle=L.ok?'rgba(52,211,153,.85)':'rgba(244,63,94,.7)'; ctx.stroke(); } }
    for(var t=0;t<3;t++){ var sxx=slotX(t); rr(sxx,trayY,slotW,slotW,14); ctx.fillStyle='#0b0a19'; ctx.fill();
      var pc=tray[t]; if(!pc||pc.used) continue; if(drag&&drag.idx===t) continue;
      var tc=Math.min((slotW*0.78)/Math.max(pc.cols,pc.rows),cell*0.86); var px0=sxx+(slotW-pc.cols*tc)/2, py0=trayY+(slotW-pc.rows*tc)/2;
      for(var q=0;q<pc.offs.length;q++) blk(px0+pc.offs[q][1]*tc,py0+pc.offs[q][0]*tc,tc,pc.color); }
    if(drag){ var dp=tray[drag.idx], pw=dp.cols*cell, ph=dp.rows*cell; var ox=drag.px-pw/2, oy=drag.py-ph/2-cell*0.95;
      ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=14; ctx.shadowOffsetY=6;
      for(var m=0;m<dp.offs.length;m++) blk(ox+dp.offs[m][1]*cell,oy+dp.offs[m][0]*cell,cell,dp.color); ctx.restore(); }
    ctx.restore();
    for(var f=floats.length-1;f>=0;f--){ var fl=floats[f], fa=(now()-fl.t0)/900; if(fa>=1){ floats.splice(f,1); continue; }
      ctx.globalAlpha=1-fa; ctx.textAlign='center'; ctx.font=(fl.big?'800 30px':'800 20px')+" 'Segoe UI',system-ui,sans-serif";
      ctx.fillStyle=fl.big?'#22d3ee':'#e9e8ff'; ctx.fillText(fl.t, fl.x, fl.y-fa*34); ctx.globalAlpha=1; }
    if(combo){ var ca=(now()-combo.t0)/800; if(ca>=1){combo=null;} else { ctx.globalAlpha=ca<0.2?ca/0.2:(1-(ca-0.2)/0.8); ctx.textAlign='center';
      var cs=1+(ca<0.2?(0.2-ca)*2:0); ctx.save(); ctx.translate(board_px/2,board_px*0.42); ctx.scale(cs,cs);
      ctx.font="800 30px 'Segoe UI',system-ui,sans-serif"; ctx.fillStyle='#c084fc'; ctx.fillText(combo.t,0,0); ctx.restore(); ctx.globalAlpha=1; } }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize',function(){ layout(); if(drag) drag.land=landing(); });
  layout(); iniciar(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
