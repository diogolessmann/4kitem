<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🧺 Pega-Frutas</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    height:100%;
    background:#07060f;
    color:#f0f0ff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
  }
  body { display:flex; justify-content:center; }
  #wrap {
    width:100%;
    max-width:460px;
    height:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:radial-gradient(circle at 50% 0%, #1a1330 0%, #07060f 70%);
    touch-action:none;
  }
  /* Top bar */
  #topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    gap:8px;
    z-index:20;
  }
  #backbtn {
    text-decoration:none;
    color:#22d3ee;
    background:rgba(34,211,238,0.12);
    border:2px solid rgba(34,211,238,0.35);
    padding:7px 12px;
    border-radius:16px;
    font-weight:800;
    font-size:14px;
    white-space:nowrap;
  }
  #gametitle {
    font-size:16px;
    font-weight:900;
    text-align:center;
    flex:1;
    color:#fbbf24;
    text-shadow:0 0 12px rgba(251,191,36,0.5);
    letter-spacing:0.3px;
  }
  #scorebox {
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:2px;
    background:rgba(168,85,247,0.14);
    border:2px solid rgba(168,85,247,0.35);
    padding:5px 11px;
    border-radius:16px;
    line-height:1.1;
    min-width:74px;
  }
  #scorebox .lbl { font-size:9px; color:#c4b5fd; font-weight:700; letter-spacing:0.5px; }
  #scoreval { font-size:19px; font-weight:900; color:#34d399; }
  #bestval { font-size:11px; font-weight:800; color:#f472b6; }
  /* Lives */
  #lives {
    display:flex;
    justify-content:center;
    gap:6px;
    font-size:22px;
    padding:2px 0 6px;
    z-index:20;
    height:34px;
  }
  #lives .heart { transition:transform .2s ease, opacity .3s ease; }
  #lives .heart.lost { opacity:0.18; transform:scale(0.7); filter:grayscale(1); }
  /* Canvas */
  #game {
    flex:1;
    position:relative;
    width:100%;
    touch-action:none;
    overflow:hidden;
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  /* Overlays */
  .overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    z-index:30;
    background:rgba(7,6,15,0.82);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .overlay.hidden { display:none; }
  .bigemoji { font-size:66px; margin-bottom:6px; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-12px) rotate(4deg);} }
  .overlay h1 {
    font-size:30px;
    font-weight:900;
    margin-bottom:8px;
    background:linear-gradient(90deg,#22d3ee,#a855f7,#f472b6);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .overlay p { font-size:15px; color:#c4b5fd; margin-bottom:6px; line-height:1.5; max-width:320px; }
  .finalscore { font-size:52px; font-weight:900; color:#34d399; text-shadow:0 0 20px rgba(52,211,153,0.5); margin:4px 0; }
  .finallbl { font-size:14px; color:#c4b5fd; font-weight:700; margin-bottom:2px; }
  .recordline { font-size:16px; color:#fbbf24; font-weight:800; margin:8px 0 18px; }
  .newrecord { font-size:18px; color:#f472b6; font-weight:900; margin:6px 0; animation:pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  .btn {
    display:inline-block;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:900;
    font-size:18px;
    padding:15px 26px;
    border-radius:22px;
    margin:7px 0;
    width:100%;
    max-width:320px;
    color:#07060f;
    transition:transform .12s ease;
    touch-action:manipulation;
  }
  .btn:active { transform:scale(0.95); }
  .btn-play { background:linear-gradient(90deg,#34d399,#22d3ee); box-shadow:0 6px 22px rgba(52,211,153,0.4); }
  .btn-wa { background:linear-gradient(90deg,#fbbf24,#f472b6); box-shadow:0 6px 22px rgba(244,114,182,0.4); }
  .btn-again { background:linear-gradient(90deg,#a855f7,#22d3ee); box-shadow:0 6px 22px rgba(168,85,247,0.4); }
  .hint { font-size:13px; color:#8b83b0; margin-top:14px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <a id="backbtn" href="/arena">← Arena</a>
    <div id="gametitle">🧺 Pega-Frutas</div>
    <div id="scorebox">
      <span class="lbl">PONTOS</span>
      <span id="scoreval">0</span>
      <span id="bestval">🏆 0</span>
    </div>
  </div>
  <div id="lives">
    <span class="heart">❤️</span>
    <span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>
  <div id="game">
    <canvas id="cv"></canvas>

    <!-- START -->
    <div class="overlay" id="startScreen">
      <div class="bigemoji">🧺</div>
      <h1>Pega-Frutas</h1>
      <p>Arraste o dedo pra mover a cestinha!<br>Pegue as frutas 🍎🍌🍓 e desvie das bombas 💣</p>
      <button class="btn btn-play" id="startBtn">▶️ Começar!</button>
      <div class="hint">Você tem 3 vidas ❤️❤️❤️</div>
    </div>

    <!-- GAME OVER -->
    <div class="overlay hidden" id="endScreen">
      <div class="bigemoji">🎉</div>
      <h1>Fim de Jogo!</h1>
      <div class="finallbl">Frutas pegas</div>
      <div class="finalscore" id="finalScore">0</div>
      <div class="newrecord hidden" id="newRecord">🌟 NOVO RECORDE! 🌟</div>
      <div class="recordline" id="recordLine">🏆 Recorde: 0</div>
      <button class="btn btn-wa" id="waBtn">📲 Bata meu recorde!</button>
      <button class="btn btn-again" id="againBtn">🔄 Jogar de novo</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "pegafrutas_record_v1";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var gameEl = document.getElementById("game");

  var scoreEl = document.getElementById("scoreval");
  var bestEl  = document.getElementById("bestval");
  var livesEl = document.getElementById("lives");
  var heartEls = livesEl.querySelectorAll(".heart");

  var startScreen = document.getElementById("startScreen");
  var endScreen   = document.getElementById("endScreen");
  var startBtn    = document.getElementById("startBtn");
  var againBtn    = document.getElementById("againBtn");
  var waBtn       = document.getElementById("waBtn");
  var finalScoreEl= document.getElementById("finalScore");
  var recordLineEl= document.getElementById("recordLine");
  var newRecordEl = document.getElementById("newRecord");

  // ---------- record storage ----------
  function loadRecord(){
    try { var v = parseInt(localStorage.getItem(STORE_KEY),10); return isNaN(v)?0:v; }
    catch(e){ return 0; }
  }
  function saveRecord(v){
    try { localStorage.setItem(STORE_KEY, String(v)); } catch(e){}
  }
  var record = loadRecord();
  bestEl.textContent = "🏆 " + record;

  // ---------- sizing / DPR ----------
  var W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    var r = gameEl.getBoundingClientRect();
    W = Math.max(200, r.width);
    H = Math.max(200, r.height);
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    // clamp basket in bounds after resize
    basket.w = Math.min(96, Math.max(66, W*0.20));
    basket.h = basket.w * 0.72;
    if(basket.x < basket.w/2) basket.x = basket.w/2;
    if(basket.x > W - basket.w/2) basket.x = W - basket.w/2;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize,120); });

  // ---------- audio (WebAudio, optional) ----------
  var actx = null;
  function audioCtx(){
    if(actx) return actx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    } catch(e){ actx = null; }
    return actx;
  }
  function beep(freq, dur, type, vol){
    var a = audioCtx();
    if(!a) return;
    try {
      if(a.state === "suspended") a.resume();
      var o = a.createOscillator();
      var g = a.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol||0.14, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (dur||0.14));
      o.connect(g); g.connect(a.destination);
      o.start();
      o.stop(a.currentTime + (dur||0.14));
    } catch(e){}
  }
  function sndCatch(){ beep(660,0.10,"triangle",0.16); setTimeout(function(){beep(990,0.10,"triangle",0.14);},70); }
  function sndBomb(){ beep(140,0.28,"sawtooth",0.22); }
  function sndOver(){ beep(400,0.18,"sine",0.16); setTimeout(function(){beep(260,0.28,"sine",0.16);},150); }

  // ---------- game state ----------
  var FRUITS = ["🍎","🍌","🍓","🍊","🍇","🍉","🍑","🥝"];
  var basket = { x: 200, y: 0, w: 88, h: 62 };
  var items = [];      // falling items
  var particles = [];  // burst particles
  var floaters = [];   // floating "+1" texts

  var score = 0;
  var lives = 3;
  var running = false;
  var lastTime = 0;
  var spawnTimer = 0;
  var spawnInterval = 900; // ms, decreases over time
  var elapsed = 0;
  var rafId = null;

  function reset(){
    items.length = 0;
    particles.length = 0;
    floaters.length = 0;
    score = 0;
    lives = 3;
    elapsed = 0;
    spawnTimer = 0;
    spawnInterval = 900;
    basket.x = W/2;
    updateScore();
    updateLives();
  }

  function updateScore(){ scoreEl.textContent = score; }
  function updateLives(){
    for(var i=0;i<heartEls.length;i++){
      if(i < lives) heartEls[i].classList.remove("lost");
      else heartEls[i].classList.add("lost");
    }
  }

  // ---------- spawning ----------
  function spawnItem(){
    var isBomb = Math.random() < bombChance();
    var size = isBomb ? 40 : (34 + Math.random()*12);
    var margin = size;
    var x = margin + Math.random()*(W - margin*2);
    var speed = baseSpeed() * (0.85 + Math.random()*0.4);
    items.push({
      x: x,
      y: -size,
      size: size,
      emoji: isBomb ? "💣" : FRUITS[(Math.random()*FRUITS.length)|0],
      bomb: isBomb,
      vy: speed,
      vx: (Math.random()-0.5)*0.6,
      rot: (Math.random()-0.5)*0.4,
      spin: (Math.random()-0.5)*0.05,
      dead:false
    });
  }
  // difficulty scaling by elapsed time
  function baseSpeed(){
    // px per second-ish; scaled by dt later
    return (0.14 + Math.min(elapsed/60000,1)*0.16) ; // grows over first minute
  }
  function bombChance(){
    return Math.min(0.10 + (score*0.004) + (elapsed/60000)*0.08, 0.32);
  }
  function currentSpawnInterval(){
    // gets faster with score & time
    var v = 900 - score*11 - (elapsed/1000)*4;
    return Math.max(340, v);
  }

  // ---------- particles ----------
  function burst(x,y,color){
    var n = 10;
    for(var i=0;i<n;i++){
      var ang = (Math.PI*2/n)*i + Math.random()*0.5;
      var sp = 1.4 + Math.random()*2.4;
      particles.push({
        x:x, y:y,
        vx:Math.cos(ang)*sp,
        vy:Math.sin(ang)*sp - 1,
        life:1,
        color:color,
        r: 3 + Math.random()*3
      });
    }
  }
  function addFloater(x,y,txt,color){
    floaters.push({x:x,y:y,txt:txt,color:color,life:1});
  }

  // ---------- input (pointer / touch) ----------
  var dragging = false;
  function pointerX(e){
    var r = cv.getBoundingClientRect();
    var cx;
    if(e.touches && e.touches.length){ cx = e.touches[0].clientX; }
    else { cx = e.clientX; }
    return cx - r.left;
  }
  function moveBasket(px){
    var half = basket.w/2;
    basket.x = Math.max(half, Math.min(W - half, px));
  }
  function onDown(e){
    if(!running) return;
    dragging = true;
    audioCtx(); // unlock on interaction
    moveBasket(pointerX(e));
    if(e.cancelable) e.preventDefault();
  }
  function onMove(e){
    if(!running || !dragging) return;
    moveBasket(pointerX(e));
    if(e.cancelable) e.preventDefault();
  }
  function onUp(){ dragging = false; }

  // pointer events (covers mouse + touch on modern browsers)
  if(window.PointerEvent){
    cv.addEventListener("pointerdown", onDown, {passive:false});
    cv.addEventListener("pointermove", onMove, {passive:false});
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  } else {
    cv.addEventListener("touchstart", onDown, {passive:false});
    cv.addEventListener("touchmove", onMove, {passive:false});
    window.addEventListener("touchend", onUp);
    cv.addEventListener("mousedown", onDown);
    cv.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  // ---------- update ----------
  function update(dt){
    elapsed += dt;
    // spawn
    spawnTimer += dt;
    var interval = currentSpawnInterval();
    if(spawnTimer >= interval){
      spawnTimer = 0;
      spawnItem();
    }

    basket.y = H - basket.h - 10;
    var catchTop = basket.y + 6;
    var catchHalf = basket.w * 0.44;

    // items
    for(var i=0;i<items.length;i++){
      var it = items[i];
      if(it.dead) continue;
      it.y += it.vy * dt;
      it.x += it.vx * dt;
      it.rot += it.spin;
      if(it.x < it.size*0.5){ it.x = it.size*0.5; it.vx = Math.abs(it.vx); }
      if(it.x > W - it.size*0.5){ it.x = W - it.size*0.5; it.vx = -Math.abs(it.vx); }

      // collision with basket (rim area)
      if(!it.dead && it.y + it.size*0.35 >= catchTop && it.y - it.size*0.35 <= basket.y + basket.h){
        if(Math.abs(it.x - basket.x) <= catchHalf + it.size*0.35 && it.y < basket.y + basket.h){
          it.dead = true;
          if(it.bomb){
            lives--;
            updateLives();
            burst(it.x, it.y, "#f472b6");
            addFloater(basket.x, basket.y-10, "-1 ❤️", "#f472b6");
            sndBomb();
            shake();
            if(lives <= 0){ gameOver(); }
          } else {
            score++;
            updateScore();
            burst(it.x, it.y, "#34d399");
            addFloater(basket.x, basket.y-10, "+1", "#34d399");
            sndCatch();
          }
          continue;
        }
      }
      // off bottom
      if(it.y - it.size > H){ it.dead = true; }
    }
    // cleanup dead
    if(items.length > 60 || Math.random()<0.5){
      items = items.filter(function(o){ return !o.dead; });
    }

    // particles
    for(var p=0;p<particles.length;p++){
      var pa = particles[p];
      pa.x += pa.vx;
      pa.y += pa.vy;
      pa.vy += 0.18;
      pa.life -= dt*0.003;
    }
    particles = particles.filter(function(o){ return o.life > 0; });

    // floaters
    for(var f=0;f<floaters.length;f++){
      floaters[f].y -= dt*0.04;
      floaters[f].life -= dt*0.0016;
    }
    floaters = floaters.filter(function(o){ return o.life > 0; });
  }

  // ---------- screen shake ----------
  var shakeT = 0;
  function shake(){ shakeT = 260; }

  // ---------- render ----------
  function draw(){
    ctx.clearRect(0,0,W,H);

    var ox=0, oy=0;
    if(shakeT > 0){
      var m = shakeT/260 * 6;
      ox = (Math.random()-0.5)*m;
      oy = (Math.random()-0.5)*m;
    }
    ctx.save();
    ctx.translate(ox,oy);

    // soft background floor glow
    var grd = ctx.createLinearGradient(0,H-120,0,H);
    grd.addColorStop(0,"rgba(168,85,247,0)");
    grd.addColorStop(1,"rgba(168,85,247,0.10)");
    ctx.fillStyle = grd;
    ctx.fillRect(0,H-120,W,120);

    // items
    for(var i=0;i<items.length;i++){
      var it = items[i];
      if(it.dead) continue;
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      ctx.font = it.size + "px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if(it.bomb){
        ctx.shadowColor = "rgba(244,114,182,0.7)";
        ctx.shadowBlur = 14;
      } else {
        ctx.shadowColor = "rgba(52,211,153,0.35)";
        ctx.shadowBlur = 8;
      }
      ctx.fillText(it.emoji, 0, 0);
      ctx.restore();
    }

    // basket
    drawBasket();

    // particles
    for(var p=0;p<particles.length;p++){
      var pa = particles[p];
      ctx.globalAlpha = Math.max(0, pa.life);
      ctx.fillStyle = pa.color;
      ctx.beginPath();
      ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // floaters
    for(var f=0;f<floaters.length;f++){
      var fl = floaters[f];
      ctx.globalAlpha = Math.max(0, fl.life);
      ctx.fillStyle = fl.color;
      ctx.font = "900 22px -apple-system,sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(fl.txt, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawBasket(){
    var bx = basket.x, by = basket.y, bw = basket.w, bh = basket.h;
    ctx.save();
    // glow
    ctx.shadowColor = "rgba(251,191,36,0.55)";
    ctx.shadowBlur = 18;

    // basket body (rounded trapezoid)
    var topW = bw, botW = bw*0.78;
    var lx = bx - topW/2, rx = bx + topW/2;
    var lbx = bx - botW/2, rbx = bx + botW/2;
    ctx.beginPath();
    ctx.moveTo(lx, by);
    ctx.lineTo(rx, by);
    ctx.lineTo(rbx, by + bh);
    ctx.lineTo(lbx, by + bh);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, by, 0, by+bh);
    g.addColorStop(0, "#fbbf24");
    g.addColorStop(1, "#d97706");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;

    // weave lines
    ctx.strokeStyle = "rgba(120,53,15,0.5)";
    ctx.lineWidth = 2;
    for(var k=1;k<4;k++){
      var yy = by + (bh*k/4);
      var t = k/4;
      var lw = topW*(1-t) + botW*t;
      ctx.beginPath();
      ctx.moveTo(bx - lw/2, yy);
      ctx.lineTo(bx + lw/2, yy);
      ctx.stroke();
    }
    // rim
    ctx.fillStyle = "#f59e0b";
    roundRect(bx - topW/2 - 3, by - 7, topW + 6, 12, 6);
    ctx.fill();
    // rim highlight
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx - topW/2, by - 4);
    ctx.lineTo(bx + topW/2, by - 4);
    ctx.stroke();
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- main loop ----------
  function loop(ts){
    if(!running){ return; }
    if(!lastTime) lastTime = ts;
    var dt = ts - lastTime;
    lastTime = ts;
    if(dt > 60) dt = 60; // clamp big gaps (tab switch)
    if(shakeT > 0){ shakeT -= dt; if(shakeT<0) shakeT=0; }

    update(dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // ---------- game flow ----------
  function startGame(){
    resize();
    reset();
    startScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    running = true;
    lastTime = 0;
    audioCtx();
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function gameOver(){
    running = false;
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    sndOver();
    finalScoreEl.textContent = score;
    var isNew = score > record;
    if(isNew){
      record = score;
      saveRecord(record);
      newRecordEl.classList.remove("hidden");
    } else {
      newRecordEl.classList.add("hidden");
    }
    bestEl.textContent = "🏆 " + record;
    recordLineEl.textContent = "🏆 Recorde: " + record;
    // draw one final frame so it isn't blank behind overlay
    draw();
    endScreen.classList.remove("hidden");
  }

  // WhatsApp share
  waBtn.addEventListener("click", function(){
    var txt = "🧺 Peguei " + score + " frutas no Pega-Frutas da Arena! Bora ver se você me supera? 🍎🍌🍓";
    location.href = "https://wa.me/?text=" + encodeURIComponent(txt + " " + location.href);
  });

  startBtn.addEventListener("click", startGame);
  againBtn.addEventListener("click", startGame);

  // pause loop when tab hidden (avoid runaway dt) 
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ lastTime = 0; }
  });

  // init sizing
  resize();
  // draw idle background
  draw();
})();
</script>
