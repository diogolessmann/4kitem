<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🃏 Jogo da Memória</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#07060f; --txt:#f0f0ff;
    --ciano:#22d3ee; --roxo:#a855f7; --verde:#34d399; --rosa:#f472b6; --amarelo:#fbbf24;
  }
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex; justify-content:center;
    min-height:100vh; min-height:100dvh;
    overscroll-behavior:none; touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
  }
  #app{
    width:100%; max-width:460px; padding:12px;
    display:flex; flex-direction:column; gap:12px;
    position:relative;
  }
  /* TOPO */
  .topbar{
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(34,211,238,.18));
    border:2px solid rgba(168,85,247,.35);
    border-radius:26px; padding:10px 14px;
    box-shadow:0 6px 24px rgba(168,85,247,.18);
  }
  .back{
    color:var(--ciano); text-decoration:none; font-weight:800;
    background:rgba(34,211,238,.12); border:2px solid rgba(34,211,238,.4);
    padding:7px 12px; border-radius:18px; font-size:14px; white-space:nowrap;
    transition:transform .1s;
  }
  .back:active{transform:scale(.92);}
  .title{
    flex:1; text-align:center; font-size:17px; font-weight:900;
    background:linear-gradient(90deg,var(--rosa),var(--amarelo),var(--ciano));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:.3px;
  }
  .scores{display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:11px; line-height:1.1;}
  .scores b{font-size:16px;}
  .s-pts{color:var(--verde);}
  .s-rec{color:var(--amarelo);}
  /* INFO */
  .info{
    display:flex; justify-content:space-around; gap:8px;
    font-size:13px; font-weight:800;
  }
  .chip{
    background:rgba(240,240,255,.06); border:2px solid rgba(240,240,255,.12);
    border-radius:18px; padding:8px 10px; flex:1; text-align:center;
    display:flex; flex-direction:column; gap:2px;
  }
  .chip span{font-size:10px; opacity:.6; font-weight:700;}
  .chip.nivel b{color:var(--roxo);}
  .chip.mov b{color:var(--ciano);}
  .chip.pares b{color:var(--rosa);}
  /* TABULEIRO */
  #board{
    display:grid; gap:10px;
    grid-template-columns:repeat(4,1fr);
    perspective:900px;
  }
  .card{
    position:relative; aspect-ratio:1/1;
    cursor:pointer; touch-action:manipulation;
    transform-style:preserve-3d; transition:transform .35s;
  }
  .card.flipped,.card.matched{transform:rotateY(180deg);}
  .card .face{
    position:absolute; inset:0; border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    font-size:clamp(26px,9vw,42px);
  }
  .card .front{
    background:linear-gradient(145deg,var(--roxo),var(--ciano));
    border:2px solid rgba(255,255,255,.25);
    box-shadow:inset 0 0 18px rgba(255,255,255,.2);
  }
  .card .front::after{content:"🃏"; font-size:clamp(24px,8vw,36px); filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));}
  .card .back{
    background:linear-gradient(145deg,#171528,#241d3d);
    border:2px solid rgba(240,240,255,.18);
    transform:rotateY(180deg);
  }
  .card.matched .back{
    background:linear-gradient(145deg,rgba(52,211,153,.35),rgba(34,211,238,.3));
    border-color:var(--verde);
    animation:pop .45s ease;
  }
  .card.wrong .back{
    border-color:var(--rosa);
    animation:shake .4s ease;
  }
  @keyframes pop{0%{transform:rotateY(180deg) scale(1);}45%{transform:rotateY(180deg) scale(1.18);}100%{transform:rotateY(180deg) scale(1);}}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-6px);}75%{transform:rotateY(180deg) translateX(6px);}}
  /* TOAST nível */
  #toast{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.6);
    background:linear-gradient(135deg,var(--verde),var(--ciano));
    color:#07060f; font-weight:900; font-size:22px;
    padding:16px 26px; border-radius:24px; opacity:0; pointer-events:none;
    box-shadow:0 10px 40px rgba(52,211,153,.5); z-index:20; text-align:center;
    white-space:pre-line;
    transition:opacity .25s;
  }
  #toast.show{opacity:1; animation:toastIn .5s ease;}
  @keyframes toastIn{0%{transform:translate(-50%,-50%) scale(.5);}60%{transform:translate(-50%,-50%) scale(1.12);}100%{transform:translate(-50%,-50%) scale(1);}}
  /* Overlay comemoração */
  #overlay{
    position:fixed; inset:0; background:rgba(7,6,15,.92);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
    backdrop-filter:blur(4px);
  }
  #overlay.show{display:flex;}
  .panel{
    width:100%; max-width:400px; text-align:center;
    background:linear-gradient(160deg,rgba(168,85,247,.2),rgba(34,211,238,.14));
    border:2px solid rgba(168,85,247,.4); border-radius:30px;
    padding:26px 20px; box-shadow:0 12px 50px rgba(0,0,0,.6);
    display:flex; flex-direction:column; gap:14px;
  }
  .panel h2{font-size:28px; background:linear-gradient(90deg,var(--amarelo),var(--rosa));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .panel .big{font-size:44px; font-weight:900; color:var(--verde);}
  .panel .lbl{font-size:13px; opacity:.7;}
  .panel .rec{font-size:15px; color:var(--amarelo); font-weight:800;}
  .btn{
    border:none; border-radius:22px; padding:15px; font-size:16px; font-weight:900;
    cursor:pointer; color:#07060f; touch-action:manipulation; transition:transform .1s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.95);}
  .btn.wa{background:linear-gradient(135deg,var(--verde),#25d366);}
  .btn.again{background:linear-gradient(135deg,var(--amarelo),var(--rosa));}
  .footer-btn{
    background:linear-gradient(135deg,rgba(244,114,182,.2),rgba(251,191,36,.15));
    border:2px solid rgba(244,114,182,.35); color:var(--txt);
    border-radius:20px; padding:12px; font-size:14px; font-weight:800;
    cursor:pointer; font-family:inherit; touch-action:manipulation; transition:transform .1s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .footer-btn:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="back" href="/arena">← Arena</a>
    <div class="title">🃏 Memória</div>
    <div class="scores">
      <div class="s-pts">PTS <b id="hudPts">0</b></div>
      <div class="s-rec">🏆 <b id="hudRec">0</b></div>
    </div>
  </div>

  <div class="info">
    <div class="chip nivel"><span>NÍVEL</span><b id="hudNivel">1</b></div>
    <div class="chip mov"><span>MOVIMENTOS</span><b id="hudMov">0</b></div>
    <div class="chip pares"><span>PARES</span><b id="hudPares">0/8</b></div>
  </div>

  <div id="board"></div>

  <button class="footer-btn" id="btnShare">📲 Bata meu recorde!</button>

  <div id="toast"></div>
</div>

<!-- Overlay opcional de comemoração de recorde -->
<div id="overlay">
  <div class="panel">
    <h2 id="ovTitle">🎉 Novo Recorde!</h2>
    <div class="lbl">Você fez</div>
    <div class="big" id="ovPts">0</div>
    <div class="lbl">pontos</div>
    <div class="rec" id="ovRec">🏆 Recorde: 0</div>
    <button class="btn wa" id="ovShare">📲 Bata meu recorde!</button>
    <button class="btn again" id="ovAgain">🔄 Jogar de novo</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var REC_KEY = "memoria_ambition_recorde_v1";

  // Baralho de emojis fofos (bichos + frutas de reserva)
  var EMOJIS = ["🐶","🐱","🦁","🐸","🐵","🦄","🐷","🐧","🐨","🐰","🐯","🦊","🐮","🐔","🦉","🐢","🍓","🍌","🍎","🍇","🍉","🍑"];

  var board = document.getElementById("board");
  var hudPts = document.getElementById("hudPts");
  var hudRec = document.getElementById("hudRec");
  var hudNivel = document.getElementById("hudNivel");
  var hudMov = document.getElementById("hudMov");
  var hudPares = document.getElementById("hudPares");
  var toast = document.getElementById("toast");
  var overlay = document.getElementById("overlay");

  var state = {
    nivel: 1,
    pontos: 0,
    movimentos: 0,
    paresTotal: 8,
    paresAchados: 0,
    first: null,      // primeira carta virada
    lock: false,      // trava durante checagem
    recorde: 0
  };

  // ---- localStorage seguro ----
  function loadRec(){
    try{
      var v = parseInt(localStorage.getItem(REC_KEY),10);
      return isNaN(v) ? 0 : v;
    }catch(e){ return 0; }
  }
  function saveRec(v){
    try{ localStorage.setItem(REC_KEY, String(v)); }catch(e){}
  }

  // ---- WebAudio (som curto opcional) ----
  var audioCtx = null;
  function ensureAudio(){
    if(audioCtx) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }catch(e){ audioCtx = null; }
  }
  function beep(freq, dur, type){
    if(!audioCtx) return;
    try{
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
    }catch(e){}
  }
  function somAcerto(){ beep(660,0.09,"triangle"); setTimeout(function(){beep(990,0.12,"triangle");},90); }
  function somErro(){ beep(200,0.14,"sawtooth"); }
  function somVitoria(){
    var notas=[523,659,784,1047];
    notas.forEach(function(n,i){ setTimeout(function(){beep(n,0.14,"triangle");}, i*110); });
  }

  // ---- utilidades ----
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function updateHUD(){
    hudPts.textContent = state.pontos;
    hudRec.textContent = state.recorde;
    hudNivel.textContent = state.nivel;
    hudMov.textContent = state.movimentos;
    hudPares.textContent = state.paresAchados + "/" + state.paresTotal;
  }

  function showToast(txt, ms){
    toast.textContent = txt;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove("show"); }, ms||1400);
  }

  // ---- construir tabuleiro ----
  function buildBoard(){
    board.innerHTML = "";
    state.first = null;
    state.lock = false;
    state.paresAchados = 0;
    state.movimentos = 0;

    // quantidade de pares por nível: 8, 8, 10, 10, 12, 12...
    var pares = state.paresTotal;

    // escolhe emojis distintos
    var pool = shuffle(EMOJIS.slice());
    var chosen = pool.slice(0, pares);
    var deck = shuffle(chosen.concat(chosen)); // cada emoji duas vezes

    board.style.gridTemplateColumns = "repeat(4,1fr)";

    for(var i=0;i<deck.length;i++){
      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("data-emoji", deck[i]);
      card.innerHTML =
        '<div class="face front"></div>' +
        '<div class="face back">' + deck[i] + '</div>';
      card.addEventListener("pointerup", onCardTap, {passive:true});
      board.appendChild(card);
    }
    updateHUD();
  }

  // ---- lógica de toque ----
  function onCardTap(e){
    ensureAudio();
    var card = e.currentTarget;
    if(state.lock) return;
    if(card.classList.contains("flipped") || card.classList.contains("matched")) return;

    card.classList.add("flipped");
    beep(520,0.05,"sine");

    if(!state.first){
      state.first = card;
      return;
    }

    // segunda carta
    state.movimentos++;
    updateHUD();
    var a = state.first, b = card;
    state.first = null;

    if(a.getAttribute("data-emoji") === b.getAttribute("data-emoji")){
      // ACERTO
      state.lock = true;
      setTimeout(function(){
        a.classList.add("matched");
        b.classList.add("matched");
        a.classList.remove("flipped");
        b.classList.remove("flipped");
        state.paresAchados++;
        // pontos: base + bônus por eficiência (movimentos baixos)
        var ganho = 10 + Math.max(0, 5 - Math.floor(state.movimentos/state.paresTotal));
        state.pontos += ganho;
        checkRecord();
        somAcerto();
        showToast("✨ +" + ganho, 800);
        updateHUD();
        state.lock = false;
        if(state.paresAchados >= state.paresTotal){
          setTimeout(nextLevel, 600);
        }
      }, 260);
    } else {
      // ERRO -> volta depois de ~700ms
      state.lock = true;
      a.classList.add("wrong");
      b.classList.add("wrong");
      somErro();
      setTimeout(function(){
        a.classList.remove("flipped","wrong");
        b.classList.remove("flipped","wrong");
        state.lock = false;
      }, 700);
    }
  }

  function checkRecord(){
    if(state.pontos > state.recorde){
      state.recorde = state.pontos;
      saveRec(state.recorde);
    }
  }

  // ---- vitória de nível -> próximo tabuleiro ----
  function nextLevel(){
    somVitoria();
    // bônus por concluir nível com poucos movimentos
    var perfeito = state.paresTotal; // mínimo possível de acertos = nº de pares
    var bonus = 20;
    if(state.movimentos <= perfeito + 2) bonus += 30; // quase perfeito
    else if(state.movimentos <= perfeito + 5) bonus += 15;
    state.pontos += bonus;
    checkRecord();
    updateHUD();

    showToast("🎉 Nível " + state.nivel + "!\n+" + bonus + " bônus", 1600);

    state.nivel++;
    // a cada 2 níveis aumenta o nº de pares (até 12)
    if(state.nivel % 2 === 1 && state.paresTotal < 12){
      state.paresTotal += 2;
    }

    setTimeout(function(){
      buildBoard();
    }, 1200);
  }

  // ---- compartilhar no WhatsApp ----
  function share(){
    var txt = "Eu fiz " + state.pontos + " pontos no 🃏 Jogo da Memória da Arena! Bora ver se você me supera? 😜";
    location.href = "https://wa.me/?text=" + encodeURIComponent(txt + " " + location.href);
  }
  document.getElementById("btnShare").addEventListener("click", share);
  document.getElementById("ovShare").addEventListener("click", share);
  document.getElementById("ovAgain").addEventListener("click", function(){
    overlay.classList.remove("show");
    resetGame();
  });

  function resetGame(){
    state.nivel = 1;
    state.pontos = 0;
    state.paresTotal = 8;
    buildBoard();
    updateHUD();
  }

  // ---- init ----
  state.recorde = loadRec();
  buildBoard();
  updateHUD();

})();
</script>
</body>
</html>
