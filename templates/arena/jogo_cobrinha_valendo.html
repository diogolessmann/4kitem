<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07060f">
<title>Duelo Cobrinha — Arena · AmbitiON</title>
<style>
  html,body{margin:0;background:#07060f;color:#f0f0ff;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;}
  *{box-sizing:border-box;}
  .wrap{max-width:462px;margin:0 auto;padding:8px 12px 24px;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .brand{font-size:15px;font-weight:800;letter-spacing:.4px;}
  .brand span{color:#34d399;}
  .brand small{display:block;font-size:9px;font-weight:800;letter-spacing:2px;color:#c084fc;margin-top:1px;}
  .stats{display:flex;align-items:center;gap:8px;}
  .stat{background:#100f22;border:1px solid rgba(168,85,247,.16);border-radius:12px;padding:6px 12px;text-align:center;min-width:66px;}
  .lab{display:block;font-size:9px;font-weight:800;letter-spacing:1.2px;color:#7d7ca6;}
  .val{display:block;font-size:20px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:#f4f3ff;}
  #tempo .val{color:#22d3ee;}
  #tempo.baixo .val{color:#f43f5e;}
  .alvo{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(168,85,247,.14);
    border:1px solid rgba(168,85,247,.42);border-radius:12px;padding:8px 12px;margin-bottom:10px;
    font-size:13px;font-weight:700;color:#ecdcff;text-align:center;}
  .alvo.hidden{display:none;}
  .stage{position:relative;line-height:0;}
  canvas{width:100%;display:block;border-radius:16px;touch-action:none;}
  .hint{text-align:center;font-size:12px;color:#8786ab;margin-top:12px;line-height:1.5;}
  .hint b{color:#34d399;}
  .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:rgba(7,6,15,.9);border-radius:16px;backdrop-filter:blur(3px);text-align:center;padding:24px;}
  .over.hidden{display:none;}
  .over .sp{width:38px;height:38px;border:4px solid rgba(168,85,247,.25);border-top-color:#a855f7;
    border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .over .t{font-size:16px;font-weight:800;color:#e9e8ff;}
  .over .s{font-size:12.5px;color:#9c9bc4;}
  .over .btn{margin-top:8px;background:linear-gradient(135deg,#22d3ee,#7c3aed);color:#fff;border:none;
    border-radius:12px;padding:12px 22px;font-size:14px;font-weight:800;cursor:pointer;}
  .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:800;
    color:#34d399;background:rgba(7,6,15,.55);border-radius:16px;text-shadow:0 4px 24px rgba(52,211,153,.5);}
  .cd.hidden{display:none;}
  @media (prefers-reduced-motion:reduce){.over{backdrop-filter:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">🐍 Cobri<span>nha</span><small>💸 VALENDO · R$ {{ aposta }}</small></div>
    <div class="stats">
      <div class="stat"><span class="lab">PONTOS</span><span class="val" id="score">0</span></div>
      <div class="stat" id="tempo"><span class="lab">TEMPO</span><span class="val" id="tval">90</span></div>
    </div>
  </div>
  {% if alvo is not none %}
  <div class="alvo" id="alvo">🎯 Bata o adversário: <b style="margin-left:4px">{{ alvo }} pontos</b></div>
  {% endif %}
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="cd" id="cd">3</div>
    <div class="over hidden" id="over">
      <div class="sp" id="sp"></div>
      <div class="t" id="ot">Enviando sua partida…</div>
      <div class="s" id="os">Calculando o resultado com segurança.</div>
      <button class="btn hidden" id="retry" onclick="enviar()">Tentar de novo</button>
    </div>
  </div>
  <div class="hint">👆 <b>Arraste o dedo</b> pra virar. Coma o máximo em <b>90s</b> — o servidor confere e o maior leva. 💸</div>
</div>

<script>
var CFG = {
  token: {{ token|tojson }},
  seed: ({{ seed }} >>> 0),
  endpoint: {{ endpoint|tojson }},
  alvo: {{ (alvo if alvo is not none else 'null') }}
};
(function(){
  "use strict";
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var N=17, cell, px, dpr;

  // ── RNG mulberry32 (MESMO do blocos, bit-exato com o motor Python) ──
  var seed=CFG.seed>>>0;
  function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }

  var snake, sset, dirr, nextDir, food, score, tk, simElapsed, over, MOVES, ENVIADO, pop=null;

  function layout(){
    var w=Math.min((window.innerWidth||400)-24,462);
    cell=Math.floor(w/N); px=cell*N;
    dpr=Math.min(window.devicePixelRatio||1,2.5);
    cv.style.width=px+'px'; cv.style.height=px+'px';
    cv.width=Math.round(px*dpr); cv.height=Math.round(px*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function inSnake(r,c){ for(var i=0;i<snake.length;i++) if(snake[i].r===r&&snake[i].c===c) return true; return false; }
  // ESPELHA _food(rng, snake) do Python: r depois c; pula célula ocupada; 400 tentativas
  function makeFood(){
    for(var i=0;i<400;i++){ var r=Math.floor(rnd()*N), c=Math.floor(rnd()*N); if(!inSnake(r,c)) return {r:r,c:c}; }
    return {r:Math.floor(rnd()*N), c:Math.floor(rnd()*N)};
  }
  function iniciar(){
    var m=(N/2)|0;
    snake=[{r:m,c:m},{r:m,c:m-1},{r:m,c:m-2}];   // cabeça primeiro, indo pra direita
    dirr={dr:0,dc:1}; nextDir=null; score=0; tk=0; simElapsed=0; over=false; MOVES=[]; ENVIADO=false;
    document.getElementById('score').textContent=0;
    food=makeFood();
  }
  function now(){ return performance.now(); }

  // ── UM TICK — idêntico ao passo() do motor Python ──
  function step(){
    if(nextDir){
      var rev=(nextDir.dr===-dirr.dr && nextDir.dc===-dirr.dc);
      var same=(nextDir.dr===dirr.dr && nextDir.dc===dirr.dc);
      if(!rev && !same){ dirr={dr:nextDir.dr,dc:nextDir.dc}; MOVES.push([tk, dirr.dr, dirr.dc]); }
    }
    var head=snake[0], h={r:head.r+dirr.dr, c:head.c+dirr.dc};
    if(h.r<0||h.r>=N||h.c<0||h.c>=N){ return finalizar(); }            // parede
    for(var i=0;i<snake.length-1;i++){ if(snake[i].r===h.r&&snake[i].c===h.c){ return finalizar(); } }  // corpo (menos cauda)
    var eating=(h.r===food.r && h.c===food.c);
    snake.unshift(h);
    if(eating){
      score++; document.getElementById('score').textContent=score;
      pop={r:food.r,c:food.c,t0:now()}; sfx('eat'); food=makeFood();
    } else { snake.pop(); }
    simElapsed += Math.max(130,200-score*2); tk++;
    if(simElapsed>=90000){ return finalizar(); }                       // 90s (servidor corta igual)
  }

  // ── loop: passos no ritmo real, mas o FIM é por sim-time (bate com o servidor) ──
  var acc=0, last=0, started=false;
  function loop(){
    if(started && !over){
      var t=now(); acc += (t-last); last=t; if(acc>300) acc=300;   // sem burst após travar/minimizar
      var guard=0, spd=Math.max(130,200-score*2);
      while(!over && acc>=spd && simElapsed<90000){ acc-=spd; step(); spd=Math.max(130,200-score*2); if(++guard>10) break; }
      var rem=Math.max(0,90000-simElapsed), seg=Math.ceil(rem/1000);
      var tv=document.getElementById('tval'); if(tv) tv.textContent=seg;
      var tb=document.getElementById('tempo'); if(tb){ if(seg<=15) tb.classList.add('baixo'); else tb.classList.remove('baixo'); }
    }
    draw();
    if(!ENVIADO) requestAnimationFrame(loop);
  }

  // ── controles: arrastar o dedo (reancora) + setas ──
  function vira(dr,dc){ if(over||!started) return; nextDir={dr:dr,dc:dc}; }
  var anchor=null;
  cv.addEventListener('pointerdown',function(e){ unlock(); anchor={x:e.clientX,y:e.clientY}; e.preventDefault(); });
  cv.addEventListener('pointermove',function(e){ if(!anchor) return;
    var dx=e.clientX-anchor.x, dy=e.clientY-anchor.y, th=Math.max(12,cell*0.45);
    if(Math.abs(dx)<th&&Math.abs(dy)<th) return;
    if(Math.abs(dx)>Math.abs(dy)) vira(0,dx>0?1:-1); else vira(dy>0?1:-1,0);
    anchor={x:e.clientX,y:e.clientY}; e.preventDefault(); });
  cv.addEventListener('pointerup',function(){ anchor=null; });
  cv.addEventListener('pointercancel',function(){ anchor=null; });
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp')vira(-1,0); else if(e.key==='ArrowDown')vira(1,0);
    else if(e.key==='ArrowLeft')vira(0,-1); else if(e.key==='ArrowRight')vira(0,1); });

  // ── fim: envia jogadas + placar (cross-check no servidor) e vai pra sala ──
  function finalizar(){
    if(ENVIADO) return; ENVIADO=true; over=true; anchor=null;
    document.getElementById('over').classList.remove('hidden');
    enviar();
  }
  window.enviar=function(){
    document.getElementById('sp').style.display='block';
    document.getElementById('ot').textContent='Enviando sua partida…';
    document.getElementById('os').textContent='Calculando o resultado com segurança.';
    document.getElementById('retry').classList.add('hidden');
    fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({moves:MOVES, score:score})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j && j.erro){ falhou(j.erro); return; }
        location.href='/arena/sala/'+CFG.token; })
      .catch(function(){ falhou('Sem conexão.'); });
  };
  function falhou(msg){
    document.getElementById('sp').style.display='none';
    document.getElementById('ot').textContent='Não deu pra enviar 😕';
    document.getElementById('os').textContent=msg+' Suas jogadas estão salvas — tente de novo.';
    document.getElementById('retry').classList.remove('hidden');
  }

  // ── som ──
  var actx=null;
  function unlock(){ if(!actx){ try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}} if(actx&&actx.state==='suspended')actx.resume(); }
  function sfx(k){ if(!actx)return; var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=k==='eat'?'square':'sawtooth'; o.frequency.setValueAtTime(k==='eat'?520:200,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.12); }

  // ── desenho ──
  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function draw(){
    ctx.clearRect(0,0,px,px);
    rr(0,0,px,px,16); ctx.fillStyle='#0c0b1c'; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(52,211,153,.18)'; rr(0.75,0.75,px-1.5,px-1.5,15); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
    for(var i=1;i<N;i++){ ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,px); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(px,i*cell); ctx.stroke(); }
    if(food){ var fx=food.c*cell+cell/2, fy=food.r*cell+cell/2;
      if(pop && (now()-pop.t0)>220) pop=null;
      ctx.save(); ctx.shadowColor='#34d399'; ctx.shadowBlur=12; ctx.fillStyle='#34d399';
      ctx.beginPath(); ctx.arc(fx,fy,cell*0.34,0,7); ctx.fill(); ctx.restore(); }
    if(snake){ for(var s=snake.length-1;s>=0;s--){ var seg=snake[s], x=seg.c*cell, y=seg.r*cell, ins=Math.max(1,cell*0.09), head=(s===0);
      rr(x+ins,y+ins,cell-2*ins,cell-2*ins,cell*0.28);
      if(head){ ctx.fillStyle='#67e8f9'; } else { var tt=s/snake.length; ctx.fillStyle='rgb('+Math.round(34+tt*10)+','+Math.round(211-tt*60)+','+Math.round(238-tt*40)+')'; }
      ctx.fill();
      if(head){ ctx.fillStyle='#07060f'; var e=cell*0.13, ox=dirr.dc*cell*0.12, oy=dirr.dr*cell*0.12;
        ctx.beginPath(); ctx.arc(x+cell*0.36+ox,y+cell*0.38+oy,e,0,7); ctx.arc(x+cell*0.64+ox,y+cell*0.38+oy,e,0,7); ctx.fill(); } } }
  }

  // ── contagem 3·2·1 antes de começar (não afeta o motor: tick 0 = 1º passo) ──
  function contagem(){
    var el=document.getElementById('cd'), n=3;
    el.textContent=n;
    var iv=setInterval(function(){ n--;
      if(n>0){ el.textContent=n; }
      else if(n===0){ el.textContent='JÁ!'; }
      else { clearInterval(iv); el.classList.add('hidden'); started=true; last=now(); }
    }, 700);
  }

  window.addEventListener('resize',layout);
  layout(); iniciar(); requestAnimationFrame(loop); contagem();
})();
</script>
</body>
</html>
