<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07060f">
<title>Criar conta — Arena · AmbitiON</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#07060f;color:#f0f0ff;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px}
.brand{text-align:center;font-size:24px;font-weight:800;margin-bottom:4px}
.brand span{background:linear-gradient(135deg,#22d3ee,#a855f7);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:13px;color:#8b8aa8;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:600;color:#8888aa;margin:14px 0 6px}
input{width:100%;background:#0d0d1a;border:1px solid rgba(255,255,255,.1);border-radius:11px;
  color:#f0f0ff;padding:14px;font-size:16px;font-family:inherit;outline:none}
input:focus{border-color:#a855f7}
.btn{width:100%;background:linear-gradient(135deg,#22d3ee,#7c3aed);color:#fff;border:none;
  border-radius:13px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px}
.err{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);color:#fda4af;
  border-radius:10px;padding:11px;font-size:13px;margin-top:14px;text-align:center}
.alt{text-align:center;font-size:13px;color:#8b8aa8;margin-top:20px}
.alt a{color:#22d3ee;text-decoration:none;font-weight:700}
.hint{font-size:11px;color:#6b6a8f;margin-top:6px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<form class="card" method="POST" action="/arena/cadastrar">
  <div class="brand">🎮 <span>Arena</span></div>
  <div class="sub">Crie sua conta grátis</div>
  {% if erro %}<div class="err">{{ erro }}</div>{% endif %}
  <label>Seu nome</label>
  <input type="text" name="nome" placeholder="Como te chamam" required autofocus>
  <label>E-mail</label>
  <input type="email" name="email" placeholder="seu@email.com" required>
  <label>WhatsApp (com DDD)</label>
  <input type="tel" name="tel" inputmode="numeric" placeholder="47 99999-9999">
  <label>Crie uma senha</label>
  <input type="password" name="senha" placeholder="mínimo 4 caracteres" required>
  <label>Chave PIX pra receber prêmios <span style="color:#6b6a8f;font-weight:400">(opcional)</span></label>
  <div style="display:flex;gap:8px">
    <select name="pix_tipo" style="flex:0 0 40%;background:#0d0d1a;border:1px solid rgba(255,255,255,.1);border-radius:11px;color:#f0f0ff;padding:14px;font-size:15px;font-family:inherit;outline:none">
      <option value="CPF">CPF</option>
      <option value="CELULAR">Celular</option>
      <option value="EMAIL">E-mail</option>
      <option value="ALEATORIA">Aleatória</option>
    </select>
    <input type="text" name="pix_chave" placeholder="sua chave PIX" style="flex:1">
  </div>
  <div class="hint" style="text-align:left">É onde cai seu prêmio quando você ganhar. Pode deixar em branco e preencher na hora de sacar. 💸</div>
  <button class="btn" type="submit">Criar conta e jogar</button>
  <div class="alt">Já tem conta? <a href="/arena/entrar">Entrar</a></div>
</form>
</body>
</html>
