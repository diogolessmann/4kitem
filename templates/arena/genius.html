<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Genius Neon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#07060f;
    color:#f0f0ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
  }
  #app {
    width:100%; max-width:460px;
    display:flex; flex-direction:column;
    min-height:100dvh;
    padding:10px 14px 18px;
  }
  /* TOP BAR */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:10px 12px;
    background:linear-gradient(135deg,rgba(168,85,247,.18),rgba(34,211,238,.14));
    border:1px solid rgba(168,85,247,.35);
    border-radius:24px;
    box-shadow:0 0 22px rgba(168,85,247,.20);
  }
  .back {
    color:#22d3ee; text-decoration:none; font-weight:800; font-size:14px;
    background:rgba(34,211,238,.12); padding:8px 12px; border-radius:16px;
    border:1px solid rgba(34,211,238,.35); white-space:nowrap;
  }
  .back:active { transform:scale(.94); }
  .title {
    font-weight:900; font-size:16px; text-align:center; flex:1;
    letter-spacing:.3px;
    text-shadow:0 0 14px rgba(251,191,36,.5);
  }
  .scores { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .scoreItem { font-size:11px; font-weight:800; line-height:1.15; white-space:nowrap; }
  .scoreItem .lbl { color:#b9b9d6; font-weight:700; }
  .scoreItem .val { color:#34d399; font-size:15px; }
  .scoreItem.rec .val { color:#fbbf24; }

  /* STATUS */
  .status {
    text-align:center; margin:16px 0 10px; font-weight:900; font-size:20px;
    min-height:26px; letter-spacing:.4px;
    text-shadow:0 0 16px currentColor;
  }
  .status.watch { color:#a855f7; }
  .status.play  { color:#34d399; }
  .status.wrong { color:#f472b6; }

  /* GAME AREA */
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .board {
    position:relative;
    width:min(88vw,340px); height:min(88vw,340px);
    border-radius:50%;
    display:grid;
    grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    gap:12px; padding:12px;
    background:radial-gradient(circle at 50% 50%,#141026,#0b0918);
    box-shadow:0 0 40px rgba(34,211,238,.14), inset 0 0 30px rgba(0,0,0,.6);
  }
  .pad {
    border:none; cursor:pointer;
    transition:filter .08s, transform .08s, box-shadow .08s;
    box-shadow:inset 0 0 18px rgba(0,0,0,.4);
    filter:brightness(.55) saturate(.9);
    touch-action:none;
  }
  .pad.g { background:#34d399; border-top-left-radius:100%; border-radius:100% 22px 22px 22px; }
  .pad.r { background:#f472b6; border-top-right-radius:100%; border-radius:22px 100% 22px 22px; }
  .pad.y { background:#fbbf24; border-bottom-left-radius:100%; border-radius:22px 22px 22px 100%; }
  .pad.b { background:#22d3ee; border-bottom-right-radius:100%; border-radius:22px 22px 100% 22px; }
  .pad.lit {
    filter:brightness(1.5) saturate(1.3);
    transform:scale(1.03);
  }
  .pad.g.lit { box-shadow:0 0 34px 6px #34d399, inset 0 0 20px rgba(255,255,255,.5); }
  .pad.r.lit { box-shadow:0 0 34px 6px #f472b6, inset 0 0 20px rgba(255,255,255,.5); }
  .pad.y.lit { box-shadow:0 0 34px 6px #fbbf24, inset 0 0 20px rgba(255,255,255,.5); }
  .pad.b.lit { box-shadow:0 0 34px 6px #22d3ee, inset 0 0 20px rgba(255,255,255,.5); }

  .hub {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:34%; height:34%; border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#1c1533,#0a0716);
    border:2px solid rgba(168,85,247,.4);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 24px rgba(168,85,247,.35), inset 0 0 18px rgba(0,0,0,.7);
    font-size:30px;
    pointer-events:none;
  }
  .hub .lvl {
    position:absolute; bottom:-2px; font-size:13px; font-weight:900; color:#f0f0ff;
    text-shadow:0 0 8px #a855f7;
  }

  /* START BUTTON */
  .bigbtn {
    margin-top:18px;
    background:linear-gradient(135deg,#a855f7,#22d3ee);
    color:#fff; font-weight:900; font-size:18px;
    border:none; border-radius:22px; padding:16px 34px;
    box-shadow:0 8px 24px rgba(168,85,247,.4);
    cursor:pointer; letter-spacing:.5px;
  }
  .bigbtn:active { transform:scale(.95); }
  .hint { margin-top:12px; font-size:13px; color:#b9b9d6; text-align:center; font-weight:600; }

  /* OVERLAY / GAME OVER */
  .overlay {
    position:fixed; inset:0; z-index:20;
    background:rgba(7,6,15,.82);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .overlay.hidden { display:none; }
  .card {
    width:100%; max-width:360px;
    background:linear-gradient(160deg,#15112b,#0c0a1c);
    border:1px solid rgba(168,85,247,.4);
    border-radius:30px; padding:26px 22px;
    text-align:center;
    box-shadow:0 0 44px rgba(168,85,247,.3);
    animation:pop .3s ease;
  }
  @keyframes pop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .card h2 { font-size:26px; font-weight:900; margin-bottom:6px; }
  .card .emoji { font-size:52px; margin-bottom:8px; }
  .bigscore { font-size:56px; font-weight:900; color:#34d399; line-height:1; margin:8px 0; text-shadow:0 0 20px rgba(52,211,153,.6); }
  .bigscore .u { font-size:18px; color:#b9b9d6; }
  .reclabel { font-size:14px; font-weight:800; color:#fbbf24; margin-bottom:16px; }
  .newrec { color:#f472b6; font-weight:900; font-size:16px; margin:6px 0 14px; animation:blink 1s infinite; }
  @keyframes blink { 50%{opacity:.4} }
  .card button {
    width:100%; border:none; border-radius:18px; padding:15px;
    font-weight:900; font-size:16px; cursor:pointer; margin-top:10px;
    letter-spacing:.3px;
  }
  .btn-wa { background:linear-gradient(135deg,#34d399,#22d3ee); color:#06231d; }
  .btn-again { background:rgba(168,85,247,.22); color:#f0f0ff; border:1px solid rgba(168,85,247,.5)!important; }
  .card button:active { transform:scale(.96); }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="back" href="/arena">← Arena</a>
    <div class="title">🎨 Genius</div>
    <div class="scores">
      <div class="scoreItem"><span class="lbl">Pontos</span> <span class="val" id="score">0</span></div>
      <div class="scoreItem rec"><span class="lbl">Recorde</span> <span class="val" id="best">0</span></div>
    </div>
  </div>

  <div class="status play" id="status">Toque em Começar!</div>

  <div class="stage">
    <div class="board" id="board">
      <button class="pad g" data-c="0" aria-label="verde"></button>
      <button class="pad r" data-c="1" aria-label="rosa"></button>
      <button class="pad y" data-c="2" aria-label="amarelo"></button>
      <button class="pad b" data-c="3" aria-label="azul"></button>
      <div class="hub">🎨<span class="lvl" id="lvl"></span></div>
    </div>
    <button class="bigbtn" id="startBtn">▶ Começar</button>
    <div class="hint">Olhe a sequência e repita tocando! 🌈</div>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="card">
    <div class="emoji" id="overEmoji">🎉</div>
    <h2 id="overTitle">Fim de Jogo!</h2>
    <div class="bigscore"><span id="finalScore">0</span> <span class="u">cores</span></div>
    <div class="newrec" id="newRec" style="display:none">🏆 NOVO RECORDE!</div>
    <div class="reclabel" id="overBest">Recorde: 0</div>
    <button class="btn-wa" id="waBtn">📲 Bata meu recorde!</button>
    <button class="btn-again" id="againBtn">🔄 Jogar de novo</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "genius_neon_best_v1";

  // ---- elements ----
  var pads = Array.prototype.slice.call(document.querySelectorAll(".pad"));
  var scoreEl = document.getElementById("score");
  var bestEl  = document.getElementById("best");
  var statusEl= document.getElementById("status");
  var lvlEl   = document.getElementById("lvl");
  var startBtn= document.getElementById("startBtn");
  var over    = document.getElementById("over");
  var finalScoreEl = document.getElementById("finalScore");
  var overBest= document.getElementById("overBest");
  var newRecEl= document.getElementById("newRec");
  var overEmoji=document.getElementById("overEmoji");
  var overTitle=document.getElementById("overTitle");
  var waBtn   = document.getElementById("waBtn");
  var againBtn= document.getElementById("againBtn");

  // ---- state ----
  var best = 0;
  try { best = parseInt(localStorage.getItem(KEY)||"0",10)||0; } catch(e){ best=0; }
  bestEl.textContent = best;

  var seq = [];          // computer sequence (indices 0..3)
  var inputPos = 0;      // player progress in current round
  var acceptingInput = false;
  var playing = false;
  var finalScore = 0;

  // color tone frequencies (distinct, cheerful)
  var TONES = [329.63, 261.63, 220.00, 440.00]; // green, rosa(low C), yellow(low A), blue(A4)
  // green E4, rosa C4, amarelo A3, azul A4

  // ---- audio ----
  var actx = null;
  function ensureAudio(){
    if(!actx){
      try { actx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if(actx && actx.state === "suspended"){ actx.resume(); }
  }
  function tone(freq, dur, type){
    if(!actx) return;
    try {
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type||"sine";
      o.frequency.value = freq;
      var t = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+dur+0.02);
    } catch(e){}
  }
  function playColorSound(c){ tone(TONES[c], 0.32, "triangle"); }
  function playError(){ tone(120, 0.5, "sawtooth"); tone(90,0.5,"square"); }
  function playWin(){
    tone(523,0.12,"triangle");
    setTimeout(function(){tone(659,0.12,"triangle");},110);
    setTimeout(function(){tone(784,0.20,"triangle");},220);
  }

  // ---- lighting ----
  function litPad(c, ms){
    var p = pads[c];
    if(!p) return;
    p.classList.add("lit");
    setTimeout(function(){ p.classList.remove("lit"); }, ms||300);
  }
  function flash(c, ms){
    litPad(c, ms);
    playColorSound(c);
  }

  // ---- sequence playback ----
  function speedFor(len){
    // gets a touch faster as it grows, but stays kid-friendly
    var d = 620 - (len*22);
    return Math.max(300, d);
  }
  function showSequence(){
    acceptingInput = false;
    setStatus("watch","👀 Preste atenção...");
    var i = 0;
    var step = speedFor(seq.length);
    var lit = Math.round(step*0.55);
    function next(){
      if(i >= seq.length){
        // done showing -> player turn
        setStatus("play","👉 Sua vez!");
        acceptingInput = true;
        inputPos = 0;
        return;
      }
      flash(seq[i], lit);
      i++;
      setTimeout(next, step);
    }
    // small pause before starting
    setTimeout(next, 520);
  }

  function setStatus(cls, txt){
    statusEl.className = "status " + cls;
    statusEl.textContent = txt;
  }

  // ---- game flow ----
  function nextRound(){
    seq.push(Math.floor(Math.random()*4));
    scoreEl.textContent = seq.length;
    lvlEl.textContent = seq.length;
    showSequence();
  }

  function startGame(){
    ensureAudio();
    playing = true;
    seq = [];
    inputPos = 0;
    finalScore = 0;
    scoreEl.textContent = 0;
    startBtn.style.display = "none";
    over.classList.add("hidden");
    setStatus("play","Prontos? Vai! 🚀");
    setTimeout(nextRound, 450);
  }

  function gameOver(){
    playing = false;
    acceptingInput = false;
    playError();
    // wrong flash on the whole board
    setStatus("wrong","💥 Errou!");
    pads.forEach(function(p){ p.classList.add("lit"); });
    setTimeout(function(){ pads.forEach(function(p){ p.classList.remove("lit"); }); }, 260);

    finalScore = seq.length - 1; // last completed correct length
    if(finalScore < 0) finalScore = 0;

    var isNew = finalScore > best;
    if(isNew){
      best = finalScore;
      try { localStorage.setItem(KEY, String(best)); } catch(e){}
      bestEl.textContent = best;
    }

    setTimeout(function(){ showOver(isNew); }, 700);
  }

  function showOver(isNew){
    finalScoreEl.textContent = finalScore;
    overBest.textContent = "Recorde: " + best;
    if(isNew && finalScore > 0){
      newRecEl.style.display = "block";
      overEmoji.textContent = "🏆";
      overTitle.textContent = "Que memória!";
      playWin();
    } else {
      newRecEl.style.display = "none";
      overEmoji.textContent = finalScore >= 5 ? "😎" : "🎨";
      overTitle.textContent = "Fim de Jogo!";
    }
    over.classList.remove("hidden");
  }

  // ---- player input ----
  function handlePad(c){
    if(!acceptingInput || !playing) return;
    ensureAudio();
    flash(c, 260);

    if(c === seq[inputPos]){
      inputPos++;
      if(inputPos >= seq.length){
        // round cleared!
        acceptingInput = false;
        setStatus("play","✅ Isso! Mais uma...");
        playWin();
        setTimeout(nextRound, 850);
      }
    } else {
      gameOver();
    }
  }

  // pointer events on pads
  pads.forEach(function(p){
    var c = parseInt(p.getAttribute("data-c"),10);
    p.addEventListener("pointerdown", function(ev){
      ev.preventDefault();
      handlePad(c);
    }, {passive:false});
  });

  // start / restart
  startBtn.addEventListener("pointerdown", function(ev){ ev.preventDefault(); startGame(); }, {passive:false});
  againBtn.addEventListener("pointerdown", function(ev){ ev.preventDefault(); startGame(); }, {passive:false});

  // whatsapp share
  waBtn.addEventListener("pointerdown", function(ev){
    ev.preventDefault();
    var txt = "🎨 Fiz " + finalScore + " cores no Genius Neon da Arena! Bora ver se você lembra mais que eu? 🌈🧠";
    location.href = "https://wa.me/?text=" + encodeURIComponent(txt + " " + location.href);
  }, {passive:false});

  // prevent context menu / long press on board
  document.getElementById("board").addEventListener("contextmenu", function(e){ e.preventDefault(); });

})();
</script>
</body>
</html>
