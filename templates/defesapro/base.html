<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DefesaPro{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a12; --surface: #13131f; --surface2: #1a1a2e; --surface3: #222235;
      --border: rgba(255,255,255,.07); --border2: rgba(255,255,255,.12);
      --text: #f0f0ff; --text2: #9090b0; --text3: #5a5a7a;
      --purple: #7c3aed; --purple2: #a855f7; --purple3: #c084fc;
      --green: #22c55e; --red: #ef4444; --orange: #f97316; --blue: #3b82f6;
      --sidebar-w: 220px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
           font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Topbar ── */
    .topbar {
      height: 54px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 12px;
      position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .topbar-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; text-decoration: none; color: var(--text); }
    .topbar-icon { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg,var(--purple),var(--purple2)); display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .topbar-logo span { color: var(--purple3); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .topbar-user { font-size: 12px; color: var(--text2); background: var(--surface2);
                   border: 1px solid var(--border2); border-radius: 8px; padding: 5px 11px; }
    .btn-logout { font-size: 12px; color: var(--text3); text-decoration: none;
                  padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); transition: .15s; }
    .btn-logout:hover { color: var(--text2); border-color: var(--border2); }

    /* ── Shell ── */
    .shell { display: flex; flex: 1; min-height: 0; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
      padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
      position: sticky; top: 54px; height: calc(100vh - 54px); overflow-y: auto;
    }
    .sidebar-section { font-size: 10px; color: var(--text3); font-weight: 700;
                       text-transform: uppercase; letter-spacing: 1px; padding: 12px 8px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 10px; border-radius: 9px; text-decoration: none;
      color: var(--text2); font-size: 13px; font-weight: 500; transition: .15s;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(124,58,237,.15); color: var(--purple3); border: 1px solid rgba(124,58,237,.2); }
    .nav-item .icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .nav-badge { margin-left: auto; background: var(--red); color: #fff; border-radius: 100px;
                 padding: 1px 6px; font-size: 10px; font-weight: 700; }
    .nav-badge.green { background: var(--green); }
    .nav-badge.orange { background: var(--orange); }

    /* ── Main content ── */
    .main { flex: 1; padding: 28px 24px; max-width: 1080px; min-width: 0; }

    /* ── Page header ── */
    .page-header { display: flex; align-items: center; justify-content: space-between;
                   margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 20px; font-weight: 800; }
    .page-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }

    /* ── Alerts ── */
    .alert { border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; }
    .alert-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25); color: #86efac; }
    .alert-info { background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.25); color: var(--purple3); }

    /* ── Cards stats ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .stat-icon { font-size: 22px; margin-bottom: 10px; }
    .stat-label { font-size: 11px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
    .stat-value { font-size: 26px; font-weight: 800; margin-top: 4px; }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* ── Table ── */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase;
         letter-spacing: .4px; padding: 12px 16px; text-align: left;
         background: var(--surface2); border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .td-muted { color: var(--text3); }
    .td-link { color: var(--purple3); text-decoration: none; font-weight: 600; }
    .td-link:hover { text-decoration: underline; }

    /* ── Status badges ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 100px;
             padding: 3px 10px; font-size: 11px; font-weight: 700; }
    .badge-blue   { background: rgba(59,130,246,.15); color: #93c5fd; border: 1px solid rgba(59,130,246,.2); }
    .badge-yellow { background: rgba(245,158,11,.15); color: #fcd34d; border: 1px solid rgba(245,158,11,.2); }
    .badge-green  { background: rgba(34,197,94,.15);  color: #86efac; border: 1px solid rgba(34,197,94,.2); }
    .badge-red    { background: rgba(239,68,68,.15);  color: #fca5a5; border: 1px solid rgba(239,68,68,.2); }
    .badge-gray   { background: rgba(107,114,128,.15); color: #d1d5db; border: 1px solid rgba(107,114,128,.2); }
    .badge-purple { background: rgba(124,58,237,.15); color: var(--purple3); border: 1px solid rgba(124,58,237,.2); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
           border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
           border: none; font-family: inherit; transition: .15s; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg,var(--purple),var(--purple2)); color: #fff; }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
    .btn-outline:hover { border-color: var(--purple); color: var(--purple3); }
    .btn-danger  { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
    .btn-danger:hover { background: rgba(239,68,68,.25); }
    .btn-green   { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3); color: #86efac; }
    .btn-green:hover { background: rgba(34,197,94,.25); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ── Forms ── */
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
    .form-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 18px; color: var(--text2); }
    .form-grid { display: grid; gap: 14px; }
    .form-grid-2 { grid-template-columns: 1fr 1fr; }
    .form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text2); font-weight: 600; }
    .form-control {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 9px 12px; font-size: 13px; font-family: inherit;
      outline: none; transition: .2s; width: 100%;
    }
    .form-control:focus { border-color: var(--purple); box-shadow: 0 0 0 2px rgba(124,58,237,.12); }
    textarea.form-control { resize: vertical; min-height: 90px; }
    select.form-control option { background: var(--surface2); }
    .form-hint { font-size: 11px; color: var(--text3); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 56px 20px; color: var(--text3); }
    .empty .icon { font-size: 40px; margin-bottom: 12px; }
    .empty p { font-size: 14px; margin-bottom: 16px; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 20px 16px; }
      .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      table { font-size: 12px; }
      th, td { padding: 10px 12px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <a href="/defesapro/app" class="topbar-logo">
      <div class="topbar-icon">⚖️</div>
      Defesa<span>Pro</span>
    </a>
    <div class="topbar-right">
      <div class="topbar-user">👤 {{ session.get('defesa_escritorio') or session.get('defesa_user_name','') }}</div>
      <a href="/defesapro/logout" class="btn-logout">Sair →</a>
    </div>
  </div>

  <div class="shell">
    <nav class="sidebar">
      <div class="sidebar-section">Menu</div>
      <a href="/defesapro/app"        class="nav-item {% if active=='dashboard'  %}active{% endif %}"><span class="icon">🏠</span> Dashboard</a>
      <a href="/defesapro/processos"  class="nav-item {% if active=='processos'  %}active{% endif %}"><span class="icon">📋</span> Processos</a>
      <a href="/defesapro/clientes"   class="nav-item {% if active=='clientes'   %}active{% endif %}"><span class="icon">👥</span> Clientes</a>
      <a href="/defesapro/peticoes"   class="nav-item {% if active=='peticoes'   %}active{% endif %}"><span class="icon">📄</span> Petições</a>
      <a href="/defesapro/prazos"     class="nav-item {% if active=='prazos'     %}active{% endif %}"><span class="icon">⏰</span> Prazos</a>
      <a href="/defesapro/financeiro" class="nav-item {% if active=='financeiro' %}active{% endif %}"><span class="icon">💰</span> Financeiro</a>
      <div class="sidebar-section" style="margin-top:auto">Conta</div>
      <a href="https://wa.me/5547991011351" target="_blank" class="nav-item"><span class="icon">💬</span> Suporte</a>
      <a href="/defesapro/logout" class="nav-item"><span class="icon">🚪</span> Sair</a>
    </nav>
    <div class="main">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
