<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Amigo Despachante</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07070f;color:#f0f0ff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  body::before{content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(59,130,246,.08) 0%,transparent 70%);pointer-events:none}
  .box{background:#080e18;border:1px solid rgba(59,130,246,.18);border-radius:24px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{text-align:center;font-size:48px;margin-bottom:10px}
  .title{text-align:center;font-size:22px;font-weight:900;color:#60a5fa;margin-bottom:4px}
  .sub{text-align:center;font-size:13px;color:#2a4a7f;margin-bottom:30px}
  .error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:13px;margin-bottom:20px;text-align:center}
  .form-group{margin-bottom:14px}
  label{display:block;font-size:11px;color:#2a4a7f;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
  input{width:100%;background:#050c18;border:1px solid rgba(59,130,246,.15);border-radius:12px;color:#f0f0ff;padding:12px 16px;font-size:15px;outline:none;transition:.2s}
  input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
  .btn{width:100%;padding:14px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s;font-family:inherit;box-shadow:0 0 24px rgba(59,130,246,.2)}
  .btn:hover{opacity:.9}
  .footer{text-align:center;margin-top:20px;font-size:13px;color:#444}
  .footer a{color:#60a5fa}
  .sucesso-box{text-align:center;padding:8px 0}
  .sucesso-icon{font-size:56px;margin-bottom:16px}
  .sucesso-title{font-size:18px;font-weight:800;color:#86efac;margin-bottom:8px}
  .sucesso-sub{font-size:13px;color:#2a4a7f;line-height:1.6;margin-bottom:24px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🚗</div>
  <div class="title">Amigo Despachante</div>

  {% if sucesso %}
  <div class="sucesso-box">
    <div class="sucesso-icon">✅</div>
    <div class="sucesso-title">Senha redefinida!</div>
    <p class="sucesso-sub">Sua senha foi atualizada com sucesso.</p>
    <a href="/amigo-despachante/entrar" class="btn" style="display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px">
      🔓 Entrar na plataforma
    </a>
  </div>
  {% else %}
  <div class="sub">Redefinir senha</div>
  {% if erro %}
  <div class="error">⚠️ {{ erro }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Telefone cadastrado</label>
      <input type="tel" name="phone" placeholder="(47) 99999-9999" autofocus required>
    </div>
    <div class="form-group">
      <label>Código de 6 dígitos</label>
      <input type="text" name="codigo" placeholder="123456" maxlength="6" pattern="\d{6}" inputmode="numeric" autocomplete="one-time-code" required>
    </div>
    <div class="form-group">
      <label>Nova senha</label>
      <input type="password" name="nova_senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
    </div>
    <button type="submit" class="btn">🔒 Redefinir senha</button>
  </form>
  <div class="footer"><a href="/amigo-despachante/esqueci-senha">← Solicitar novo código</a></div>
  {% endif %}
</div>
</body>
</html>
