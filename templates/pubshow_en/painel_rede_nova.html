<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova unidade — PUBSHOW</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#08080f;color:#f0f0ff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#13131f;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px 36px;width:100%;max-width:460px}
  .logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
  h1{font-size:20px;font-weight:800;margin-bottom:4px}
  .sub{font-size:13px;color:#8888aa;margin-bottom:28px;line-height:1.5}
  label{font-size:11px;font-weight:700;color:#8888aa;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
  input,select{width:100%;background:#1a1a2e;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;color:#f0f0ff;font-size:14px;outline:none;margin-bottom:14px;font-family:inherit}
  input:focus,select:focus{border-color:#ef4444}
  select option{background:#1a1a2e}
  .btn{width:100%;padding:14px;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;font-family:inherit}
  .btn:hover{opacity:.9}
  .erro{background:#2d0a0a;border:1px solid #ef444433;border-radius:10px;padding:12px 14px;color:#f87171;font-size:13px;margin-bottom:16px}
  .info{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:12px 14px;color:#4ade80;font-size:12px;margin-bottom:20px;line-height:1.6}
  .links{margin-top:20px;font-size:12px;text-align:center}
  .links a{color:#8888aa;text-decoration:none}
  .links a:hover{color:#f0f0ff}
</style>
</head>
<body>
<div class="box">
  <div class="logo">📺 PUBSHOW</div>
  <h1>Nova unidade</h1>
  <p class="sub">Adicione um novo local à sua rede. Ele herda automaticamente o plano Rede.</p>

  <div class="info">
    💡 A filial terá painel próprio com login separado. O Jukebox dela gera renda independente.
  </div>

  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

  <form method="POST">
    <label>Nome do local</label>
    <input type="text" name="nome" placeholder="Ex: Bar do Centro" required>

    <label>Tipo de estabelecimento</label>
    <select name="tipo">
      {% for k, v in tipos.items() %}
      <option value="{{ k }}">{{ v }}</option>
      {% endfor %}
    </select>

    <label>E-mail de acesso</label>
    <input type="email" name="email" placeholder="email@local.com" required>

    <label>Telefone/WhatsApp</label>
    <input type="tel" name="telefone" placeholder="(47) 99999-9999" required>

    <label>Senha de acesso</label>
    <input type="password" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">

    <button type="submit" class="btn">Cadastrar unidade →</button>
  </form>

  <div class="links">
    <a href="/pubshow-en/painel/rede">← Voltar para a rede</a>
  </div>
</div>
</body>
</html>
