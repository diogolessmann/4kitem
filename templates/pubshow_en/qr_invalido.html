<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code inválido — PUBSHOW</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#08080f;color:#f0f0ff;font-family:'Segoe UI',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{text-align:center;max-width:340px}
  .icon{font-size:72px;margin-bottom:20px}
  h1{font-size:22px;font-weight:900;margin-bottom:10px;color:#ef4444}
  p{font-size:14px;color:#8888aa;line-height:1.6;margin-bottom:24px}
  .dica{background:#13131f;border:1px solid rgba(255,255,255,.08);border-radius:12px;
        padding:16px;font-size:13px;color:#8888aa;line-height:1.6}
  .dica strong{color:#f0f0ff}
</style>
</head>
<body>
<div class="box">
  <div class="icon">📵</div>
  <h1>QR Code inválido</h1>
  <p>Este QR Code não é mais válido ou o estabelecimento atualizou o link de acesso.</p>
  <div class="dica">
    <strong>O que fazer?</strong><br>
    Escaneie o QR Code que está na mesa ou no balcão do bar para acessar o Jukebox atualizado.
  </div>
</div>
</body>
</html>
