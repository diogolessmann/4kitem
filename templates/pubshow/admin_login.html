<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — PUBSHOW</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#08080f;color:#f0f0ff;font-family:'Segoe UI',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#13131f;border:1px solid rgba(255,255,255,.08);border-radius:20px;
       padding:40px 32px;width:100%;max-width:360px}
  .logo{font-size:24px;font-weight:900;background:linear-gradient(135deg,#ef4444,#f97316);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        text-align:center;margin-bottom:6px}
  .sub{text-align:center;font-size:12px;color:#8888aa;margin-bottom:32px;letter-spacing:.5px;text-transform:uppercase}
  label{font-size:12px;font-weight:700;color:#8888aa;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  input[type=password]{
    width:100%;background:#0a0a12;border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:13px 16px;color:#f0f0ff;font-size:15px;
    font-family:inherit;outline:none;margin-bottom:20px;
  }
  input[type=password]:focus{border-color:#ef4444}
  button{width:100%;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;
         border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;
         cursor:pointer;font-family:inherit}
  button:hover{opacity:.9}
  .erro{background:#2d0a0a;border:1px solid #ef444433;border-radius:10px;
        padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">📺 PUBSHOW</div>
  <div class="sub">Acesso Administrativo</div>
  {% if erro %}<div class="erro">⚠️ {{ erro }}</div>{% endif %}
  <form method="POST">
    <label>Senha de administrador</label>
    <input type="password" name="senha" placeholder="••••••••" autofocus>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
