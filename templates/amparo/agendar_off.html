<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendamento indisponível — Amparo</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f7f5f1;color:#20302f;line-height:1.55}
  .wrap{max-width:460px;margin:0 auto;padding:60px 18px;text-align:center}
  .muted{color:#6b7c7a}
</style>
</head>
<body>
<div class="wrap">
  <div style="font-size:40px">🌿</div>
  <h1 style="font-size:22px">Agendamento indisponível no momento</h1>
  <p class="muted">
    {% if cfg %}{{ cfg['psi_nome'] }} ainda não abriu o autoagendamento online.
    {% else %}Este link não está ativo.{% endif %}
    Entre em contato diretamente para marcar sua sessão.
  </p>
  <p class="muted" style="font-size:12px;margin-top:24px">Em emergência: CVV 188 · SAMU 192.</p>
</div>
</body>
</html>
