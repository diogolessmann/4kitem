<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Amparo — cuidado entre as sessões{% endblock %}</title>
<meta name="description" content="{% block meta_desc %}Amparo: a ferramenta que mantém seu paciente no processo entre as sessões. Para psicólogos — acompanhe pelo WhatsApp, reduza faltas e desistências. Pare de perder paciente.{% endblock %}">
<meta property="og:title" content="Amparo — cuidado entre as sessões">
<meta property="og:description" content="O cuidado que continua nas 167 horas fora do divã. Menos faltas, menos desistências.">
<meta property="og:type" content="website">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://4kitem.com.br/amparo">
<style>
  :root{
    --teal:#2f7d77; --teal-d:#256460; --accent:#3a9d94; --sage:#e7efec;
    --bg:#f7f5f1; --card:#ffffff; --ink:#20302f; --muted:#6b7c7a; --line:#e4e1da;
    --warn:#b4533a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.55}
  a{color:var(--teal);text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
  .logo{font-weight:800;font-size:21px;color:var(--teal);letter-spacing:-.5px}
  .logo span{color:var(--accent)}
  nav a{margin-left:18px;font-weight:600;color:var(--ink)}
  nav a.btn{background:var(--teal);color:#fff;padding:9px 16px;border-radius:9px}
  .btn{display:inline-block;background:var(--teal);color:#fff;border:0;padding:12px 22px;
       border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
  .btn:hover{background:var(--teal-d)}
  .btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;
        box-shadow:0 1px 3px rgba(30,50,48,.04)}
  h1{font-size:34px;line-height:1.2;letter-spacing:-.8px;margin:.2em 0}
  h2{font-size:24px;letter-spacing:-.4px}
  .muted{color:var(--muted)}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  input[type=text],input[type=email],input[type=password],input[type=tel]{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .erro{background:#fdece7;color:var(--warn);border:1px solid #f3c9bd;border-radius:10px;
        padding:12px 14px;margin:14px 0;font-size:14px}
  .pill{display:inline-block;background:var(--sage);color:var(--teal-d);font-weight:700;
        font-size:12px;padding:5px 12px;border-radius:30px}
  footer{margin-top:60px;border-top:1px solid var(--line);background:var(--card)}
  footer .wrap{padding:24px 20px;font-size:13px;color:var(--muted);display:flex;
               justify-content:space-between;flex-wrap:wrap;gap:10px}
  footer a{color:var(--muted)}
  .center{text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="/amparo" class="logo">Am<span>paro</span></a>
  <nav>
    <a href="/amparo/entrar">Entrar</a>
    <a href="/amparo/cadastro" class="btn">Começar grátis</a>
  </nav>
</div></header>

<main class="wrap" style="padding-top:40px">
  {% block content %}{% endblock %}
</main>

<footer><div class="wrap">
  <div>© Amparo · cuidado entre as sessões</div>
  <div>
    <a href="/amparo/termos">Termos</a> ·
    <a href="/amparo/privacidade">Privacidade</a> ·
    <span>Em emergência: CVV 188 · SAMU 192</span>
  </div>
</div></footer>
</body>
</html>
