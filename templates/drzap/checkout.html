<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRZAP — Pagamento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0b1220;color:#eaf0ff;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#101a2e;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-size:18px;font-weight:900}.logo b{color:#3b82f6}
.back{color:#7dabff;text-decoration:none;font-size:14px}
.wrap{max-width:420px;margin:0 auto;padding:24px 18px}
.resumo{background:#121c30;border:1px solid rgba(59,130,246,.3);border-radius:14px;padding:18px;text-align:center;margin-bottom:18px}
.resumo .cr{font-size:20px;font-weight:900}
.resumo .b{color:#86efac;font-size:13px;margin-top:2px}
.resumo .v{font-size:30px;font-weight:900;color:#3b82f6;margin-top:8px}
.card{background:#121c30;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px}
label{display:block;font-size:13px;font-weight:600;color:#c3d2ec;margin-bottom:6px}
input{width:100%;background:#0b1220;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;padding:13px 14px;font-size:16px;font-family:inherit;outline:none}
input:focus{border-color:#3b82f6}
.hint{font-size:11.5px;color:#7b8aa8;margin-top:6px}
.btn{width:100%;padding:15px;border:none;border-radius:11px;margin-top:16px;cursor:pointer;font-family:inherit;
     background:linear-gradient(135deg,#16a34a,#22c55e);color:#06280f;font-size:16px;font-weight:800}
.erro{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div class="top">
  <div class="logo">⚖️ DR<b>ZAP</b></div>
  <a href="/drzap/comprar" class="back">← Trocar pacote</a>
</div>
<div class="wrap">
  <div class="resumo">
    <div class="cr">{{ p.rotulo }}</div>
    {% if p.bonus %}<div class="b">{{ p.bonus }} 🎁</div>{% endif %}
    <div class="v">R$ {{ '%.2f'|format(p.preco)|replace('.', ',') }}</div>
  </div>
  <div class="card">
    {% if erro %}<div class="erro">⚠️ {{ erro }}</div>{% endif %}
    <form method="POST">
      <label>Seu CPF (exigido pelo banco para o PIX)</label>
      <input type="text" name="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required
             oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')">
      <div class="hint">🔒 Usado só para gerar a cobrança no banco. Seguro.</div>
      <button type="submit" class="btn">⚡ Gerar PIX</button>
    </form>
  </div>
</div>
</body>
</html>
