<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova senha · Baú SC</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#09090f;color:#f0f0ff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .box{background:#13131f;border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:40px 36px;width:100%;max-width:420px}
    .logo{text-align:center;margin-bottom:6px;font-size:32px}
    .logo-text{text-align:center;font-size:22px;font-weight:900;color:#a78bfa;margin-bottom:4px}
    .sub{text-align:center;font-size:13px;color:#8888aa;margin-bottom:28px}
    .error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:13px;margin-bottom:20px}
    .success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:12px 16px;color:#86efac;font-size:13px;margin-bottom:20px}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:12px;color:#8888aa;margin-bottom:5px;font-weight:500}
    input{width:100%;background:#1a1a2e;border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#f0f0ff;padding:11px 14px;font-size:14px;outline:none;transition:.2s}
    input:focus{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.12)}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,#7c3aed,#a78bfa);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .footer{text-align:center;margin-top:20px;font-size:13px;color:#8888aa}
    .footer a{color:#a78bfa;text-decoration:none}
  </style>
</head>
<body>
<div class="box">
  <div class="logo">🔐</div>
  <div class="logo-text">Baú SC</div>
  <div class="sub">Criar nova senha</div>

  {% if erro %}
  <div class="error">{{ erro }}</div>
  {% endif %}

  {% if sucesso %}
  <div class="success">{{ sucesso }}</div>
  <div class="footer"><a href="/bau/entrar">→ Fazer login</a></div>
  {% elif not token %}
  <div class="error">Link inválido. Solicite um novo link de recuperação.</div>
  <div class="footer"><a href="/bau/esqueci-senha">Solicitar novo link</a></div>
  {% else %}
  <form method="post">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="form-group">
      <label>Nova senha</label>
      <input type="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required autofocus>
    </div>
    <div class="form-group">
      <label>Confirmar nova senha</label>
      <input type="password" name="password_confirm" placeholder="Repita a senha" required>
    </div>
    <button type="submit" class="btn">🔐 Salvar nova senha</button>
  </form>
  <div class="footer"><a href="/bau/entrar">← Voltar ao login</a></div>
  {% endif %}
</div>
</body>
</html>
