<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — 4KITEM SaaS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#08080f;color:#f0f0ff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#13131f;border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:36px 32px;width:100%;max-width:380px}
  .logo{text-align:center;font-size:20px;font-weight:900;color:#6366f1;margin-bottom:24px}
  .error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:13px;margin-bottom:20px}
  .form-group{margin-bottom:16px}
  label{display:block;font-size:13px;color:#8888aa;margin-bottom:6px}
  input{width:100%;background:#1a1a2e;border:1px solid rgba(255,255,255,0.07);border-radius:10px;color:#f0f0ff;padding:10px 14px;font-size:14px;outline:none;transition:.2s}
  input:focus{border-color:#6366f1}
  .btn{width:100%;padding:12px;background:#6366f1;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🔐 4KITEM SaaS Admin</div>
  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Senha de administrador</label>
      <input type="password" name="password" placeholder="••••••••" required autofocus>
    </div>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>
</body>
</html>
