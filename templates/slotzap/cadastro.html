<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlotZap — Criar conta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#09090f;color:#f0f0ff;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#13131f;border:1px solid rgba(255,255,255,.07);border-radius:20px;
      padding:36px 32px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.logo{text-align:center;margin-bottom:22px}
.logo-icon{font-size:40px}
.logo h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#6366f1,#a855f7);
         -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.plano-sel{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);border-radius:10px;
           padding:10px 14px;font-size:13px;margin-bottom:18px;text-align:center;color:#c9d6e2}
.plano-sel b{color:#fff}
.form-group{margin-bottom:13px}
label{display:block;font-size:12px;font-weight:600;color:#8888aa;margin-bottom:5px}
input{width:100%;background:#0d0d1a;border:1px solid rgba(255,255,255,.1);border-radius:8px;
      color:#f0f0ff;padding:11px 13px;font-size:14px;font-family:inherit;outline:none}
input:focus{border-color:#6366f1}
.btn{width:100%;padding:13px;border-radius:9px;border:none;
     background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;
     font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;
     padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center}
.foot{text-align:center;margin-top:18px;font-size:13px;color:#8888aa}
.foot a{color:#a5b4fc;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🎯</div>
    <h1>Criar conta</h1>
  </div>
  <div class="plano-sel">Plano escolhido: <b>SlotZap {{ planos[plano].label }} — R$ {{ planos[plano].price }}/mês</b></div>
  {% if erro %}<div class="err">{{ erro }}</div>{% endif %}
  <form method="POST" action="/slotzap/cadastro/{{ plano }}">
    <input type="hidden" name="plano" value="{{ plano }}">
    <div class="form-group">
      <label>Nome completo</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>WhatsApp (com DDD)</label>
      <input type="text" name="phone" placeholder="47999999999" required>
    </div>
    <div class="form-group">
      <label>CPF ou CNPJ</label>
      <input type="text" name="cpf_cnpj" placeholder="000.000.000-00" required>
    </div>
    <div class="form-group">
      <label>Senha (mín. 6 caracteres)</label>
      <input type="password" name="senha" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn">Continuar para o pagamento →</button>
  </form>
  <div class="foot">Já tem conta? <a href="/slotzap/entrar">Entrar</a></div>
</div>
</body>
</html>
