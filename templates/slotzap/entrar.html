<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlotZap — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#09090f;color:#f0f0ff;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#13131f;border:1px solid rgba(255,255,255,.07);border-radius:20px;
      padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:44px;margin-bottom:10px}
.logo h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#6366f1,#a855f7);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{font-size:13px;color:#6666aa;margin-top:4px}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#8888aa;margin-bottom:6px}
input{width:100%;background:#0d0d1a;border:1px solid rgba(255,255,255,.1);border-radius:8px;
      color:#f0f0ff;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
input:focus{border-color:#6366f1}
.btn{width:100%;padding:12px;border-radius:9px;border:none;
     background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;
     font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.btn:hover{opacity:.9}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;
     padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🎯</div>
    <h1>SlotZap</h1>
    <p>Venda de slots numerados com PIX automático</p>
  </div>
  {% if erro %}<div class="err">{{ erro }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="seu@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" name="senha" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Entrar →</button>
  </form>
</div>
</body>
</html>
