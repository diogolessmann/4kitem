<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajustes — MandaJr</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B0B12;color:#F4F4F8;font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5;min-height:100vh}
  a{text-decoration:none;color:inherit}
  .wrap{max-width:440px;margin:0 auto;padding:0 18px 40px}
  .topbar{display:flex;align-items:center;gap:12px;height:58px}
  .back{font-size:22px;color:#cbd5e1}
  .topbar b{font-size:17px;font-weight:800}
  .toast{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#86efac;font-size:13px;font-weight:600;border-radius:10px;padding:10px 14px;margin-bottom:14px;text-align:center}
  .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;font-size:13px;font-weight:600;border-radius:10px;padding:11px 14px;margin-bottom:14px;text-align:center}
  .card{background:#13131c;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:20px;margin-bottom:16px}
  .card h3{font-size:13px;font-weight:800;color:#F97316;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:700;color:#cbd5e1;margin:14px 0 7px}
  label:first-of-type{margin-top:0}
  label .hint{font-weight:500;color:#8b8b9e;font-size:12px}
  input{width:100%;background:#0B0B12;border:1.5px solid rgba(255,255,255,.1);border-radius:11px;padding:13px 14px;color:#fff;font-size:16px;outline:none}
  input:focus{border-color:#F97316}
  .preco-wrap{position:relative}
  .preco-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8b8b9e;font-weight:700}
  .preco-wrap input{padding-left:42px}
  .pix-note{font-size:12px;color:#86efac;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:10px 12px;margin-top:8px}
  .btn{width:100%;background:linear-gradient(135deg,#ea580c,#f97316);color:#fff;font-size:15px;font-weight:800;border:none;border-radius:12px;padding:15px;margin-top:18px;cursor:pointer}
  .btn-sec{background:transparent;border:1px solid rgba(255,255,255,.15);color:#cbd5e1}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="/mandaja/painel" class="back">←</a>
    <b>Ajustes</b>
  </div>

  {% if request.args.get('ok') == '1' %}<div class="toast">✅ Salvo!</div>{% endif %}
  {% if request.args.get('ok') == 'senha' %}<div class="toast">✅ Senha alterada!</div>{% endif %}
  {% if error_pass %}<div class="err">⚠️ {{ error_pass }}</div>{% endif %}

  <!-- Dados da loja -->
  <form method="POST" action="/mandaja/configuracoes" id="lojaForm">
    <input type="hidden" name="action" value="save">
    <div class="card">
      <h3>🏪 Minha loja</h3>

      <label>Nome do negócio</label>
      <input type="text" name="name" value="{{ store.name }}" required>

      <label>Chave PIX <span class="hint">(onde o dinheiro cai)</span></label>
      <input type="text" name="pix_chave" value="{{ store.pix_chave or '' }}" placeholder="CPF, celular, e-mail ou aleatória">
      <div class="pix-note">💳 É nessa chave que o cliente paga, <b>direto na sua conta</b>.</div>

      <label>Nome do recebedor <span class="hint">(aparece no PIX do cliente)</span></label>
      <input type="text" name="pix_nome" value="{{ store.pix_nome or store.name }}" placeholder="Ex: João da Silva">

      <label>Taxa de entrega <span class="hint">(deixe 0 se for grátis ou só retirada)</span></label>
      <div class="preco-wrap">
        <span>R$</span>
        <input type="text" name="delivery_fee" id="taxaInput" inputmode="decimal" value="{{ '%.2f'|format(store.delivery_fee or 0)|replace('.',',') }}">
      </div>

      <button type="submit" class="btn">💾 Salvar</button>
    </div>
  </form>

  <!-- Trocar senha -->
  <form method="POST" action="/mandaja/configuracoes">
    <input type="hidden" name="action" value="change_pass">
    <div class="card">
      <h3>🔒 Trocar senha</h3>
      <label>Senha atual</label>
      <input type="password" name="senha_atual" placeholder="••••••" required>
      <label>Nova senha <span class="hint">(mín. 6)</span></label>
      <input type="password" name="senha_nova" placeholder="••••••" minlength="6" required>
      <button type="submit" class="btn btn-sec">Alterar senha</button>
    </div>
  </form>
</div>

<script>
  document.getElementById('lojaForm').addEventListener('submit', function(){
    const t=document.getElementById('taxaInput');
    t.value=t.value.replace(/\./g,'').replace(',','.');
  });
</script>
</body>
</html>
