<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Loja — MandaJá</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070710;color:#EEEEF5;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:40px 16px}
  .card{background:#0E0E1C;border:1px solid rgba(249,115,22,.2);border-radius:20px;padding:40px 36px;width:100%;max-width:500px;margin:0 auto}
  .logo{text-align:center;margin-bottom:28px}
  .logo-icon{font-size:42px;display:block;margin-bottom:8px}
  .logo-name{font-size:22px;font-weight:900;color:#F97316}
  .logo-sub{font-size:13px;color:#9090B0;margin-top:4px}
  .section-label{font-size:11px;font-weight:700;color:#F97316;text-transform:uppercase;letter-spacing:1.5px;margin:24px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(249,115,22,.1)}
  label{display:block;font-size:13px;font-weight:600;color:#9090B0;margin-bottom:6px}
  input,select{width:100%;background:#07070E;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;color:#EEEEF5;font-size:14px;outline:none;transition:.2s}
  input:focus,select:focus{border-color:#F97316}
  select option{background:#07070E}
  .field{margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,#EA580C,#F97316);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:.2s;margin-top:8px}
  .btn:hover{opacity:.9}
  .error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 14px;font-size:13px;color:#FCA5A5;margin-bottom:18px}
  .trial-badge{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);border-radius:10px;padding:12px 16px;font-size:13px;color:#86EFAC;text-align:center;margin-bottom:20px}
  .links{text-align:center;margin-top:20px;font-size:13px;color:#55557A}
  .links a{color:#F97316}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🛵</span>
    <div class="logo-name">MandaJá</div>
    <div class="logo-sub">Criar minha loja delivery</div>
  </div>

  <div class="trial-badge">🎉 14 dias grátis — sem cartão de crédito!</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="section-label">📦 Dados da Loja</div>

    <div class="field">
      <label>Nome da loja *</label>
      <input type="text" name="name" placeholder="Ex: Burguer do João" required>
    </div>

    <div class="field">
      <label>Tipo de negócio</label>
      <select name="category">
        {% for key, label in cats.items() %}
        <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Cidade</label>
      <input type="text" name="city" placeholder="Joinville, Blumenau, Florianópolis...">
    </div>

    <div class="section-label">👤 Seus Dados</div>

    <div class="field">
      <label>Seu nome *</label>
      <input type="text" name="owner_name" placeholder="Nome completo" required>
    </div>

    <div class="grid2">
      <div class="field">
        <label>E-mail *</label>
        <input type="email" name="email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label>WhatsApp *</label>
        <input type="tel" name="phone" placeholder="47 99999-9999" required>
      </div>
    </div>

    <div class="section-label">🔐 Senha de Acesso</div>

    <div class="field">
      <label>Senha (mín. 6 caracteres) *</label>
      <input type="password" name="senha" placeholder="Crie uma senha forte" required minlength="6">
    </div>

    <button type="submit" class="btn">🚀 Criar minha loja grátis</button>
  </form>

  <div class="links" style="margin-top:20px">
    Já tem conta? <a href="/mandaja/entrar">Entrar</a><br>
    <br><a href="/mandaja">← Voltar</a>
  </div>
</div>
</body>
</html>
