<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinar {{ plano.label }} · SalaTV</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0f1e; color: #e2e8f0; font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,.15) 0%, transparent 65%);
      padding: 24px 16px;
    }
    .box {
      background: #111827; border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 480px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; justify-content: center; }
    .logo-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #60a5fa); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .logo-text { font-size: 22px; font-weight: 800; }
    .logo-text span { color: #60a5fa; }
    .plan-card {
      background: #1e293b; border: 1px solid rgba(96,165,250,.3);
      border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 24px;
    }
    .plan-emoji { font-size: 32px; margin-bottom: 8px; }
    .plan-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .plan-price { font-size: 14px; color: #60a5fa; font-weight: 700; margin-top: 4px; }
    .features { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; text-align: left; }
    .feature { font-size: 12px; color: #94a3b8; }
    .feature::before { content: '✓ '; color: #60a5fa; font-weight: 700; }
    .section-title { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin: 0 0 10px; }
    .form-group { margin-bottom: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; font-size: 12px; color: #64748b; margin-bottom: 5px; font-weight: 500; }
    input { width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; color: #e2e8f0; padding: 11px 14px; font-size: 14px; outline: none; transition: .2s; font-family: inherit; }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.12); }
    .sep { border: none; border-top: 1px solid rgba(255,255,255,.06); margin: 20px 0; }
    .billing-opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .billing-opt {
      display: flex; align-items: center; gap: 14px;
      background: #1e293b; border: 2px solid rgba(255,255,255,.08);
      border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color .15s;
    }
    .billing-opt:has(input:checked) { border-color: #3b82f6; background: rgba(59,130,246,.08); }
    .billing-opt input { accent-color: #3b82f6; width: 16px; height: 16px; cursor: pointer; }
    .billing-label { font-size: 14px; font-weight: 600; }
    .billing-desc { font-size: 12px; color: #4b5563; margin-top: 2px; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity .15s; }
    .btn:hover { opacity: .88; }
    .erro { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #fca5a5; margin-bottom: 16px; text-align: center; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: #4b5563; text-decoration: none; }
    .back:hover { color: #94a3b8; }
    .secure { text-align: center; font-size: 11px; color: #4b5563; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <div class="logo-icon">📺</div>
      <div class="logo-text">Kids<span>Curator</span></div>
    </div>

    <div class="plan-card">
      <div class="plan-emoji">📺</div>
      <div class="plan-name">{{ plano.label }}</div>
      <div class="plan-price">{{ plano.price }}</div>
      <div class="features">
        {% for f in plano.features %}<div class="feature">{{ f }}</div>{% endfor %}
      </div>
    </div>

    {% if erro %}
    <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="post">
      <div class="section-title">Seus dados</div>

      <div class="form-group">
        <label>Nome completo do responsável *</label>
        <input type="text" name="name" placeholder="Seu nome completo" required>
      </div>
      <div class="form-group">
        <label>Nome do estabelecimento *</label>
        <input type="text" name="empresa" placeholder="Ex: Clínica São Lucas" required>
      </div>
      <div class="grid2">
        <div class="form-group">
          <label>E-mail *</label>
          <input type="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>WhatsApp *</label>
          <input type="tel" name="phone" placeholder="(47) 99999-9999" required>
        </div>
      </div>
      <div class="form-group">
        <label>CPF ou CNPJ *</label>
        <input type="text" name="cpf_cnpj" placeholder="000.000.000-00" required>
      </div>

      <div class="form-group">
        <label>Cupom de desconto (opcional)</label>
        <div style="display:flex;gap:8px;align-items:stretch">
          <input type="text" id="cupom" name="cupom" placeholder="Tem um cupom?" autocomplete="off" style="flex:1;text-transform:uppercase">
          <button type="button" onclick="aplicarCupom()" style="padding:0 18px;border:none;border-radius:10px;background:#6366f1;color:#fff;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">Aplicar</button>
        </div>
        <div id="cupom-msg" style="font-size:13px;margin-top:8px;display:none"></div>
      </div>

      <hr class="sep">
      <div class="section-title">Forma de pagamento</div>

      <div class="billing-opts">
        <label class="billing-opt">
          <input type="radio" name="billing_type" value="PIX" checked>
          <div>
            <div class="billing-label">⚡ PIX</div>
            <div class="billing-desc">Aprovação em minutos</div>
          </div>
        </label>
        <label class="billing-opt">
          <input type="radio" name="billing_type" value="BOLETO">
          <div>
            <div class="billing-label">🏦 Boleto Bancário</div>
            <div class="billing-desc">Vencimento em 3 dias úteis</div>
          </div>
        </label>
        <label class="billing-opt">
          <input type="radio" name="billing_type" value="CREDIT_CARD">
          <div>
            <div class="billing-label">💳 Cartão de Crédito</div>
            <div class="billing-desc">Aprovação em até 1 hora</div>
          </div>
        </label>
      </div>

      <button type="submit" class="btn">📺 Assinar {{ plano.label }} →</button>
    </form>

    <div class="secure">🔒 Pagamento seguro · Cancele quando quiser</div>
    <a href="/kids" class="back">← Saiba mais sobre o SalaTV</a>
  </div>

  <script>
  async function aplicarCupom() {
    const inp = document.getElementById('cupom');
    const msg = document.getElementById('cupom-msg');
    const code = (inp.value || '').trim();
    if (!code) { return; }
    msg.style.display = 'block';
    msg.style.color = '#9090a8';
    msg.textContent = 'Validando...';
    try {
      const r = await fetch(`/api/kids/validar-cupom/${encodeURIComponent(code)}?plano={{ plano_key }}`);
      const d = await r.json();
      if (d.ok) {
        msg.style.color = '#22c55e';
        msg.innerHTML = `✅ Cupom <b>${d.codigo}</b> aplicado: <b>${d.desconto_pct}% OFF</b> · de R$ ${d.preco_original.toFixed(2).replace('.',',')} por <b>R$ ${d.preco_final.toFixed(2).replace('.',',')}</b>`;
      } else {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ ' + (d.erro || 'Cupom inválido');
      }
    } catch (e) {
      msg.style.color = '#ef4444';
      msg.textContent = '❌ Não consegui validar agora.';
    }
  }
  </script>
</body>
</html>
