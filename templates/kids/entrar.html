<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsCurator — Entrar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07070f;color:#f0f0ff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  body::before{content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(99,102,241,.1) 0%,transparent 70%);pointer-events:none}
  .box{background:#0e0e1e;border:1px solid rgba(99,102,241,.18);border-radius:24px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{text-align:center;font-size:48px;margin-bottom:10px}
  .title{text-align:center;font-size:22px;font-weight:900;color:#818cf8;margin-bottom:4px}
  .sub{text-align:center;font-size:13px;color:#6060a0;margin-bottom:30px}
  .error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:13px;margin-bottom:20px;text-align:center}
  label{display:block;font-size:11px;color:#6060a0;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
  input{width:100%;background:#090914;border:1px solid rgba(99,102,241,.15);border-radius:12px;color:#f0f0ff;padding:13px 16px;font-size:20px;font-weight:800;outline:none;transition:.2s;letter-spacing:4px;text-align:center;font-family:'Courier New',monospace;text-transform:uppercase}
  input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
  input::placeholder{letter-spacing:1px;font-size:14px;font-weight:400}
  .btn{width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#818cf8);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;transition:.2s;font-family:inherit;box-shadow:0 0 24px rgba(99,102,241,.25)}
  .btn:hover{opacity:.9;transform:translateY(-1px)}
  .help{text-align:center;margin-top:22px;font-size:12px;color:#4040700}
  .help a{color:#818cf8}
  .info{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.12);border-radius:10px;padding:12px 14px;font-size:12px;color:#6060a0;text-align:center;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <div class="logo">📺</div>
  <div class="title">KidsCurator</div>
  <div class="sub">TV personalizada para seu espaço</div>
  {% if erro %}
  <div class="error">⚠️ {{ erro }}</div>
  {% endif %}
  <form method="POST">
    <label>Seu código de acesso</label>
    <input type="text" name="code" placeholder="Ex: ABC123" maxlength="10" required autofocus autocomplete="off" autocorrect="off" spellcheck="false">
    <button type="submit" class="btn">▶ Acessar minha TV</button>
  </form>
  <div class="info">
    🔒 O código de acesso foi enviado pelo suporte no momento da contratação.<br>
    Dúvidas? <strong>WhatsApp</strong> com a equipe 4KITEM.
  </div>
</div>
</body>
</html>
